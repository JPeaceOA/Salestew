<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="SaleStew — Nigerian Product Sales &amp; Inventory Tracker"/>
  <meta name="theme-color" content="#4e9463"/>
  <title>SaleStew v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>/* ═══════════════════════════════════════════════════════════
   TOKENS.CSS — Design tokens, reset, theme
   ═══════════════════════════════════════════════════════════ */

/* ── DARK THEME (default) ─────────────────────────────────── */
:root {
  --bg:         #090d0a;
  --bg2:        #0d1210;
  --bg3:        #111814;
  --card:       #111710;
  --card-h:     #151d14;
  --overlay:    rgba(0,0,0,0.75);

  --border:     #1a2a1a;
  --border-2:   #243524;
  --border-3:   #2e4230;

  --text:       #c4d4c0;
  --text-2:     #748e70;
  --text-3:     #445842;

  --green:      #4e9463;
  --green-lt:   #6db882;
  --green-dk:   #326644;
  --green-bg:   rgba(78,148,99,0.09);
  --green-glow: rgba(78,148,99,0.15);

  --orange:     #b8622a;
  --orange-lt:  #d4813e;
  --orange-dk:  #7a3e18;
  --orange-bg:  rgba(184,98,42,0.09);

  --purple:     #7252a0;
  --purple-lt:  #9472c0;
  --purple-dk:  #4e3470;
  --purple-bg:  rgba(114,82,160,0.09);

  --up:         #4e9463;
  --down:       #a04848;
  --warn:       #b8622a;
  --info:       #7252a0;

  --radius:     2px;
  --shadow:     0 4px 24px rgba(0,0,0,0.5);
  --transition: 0.2s ease;
}

/* ── LIGHT THEME ─────────────────────────────────────────── */
/* Primary = bright orange  |  Secondary = deep purple  |  Accent = forest green */
[data-theme="light"] {
  --bg:         #fdf6ee;
  --bg2:        #f5ece0;
  --bg3:        #ede0cf;
  --card:       #f9f1e6;
  --card-h:     #f0e4d0;
  --overlay:    rgba(60,30,10,0.55);

  --border:     #e0c9b0;
  --border-2:   #d0b490;
  --border-3:   #c09a70;

  --text:       #2a1a08;
  --text-2:     #6b3f18;
  --text-3:     #9a6a3a;

  /* Primary: orange */
  --green:      #c45e10;
  --green-lt:   #e07828;
  --green-dk:   #8c3e08;
  --green-bg:   rgba(196,94,16,0.1);
  --green-glow: rgba(196,94,16,0.18);

  /* Secondary: purple */
  --orange:     #5a3680;
  --orange-lt:  #7a52a8;
  --orange-dk:  #3c2060;
  --orange-bg:  rgba(90,54,128,0.1);

  /* Accent: green */
  --purple:     #2d7a4a;
  --purple-lt:  #3da060;
  --purple-dk:  #1d5434;
  --purple-bg:  rgba(45,122,74,0.1);

  --up:         #2d7a4a;
  --down:       #b83030;
  --warn:       #c45e10;
  --info:       #5a3680;

  --shadow:     0 4px 24px rgba(100,50,0,0.15);
}

/* ── RESET ───────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; font-size:14px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  line-height: 1.55;
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background 0.25s, color 0.25s;
}

/* Grain overlay */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none; z-index:9000;
}

/* Scrollbar */
::-webkit-scrollbar        { width:5px; height:5px; }
::-webkit-scrollbar-track  { background:var(--bg); }
::-webkit-scrollbar-thumb  { background:var(--border-2); border-radius:2px; }

/* Typography */
h1,h2,h3,h4 { font-family:'Playfair Display',serif; line-height:1.1; font-weight:700; }
a { color:inherit; text-decoration:none; }
input,select,button,textarea { font-family:'DM Mono',monospace; font-size:0.85rem; }

/* ── Utilities ───────────────────────────────────────────── */
.u-green  { color:var(--green); }
.u-orange { color:var(--orange); }
.u-purple { color:var(--purple); }
.u-muted  { color:var(--text-3); }
.u-up     { color:var(--up); }
.u-down   { color:var(--down); }
.u-warn   { color:var(--warn); }
.u-mono   { font-family:'DM Mono',monospace; }
.u-serif  { font-family:'Playfair Display',serif; }

.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

/* ── Theme toggle button ─────────────────────────────────── */
.theme-btn {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-2);
  padding: 0.28rem 0.65rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all var(--transition);
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.theme-btn:hover { border-color:var(--green); color:var(--green); }

/* ═══════════════════════════════════════════════════════════
   COMPONENTS.CSS
   ═══════════════════════════════════════════════════════════ */

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  border-radius: var(--radius);
  white-space: nowrap;
  transition: background var(--transition), color var(--transition),
              border-color var(--transition), transform var(--transition);
}

.btn:active { transform: scale(0.97); }

.btn--primary {
  background: var(--green);
  color: var(--bg);
  padding: 0.5rem 1.1rem;
  font-weight: 500;
}
.btn--primary:hover { background: var(--green-lt); }

.btn--secondary {
  background: var(--orange);
  color: var(--bg);
  padding: 0.5rem 1.1rem;
  font-weight: 500;
}
.btn--secondary:hover { background: var(--orange-lt); }

.btn--accent {
  background: var(--purple);
  color: #fff;
  padding: 0.5rem 1.1rem;
  font-weight: 500;
}
.btn--accent:hover { background: var(--purple-lt); }

.btn--ghost {
  background: transparent;
  color: var(--text-2);
  padding: 0.5rem 1rem;
  border: 1px solid var(--border-2);
}
.btn--ghost:hover { border-color: var(--text-3); color: var(--text); }

.btn--danger {
  background: transparent;
  color: var(--text-3);
  padding: 0.25rem 0.6rem;
  font-size: 0.6rem;
  border: 1px solid transparent;
}
.btn--danger:hover { color: var(--down); border-color: rgba(160,72,72,0.3); }

.btn--icon {
  background: transparent;
  color: var(--text-2);
  padding: 0.4rem 0.5rem;
  border: 1px solid var(--border-2);
  font-size: 0.75rem;
}
.btn--icon:hover { color: var(--text); border-color: var(--text-3); }

.btn--sm {
  padding: 0.3rem 0.7rem;
  font-size: 0.6rem;
}

.btn--full { width: 100%; justify-content: center; }

/* ── BADGES ──────────────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 0.15rem 0.55rem;
  font-size: 0.58rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: var(--radius);
  white-space: nowrap;
}

.badge--green  { background: var(--green-bg);  color: var(--green);  border: 1px solid rgba(78,148,99,0.25); }
.badge--orange { background: var(--orange-bg); color: var(--orange); border: 1px solid rgba(184,98,42,0.25); }
.badge--purple { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(114,82,160,0.25); }
.badge--red    { background: rgba(160,72,72,0.1); color: var(--down); border: 1px solid rgba(160,72,72,0.2); }
.badge--warn   { background: var(--orange-bg); color: var(--warn);   border: 1px solid rgba(184,98,42,0.3); }
.badge--info   { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(114,82,160,0.25); }

/* ── PANEL ───────────────────────────────────────────────── */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  max-height: 500px;
}

.panel__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.2rem;
}

.panel__title {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-3);
}

.panel__action {
  font-size: 0.62rem;
  color: var(--green);
  cursor: pointer;
  letter-spacing: 0.06em;
}

/* ── STAT CARD ───────────────────────────────────────────── */
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 1.3rem 1.5rem;
  position: relative;
  overflow: hidden;
  transition: background var(--transition);
  border-radius: var(--radius);
}

.stat-card:hover { background: var(--card-h); }

.stat-card__accent {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  opacity: 0;
  transition: opacity var(--transition);
}
.stat-card:hover .stat-card__accent { opacity: 1; }

.stat-card__label {
  font-size: 0.58rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 0.55rem;
}

.stat-card__value {
  font-family: 'Playfair Display', serif;
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1;
  transition: color var(--transition);
}

.stat-card__delta {
  font-size: 0.62rem;
  margin-top: 0.45rem;
  color: var(--text-3);
}

/* ── FORM ────────────────────────────────────────────────── */
.form-group { margin-bottom: 1rem; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.8rem;
}

.form-label {
  display: block;
  font-size: 0.58rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 0.35rem;
}

.form-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border-2);
  color: var(--text);
  padding: 0.55rem 0.75rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  outline: none;
  border-radius: var(--radius);
  transition: border-color var(--transition);
  -webkit-appearance: none;
}

.form-input:focus { border-color: var(--green-dk); box-shadow: 0 0 0 3px var(--green-glow); }
.form-input::placeholder { color: var(--text-3); }

.form-input--error { border-color: var(--down); }
.form-error {
  font-size: 0.6rem;
  color: var(--down);
  margin-top: 0.25rem;
  display: none;
}
.form-error.is-visible { display: block; }

/* ── MODAL ───────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  backdrop-filter: blur(5px);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-overlay.is-open { display: flex; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  width: 520px;
  max-width: 100%;
  max-height: 90dvh;
  overflow-y: auto;
  padding: 2rem;
  animation: modal-in 0.22s ease;
  box-shadow: var(--shadow);
}

.modal--sm { width: 400px; }
.modal--lg { width: 680px; }

@keyframes modal-in {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}

.modal__title {
  font-size: 1.2rem;
  color: var(--text);
}

.modal__close {
  background: none;
  border: none;
  color: var(--text-3);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 0.2rem 0.4rem;
  transition: color var(--transition);
}
.modal__close:hover { color: var(--text); }

.modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.8rem;
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

/* ── TABLE ───────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.72rem;
  min-width: 640px;
}

.data-table th {
  text-align: left;
  font-size: 0.56rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 0.5rem 0.8rem;
  border-bottom: 1px solid var(--border);
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: color var(--transition);
  font-family: 'DM Mono', monospace;
}
.data-table th:hover { color: var(--text-2); }
.data-table th.sorted { color: var(--green); }

.data-table td {
  padding: 0.68rem 0.8rem;
  border-bottom: 1px solid rgba(26,42,26,0.5);
  vertical-align: middle;
}

.data-table tbody tr:hover td { background: rgba(78,148,99,0.025); }
.data-table tbody tr:last-child td { border-bottom: none; }

/* ── SEARCH + FILTERS ────────────────────────────────────── */
.search-input {
  background: var(--bg3);
  border: 1px solid var(--border-2);
  color: var(--text);
  padding: 0.42rem 0.8rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  outline: none;
  border-radius: var(--radius);
  width: 220px;
  transition: border-color var(--transition);
}
.search-input:focus { border-color: var(--green-dk); }
.search-input::placeholder { color: var(--text-3); }

.filter-tabs { display: flex; }

.filter-tab {
  padding: 0.38rem 0.9rem;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  border: 1px solid var(--border-2);
  background: transparent;
  color: var(--text-3);
  font-family: 'DM Mono', monospace;
  margin-left: -1px;
  transition: all var(--transition);
}
.filter-tab:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.filter-tab:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
.filter-tab:hover { color: var(--text-2); }
.filter-tab.is-active {
  background: var(--green-bg);
  color: var(--green);
  border-color: var(--green-dk);
  z-index: 1;
  position: relative;
}

/* ── TOAST ───────────────────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 9000;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}

.toast {
  background: var(--bg2);
  border-left: 3px solid var(--green);
  color: var(--text);
  padding: 0.75rem 1.2rem;
  font-size: 0.7rem;
  min-width: 240px;
  max-width: 340px;
  box-shadow: var(--shadow);
  animation: toast-in 0.25s ease;
  pointer-events: auto;
}
.toast--warn   { border-left-color: var(--warn); }
.toast--error  { border-left-color: var(--down); }
.toast--info   { border-left-color: var(--purple); }

@keyframes toast-in {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ── DROPDOWN ────────────────────────────────────────────── */
.dropdown { position: relative; }

.dropdown__menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  background: var(--bg2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  min-width: 180px;
  z-index: 200;
  display: none;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.dropdown__menu.is-open { display: block; }

.dropdown__item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 0.6rem 1rem;
  font-size: 0.7rem;
  color: var(--text-2);
  background: none;
  border: none;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.06em;
}
.dropdown__item:hover { background: var(--bg3); color: var(--text); }
.dropdown__item--danger:hover { color: var(--down); }
.dropdown__divider { border-top: 1px solid var(--border); margin: 0.2rem 0; }

/* ── PROGRESS BAR ────────────────────────────────────────── */
.progress {
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
}
.progress__fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* ── EMPTY STATE ─────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-3);
}
.empty-state__icon { font-size: 2rem; margin-bottom: 0.75rem; opacity: 0.4; }
.empty-state__text { font-size: 0.75rem; }

/* ── CATEGORY DOT ────────────────────────────────────────── */
.cat-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
  flex-shrink: 0;
}

/* ── ALERT BANNER ────────────────────────────────────────── */
.alert {
  padding: 0.75rem 1rem;
  border-radius: var(--radius);
  font-size: 0.72rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.5rem;
}
.alert--warn { background: var(--orange-bg); border: 1px solid rgba(184,98,42,0.3); color: var(--orange-lt); }
.alert--error { background: rgba(160,72,72,0.1); border: 1px solid rgba(160,72,72,0.25); color: #c47070; }
.alert--info  { background: var(--purple-bg); border: 1px solid rgba(114,82,160,0.3); color: var(--purple-lt); }

/* ── SUPPLIER CARDS ──────────────────────────────────────── */
.supplier-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.25rem;
  margin-bottom: 1.75rem;
}

.supplier-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.4rem;
  transition: background var(--transition), border-color var(--transition);
}
.supplier-card:hover { background: var(--card-h); border-color: var(--border-2); }

.supplier-card__header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 0.85rem; gap: 0.75rem;
}
.supplier-card__name {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700; color: var(--text);
}
.supplier-card__lead { font-size: 0.65rem; color: var(--text-3); margin-top: 0.2rem; }
.supplier-card__meta { font-size: 0.7rem; color: var(--text-2); line-height: 1.8; margin-bottom: 0.75rem; }
.supplier-card__notes {
  font-size: 0.68rem; color: var(--text-3); background: var(--bg3);
  border-left: 2px solid var(--border-2); padding: 0.5rem 0.75rem;
  border-radius: 0 var(--radius) var(--radius) 0; margin-bottom: 0.85rem;
}
.supplier-card__footer {
  display: flex; align-items: center; gap: 0.6rem;
  padding-top: 0.75rem; border-top: 1px solid var(--border);
  font-size: 0.68rem; color: var(--text-3); flex-wrap: wrap;
}

/* ── IMPORT ──────────────────────────────────────────────── */
.import-steps {
  display: flex; gap: 0; margin-bottom: 1.75rem;
  border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
.import-step {
  flex: 1; padding: 0.7rem 1rem;
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-3); background: var(--bg2);
  border-right: 1px solid var(--border); transition: all var(--transition);
}
.import-step:last-child { border-right: none; }
.import-step span {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem; flex-shrink: 0;
}
.import-step.is-active { color: var(--green); background: var(--green-bg); }
.import-step.is-active span { background: var(--green); color: var(--bg); border-color: var(--green); }
.import-step.is-done { color: var(--text-2); }
.import-step.is-done span { background: var(--green-dk); color: var(--green-lt); border-color: var(--green-dk); }

.import-dropzone {
  border: 2px dashed var(--border-2); border-radius: var(--radius);
  padding: 3rem 2rem; text-align: center;
  cursor: pointer; transition: all var(--transition);
  background: var(--bg3);
}
.import-dropzone:hover, .import-dropzone.is-drag {
  border-color: var(--green); background: var(--green-bg);
}
.import-dropzone__icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.6; }
.import-dropzone__text { font-size: 0.8rem; color: var(--text-2); margin-bottom: 0.35rem; }
.import-dropzone__sub  { font-size: 0.65rem; color: var(--text-3); }

.import-type-card {
  border: 1px solid var(--border-2); border-radius: var(--radius);
  padding: 1.25rem; text-align: center; cursor: pointer;
  transition: all var(--transition); display: block;
}
.import-type-card:hover     { border-color: var(--green); background: var(--green-bg); }
.import-type-card.is-active { border-color: var(--green); background: var(--green-bg); color: var(--green); }

/* ── BULK ACTION BAR ─────────────────────────────────────── */
.bulk-bar {
  display: flex; align-items: center; gap: 0.5rem;
  background: var(--green-bg); border: 1px solid var(--green-dk);
  border-radius: var(--radius); padding: 0.35rem 0.75rem;
  flex-wrap: wrap;
}

/* ── SELECTED TABLE ROW ──────────────────────────────────── */
.data-table tbody tr.is-selected td {
  background: var(--green-bg);
}

/* ── TOAST WITH ACTION ───────────────────────────────────── */
.toast { display: flex; align-items: center; gap: 0.75rem; }
.toast__msg { flex: 1; }
.toast__action {
  background: transparent; border: 1px solid var(--border-2);
  color: var(--text-2); padding: 0.2rem 0.6rem;
  font-family: 'DM Mono', monospace; font-size: 0.6rem;
  letter-spacing: 0.08em; cursor: pointer; border-radius: var(--radius);
  white-space: nowrap; flex-shrink: 0;
  transition: border-color var(--transition), color var(--transition);
}
.toast__action:hover { border-color: var(--green); color: var(--green); }

/* ── DANGER SOLID BUTTON ─────────────────────────────────── */
.btn--danger-solid {
  background: rgba(160,72,72,0.15);
  color: var(--down);
  padding: 0.5rem 1.1rem;
  border: 1px solid rgba(160,72,72,0.35);
}
.btn--danger-solid:hover { background: rgba(160,72,72,0.25); }

/* ── MAIN GRID 3-1 ───────────────────────────────────────── */
.main-grid--3-1 { grid-template-columns: 1fr 340px; }

@media (max-width: 1100px) {
  .main-grid--3-1 { grid-template-columns: 1fr; }
  .supplier-grid  { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .import-steps { flex-direction: column; }
  .import-step  { border-right: none; border-bottom: 1px solid var(--border); }
  .import-step:last-child { border-bottom: none; }
}

/* ════════════════════════════════════════════════════════════
   GROUP B COMPONENTS
   ════════════════════════════════════════════════════════════ */

/* ── DATE RANGE PICKER ───────────────────────────────────── */
.date-picker-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.date-picker-presets {
  display: flex;
  gap: 0;
}

.date-preset {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-3);
  padding: 0.3rem 0.7rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  margin-left: -1px;
  transition: all var(--transition);
  white-space: nowrap;
}
.date-preset:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.date-preset:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
.date-preset:hover       { color: var(--text-2); z-index: 1; }
.date-preset.is-active   {
  background: var(--green-bg);
  color: var(--green);
  border-color: var(--green-dk);
  z-index: 1;
}

.date-picker-custom {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.date-picker-label {
  font-size: 0.6rem;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-align: right;
}

/* ── GOALS PANEL ─────────────────────────────────────────── */
.goals-panel {
  
 }

.goals-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}

.goals-empty {
  font-size: 0.72rem;
  color: var(--text-3);
  padding: 1.5rem 0 0.5rem;
  grid-column: 1 / -1;
}

.goal-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  transition: border-color var(--transition);
}
.goal-card:hover       { border-color: var(--border-2); }
.goal-card--done       { border-color: var(--green-dk); background: var(--green-bg); }

.goal-card__top {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  margin-bottom: 0.65rem;
}
.goal-card__icon  { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
.goal-card__label {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
}
.goal-card__meta  { font-size: 0.6rem; color: var(--text-3); margin-top: 0.15rem; }

.goal-card__values {
  display: flex;
  align-items: baseline;
  gap: 0.3rem;
  margin-bottom: 0.35rem;
  flex-wrap: wrap;
}
.goal-card__actual { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; }
.goal-card__target { font-size: 0.65rem; color: var(--text-3); }
.goal-card__pct    { font-size: 0.65rem; font-weight: 600; }

/* ── BELL / ALERTS ───────────────────────────────────────── */
.bell-wrap { position: relative; }

.bell-btn {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-2);
  padding: 0.28rem 0.55rem;
  font-size: 0.85rem;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all var(--transition);
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.2rem;
}
.bell-btn:hover { border-color: var(--green); color: var(--green); }

.bell-badge {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 16px;
  height: 16px;
  background: var(--down);
  color: #fff;
  border-radius: 8px;
  font-size: 0.55rem;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
  font-family: 'DM Mono', monospace;
  pointer-events: none;
  line-height: 1;
}

.alerts-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  width: 340px;
  max-width: calc(100vw - 2rem);
  background: var(--bg2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 400;
  max-height: 420px;
  overflow-y: auto;
  display: none;
}
.alerts-panel.is-open { display: block; }

.alerts-panel__head {
  display: flex;
  align-items: center;
  padding: 0.7rem 1rem;
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg2);
  z-index: 1;
}

.alerts-panel__clear-all {
  background: none;
  border: none;
  color: var(--text-3);
  font-size: 0.58rem;
  cursor: pointer;
  margin-left: auto;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.06em;
  padding: 0.1rem 0.3rem;
  transition: color var(--transition);
}
.alerts-panel__clear-all:hover { color: var(--green); }

.alerts-panel__empty {
  padding: 1.5rem 1rem;
  font-size: 0.7rem;
  color: var(--text-3);
  text-align: center;
  line-height: 1.6;
}

.alerts-item {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
}
.alerts-item:last-child   { border-bottom: none; }
.alerts-item:hover        { background: var(--bg3); }
.alerts-item--warn        { border-left: 3px solid var(--warn); }
.alerts-item--error       { border-left: 3px solid var(--down); }
.alerts-item--info        { border-left: 3px solid var(--purple); }

.alerts-item__icon        { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
.alerts-item__body        { flex: 1; min-width: 0; }
.alerts-item__title       { font-size: 0.7rem; font-weight: 500; color: var(--text); margin-bottom: 0.15rem; }
.alerts-item__msg         { font-size: 0.65rem; color: var(--text-3); line-height: 1.4; }
.alerts-item__action {
  background: none;
  border: none;
  color: var(--green);
  font-size: 0.6rem;
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  padding: 0;
  margin-top: 0.3rem;
  letter-spacing: 0.06em;
  transition: color var(--transition);
  display: block;
}
.alerts-item__action:hover { color: var(--green-lt); }

.alerts-item__dismiss {
  background: none;
  border: none;
  color: var(--text-3);
  font-size: 0.65rem;
  cursor: pointer;
  padding: 0.1rem 0.2rem;
  flex-shrink: 0;
  transition: color var(--transition);
  margin-top: 1px;
}
.alerts-item__dismiss:hover { color: var(--down); }

/* ── RESPONSIVE — date picker on small screens ───────────── */
@media (max-width: 820px) {
  .date-picker-presets { flex-wrap: wrap; }
  .date-preset { border-radius: var(--radius) !important; margin: 0; }
  .date-picker-custom { flex-direction: column; align-items: flex-start; }
  .goals-grid { grid-template-columns: 1fr; }
  .alerts-panel { right: -80px; width: 300px; }
}
@media (max-width: 480px) {
  .alerts-panel { right: -120px; width: 280px; }
}

/* ════════════════════════════════════════════════════════════
   GROUP C COMPONENTS — inline editing + global search
   ════════════════════════════════════════════════════════════ */

/* ── EDITABLE CELLS ──────────────────────────────────────── */
.editable-cell {
  cursor: pointer;
  transition: background var(--transition);
  position: relative;
}
.editable-cell:hover {
  background: var(--green-bg) !important;
  outline: 1px dashed rgba(78,148,99,0.4);
  outline-offset: -2px;
}
.editable-cell.is-editing {
  padding: 0 !important;
  background: var(--bg2) !important;
  outline: 2px solid var(--green);
  outline-offset: -2px;
}

.inline-edit__input {
  width: 100%;
  background: var(--bg2);
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  padding: 0.45rem 0.6rem;
  min-width: 60px;
}

.inline-edit__input[type="select"],
select.inline-edit__input {
  appearance: none;
  cursor: pointer;
}

/* ── SEARCH NAV BUTTON ───────────────────────────────────── */
.search-nav-btn {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-3);
  padding: 0.28rem 0.65rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  cursor: pointer;
  border-radius: var(--radius);
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 0.35rem;
  white-space: nowrap;
}
.search-nav-btn:hover { border-color: var(--green); color: var(--green); }
.search-nav-btn__kbd {
  font-family: 'DM Mono', monospace;
  font-size: 0.55rem;
  background: var(--bg3);
  border: 1px solid var(--border-2);
  border-radius: 3px;
  padding: 0.05rem 0.3rem;
  color: var(--text-3);
}

/* ── SEARCH PALETTE OVERLAY ──────────────────────────────── */
.search-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  z-index: 1000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 10vh;
  animation: fadeIn 0.12s ease;
}

@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

.search-palette {
  background: var(--bg2);
  border: 1px solid var(--border-2);
  border-radius: calc(var(--radius) + 2px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  width: 100%;
  max-width: 560px;
  overflow: hidden;
  animation: slideDown 0.15s ease;
}

@keyframes slideDown { from { transform:translateY(-12px); opacity:0; } to { transform:none; opacity:1; } }

.search-palette__input-wrap {
  display: flex;
  align-items: center;
  padding: 0 1rem;
  border-bottom: 1px solid var(--border);
  gap: 0.6rem;
}
.search-palette__icon { font-size: 1rem; flex-shrink: 0; }
.search-palette__input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 0.9rem;
  padding: 1rem 0;
  letter-spacing: 0.02em;
}
.search-palette__input::placeholder { color: var(--text-3); }
.search-palette__esc {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  background: var(--bg3);
  border: 1px solid var(--border-2);
  border-radius: 3px;
  padding: 0.1rem 0.4rem;
  color: var(--text-3);
  flex-shrink: 0;
}

.search-results {
  max-height: 340px;
  overflow-y: auto;
  padding: 0.4rem 0;
}

.search-empty {
  text-align: center;
  padding: 1.5rem;
  font-size: 0.72rem;
  color: var(--text-3);
}

.search-result {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.65rem 1rem;
  cursor: pointer;
  transition: background var(--transition);
  border-radius: 2px;
}
.search-result:hover,
.search-result.is-active { background: var(--green-bg); }
.search-result.is-active  { outline: 1px solid rgba(78,148,99,0.3); }

.search-result__icon   { font-size: 1rem; flex-shrink: 0; width: 22px; text-align: center; }
.search-result__body   { flex: 1; min-width: 0; }
.search-result__title  { font-size: 0.78rem; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-result__meta   { font-size: 0.62rem; color: var(--text-3); margin-top: 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-result__type   {
  font-size: 0.55rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 0.1rem 0.4rem;
  flex-shrink: 0;
  white-space: nowrap;
}

.search-palette__footer {
  display: flex;
  gap: 1.25rem;
  padding: 0.55rem 1rem;
  border-top: 1px solid var(--border);
  background: var(--bg3);
}
.search-palette__footer span {
  font-size: 0.6rem;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.search-palette__footer kbd {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  background: var(--bg2);
  border: 1px solid var(--border-2);
  border-radius: 3px;
  padding: 0.05rem 0.35rem;
  color: var(--text-2);
}

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media (max-width: 820px) {
  .search-nav-btn__kbd { display: none; }
  .search-palette { max-width: calc(100vw - 2rem); }
  .search-overlay { padding-top: 5vh; }
}
@media (max-width: 480px) {
  .search-nav-btn { padding: 0.28rem 0.4rem; font-size: 0; }
  .search-nav-btn::before { content: '🔍'; font-size: 0.85rem; }
}

/* ════════════════════════════════════════════════════════════
   GROUP D COMPONENTS — shortcuts, print
   ════════════════════════════════════════════════════════════ */

/* ── SHORTCUTS HINT BUTTON ───────────────────────────────── */
.shortcuts-hint-btn {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-3);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.shortcuts-hint-btn:hover { border-color:var(--green); color:var(--green); }

/* ── KEYBOARD SHORTCUT CHEAT-SHEET ───────────────────────── */
.ksheet-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.12s ease;
}

.ksheet {
  background: var(--bg2);
  border: 1px solid var(--border-2);
  border-radius: calc(var(--radius) + 2px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  width: 100%;
  max-width: 420px;
  overflow: hidden;
  animation: slideDown 0.15s ease;
}

.ksheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1.1rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
}

.ksheet__close {
  background: none;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  font-size: 0.75rem;
  padding: 0.1rem 0.3rem;
  transition: color var(--transition);
}
.ksheet__close:hover { color: var(--down); }

.ksheet__body {
  padding: 0.85rem 1.1rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
}

.ksheet__group-label {
  font-size: 0.58rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 0.6rem;
}

.ksheet__row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.4rem;
}

.ksheet__row kbd {
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  background: var(--bg3);
  border: 1px solid var(--border-2);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0.1rem 0.45rem;
  color: var(--text-2);
  white-space: nowrap;
  min-width: 36px;
  text-align: center;
}

.ksheet__row span {
  font-size: 0.68rem;
  color: var(--text-2);
}

@media (max-width: 480px) {
  .ksheet__body { grid-template-columns: 1fr; }
  .shortcuts-hint-btn { display: none; }
}

/* ════════════════════════════════════════════════════════════
   PRINT STYLES (Feature 7)
   ════════════════════════════════════════════════════════════ */
@media print {
  /* ── hide interactive chrome ──────────────────────── */
  .nav,
  .nav__drawer,
  .low-stock-banner,
  .page-header__controls,
  .table-controls__right,
  .bulk-bar,
  .filter-tabs,
  .btn,
  .search-overlay,
  .ksheet-overlay,
  .alerts-panel,
  .toast-container,
  [data-del],
  [data-del-inv],
  [data-del-goal],
  [data-edit],
  #btnAddSale,
  #btnPrint,
  #btnPrintInv,
  #btnAddGoal,
  #btnAddProduct,
  #btnSettings,
  #btnExportInv,
  #btnExportAllCSV,
  #btnSeedData,
  #btnClearData,
  #btnBackupExport,
  #btnBackupImport,
  #selectAll,
  .row-check,
  .nav__hamburger { display: none !important; }

  /* ── page setup ───────────────────────────────────── */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    background: #fff !important;
    color: #0f1410 !important;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
  }

  .page {
    padding: 0 !important;
    max-width: 100% !important;
  }

  /* ── print header ─────────────────────────────────── */
  .page-header {
    border-bottom: 2px solid #1a2a1a !important;
    padding-bottom: 12px !important;
    margin-bottom: 20px !important;
    background: transparent !important;
  }

  .page-header::before {
    content: 'SaleStew';
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: #0f1410;
    margin-bottom: 4px;
  }

  .page-header__title {
    font-size: 13px !important;
    color: #1a2a1a !important;
  }

  .page-header__sub {
    font-size: 9px !important;
    color: #748e70 !important;
  }

  /* ── panels ───────────────────────────────────────── */
  .panel {
    background: transparent !important;
    border: 1px solid #d4e8d4 !important;
    box-shadow: none !important;
    break-inside: avoid;
    margin-bottom: 16px !important;
  }

  /* ── stats strip ──────────────────────────────────── */
  .stats-strip {
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 8px !important;
    margin-bottom: 16px !important;
  }

  .stat-card {
    background: #f5faf5 !important;
    border: 1px solid #d4e8d4 !important;
    padding: 10px 12px !important;
  }

  .stat-card__value {
    font-size: 1.1rem !important;
    color: #2d6040 !important;
  }

  .stat-card__label { color: #748e70 !important; }

  /* ── charts — hide (can't render in print) ────────── */
  .chart-outer,
  canvas { display: none !important; }

  /* ── tables ───────────────────────────────────────── */
  .table-wrap { overflow: visible !important; }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10px;
  }

  .data-table thead th {
    background: #0f1410 !important;
    color: #c4d4c0 !important;
    padding: 6px 8px;
    font-size: 8px;
    letter-spacing: 0.1em;
    text-align: left;
  }

  .data-table tbody td {
    padding: 5px 8px;
    border-bottom: 1px solid #e0ece0;
    color: #1a2a1a !important;
    background: transparent !important;
  }

  .data-table tbody tr:nth-child(even) td {
    background: #f5faf5 !important;
  }

  /* ── badges ───────────────────────────────────────── */
  .badge {
    border: 1px solid currentColor !important;
    background: transparent !important;
    color: inherit !important;
    font-size: 7px !important;
  }

  /* ── goals grid ───────────────────────────────────── */
  .goals-grid {
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 8px !important;
  }

  .goal-card {
    background: #f5faf5 !important;
    border: 1px solid #d4e8d4 !important;
    padding: 8px !important;
    break-inside: avoid;
  }

  /* ── print footer ─────────────────────────────────── */
  body::after {
    content: 'SaleStew // Printed ' attr(data-print-date) ' · Confidential';
    display: block;
    margin-top: 24px;
    font-size: 8px;
    color: #748e70;
    border-top: 1px solid #d4e8d4;
    padding-top: 8px;
    text-align: center;
  }
}

/* ════════════════════════════════════════════════════════════
   GROUP E — Settings, Activity Log, Polish
   ════════════════════════════════════════════════════════════ */

/* ── PAGE TRANSITION ─────────────────────────────────────── */
.page {
  animation: pageFadeIn 0.18s ease both;
}
@keyframes pageFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* ── SETTINGS PAGE ───────────────────────────────────────── */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1.25rem;
}

.settings-section {
  /* inherits .panel — just needs padding already there */
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.85rem 0;
  border-bottom: 1px solid var(--border);
}
.settings-row:last-child { border-bottom: none; }

.settings-row__label { flex: 1; min-width: 0; }
.settings-row__name  {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 0.15rem;
}
.settings-row__desc  { font-size: 0.62rem; color: var(--text-3); line-height: 1.4; }

.settings-toggle-group { display: flex; }
.settings-toggle {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-3);
  padding: 0.3rem 0.75rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  cursor: pointer;
  margin-left: -1px;
  transition: all var(--transition);
  white-space: nowrap;
}
.settings-toggle:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.settings-toggle:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
.settings-toggle:hover       { color: var(--text-2); z-index: 1; }
.settings-toggle.is-active   {
  background: var(--green-bg);
  color: var(--green);
  border-color: var(--green-dk);
  z-index: 1;
}

.settings-input-sm {
  width: 80px;
  padding: 0.3rem 0.5rem;
  text-align: right;
}

.settings-divider {
  height: 1px;
  background: var(--border);
  margin: 0.5rem 0;
}

/* ── ACTIVITY LOG PAGE ───────────────────────────────────── */
.activity-list {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.activity-empty {
  text-align: center;
  padding: 3rem 1rem;
  font-size: 0.72rem;
  color: var(--text-3);
  line-height: 1.8;
}

.activity-day-group {
  margin-bottom: 0.5rem;
}

.activity-day-label {
  font-size: 0.58rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 0.6rem 0 0.35rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
  position: sticky;
  top: 58px;
  background: var(--bg2);
  z-index: 1;
}

.activity-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid rgba(26,42,26,0.4);
  transition: background var(--transition);
}
.activity-item:hover { background: var(--bg3); margin: 0 -1.5rem; padding-left: 1.5rem; padding-right: 1.5rem; }
.activity-item:last-child { border-bottom: none; }

.activity-item--add    { border-left: 2px solid var(--green);  padding-left: 0.65rem; }
.activity-item--delete { border-left: 2px solid var(--down);   padding-left: 0.65rem; }
.activity-item--edit   { border-left: 2px solid var(--purple); padding-left: 0.65rem; }

.activity-item__icon {
  font-size: 0.95rem;
  flex-shrink: 0;
  width: 20px;
  text-align: center;
}

.activity-item__body {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  flex-wrap: wrap;
}

.activity-item__action {
  font-size: 0.72rem;
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
}

.activity-item__detail {
  font-size: 0.65rem;
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 320px;
}

.activity-item__meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.1rem;
  flex-shrink: 0;
}

.activity-item__user {
  font-size: 0.6rem;
  color: var(--green);
  white-space: nowrap;
}

.activity-item__time {
  font-size: 0.58rem;
  color: var(--text-3);
  white-space: nowrap;
}

/* ── POLISH — stat card hover ────────────────────────────── */
.stat-card {
  transition: border-color var(--transition), transform var(--transition);
}
.stat-card:hover {
  border-color: var(--border-3);
  transform: translateY(-1px);
}

/* ── POLISH — data table row hover ──────────────────────── */
.data-table tbody tr {
  transition: background var(--transition);
}
.data-table tbody tr:hover td {
  background: var(--green-bg) !important;
}

/* ── POLISH — auth page entrance ────────────────────────── */
.auth-card {
  animation: authCardIn 0.3s cubic-bezier(0.34, 1.2, 0.64, 1) both;
}
@keyframes authCardIn {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

/* ── POLISH — panel entrance ─────────────────────────────── */
.panel {
  animation: panelFadeIn 0.2s ease both;
}
@keyframes panelFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ── POLISH — toast slide in ─────────────────────────────── */
.toast {
  animation: toastSlideIn 0.22s cubic-bezier(0.34, 1.2, 0.64, 1) both;
}
@keyframes toastSlideIn {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: none; }
}

/* ── POLISH — modal entrance ─────────────────────────────── */
.modal {
  animation: modalIn 0.18s cubic-bezier(0.34, 1.1, 0.64, 1) both;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(-8px); }
  to   { opacity: 1; transform: none; }
}

/* ── POLISH — nav active indicator ──────────────────────── */
.nav__links a.is-active {
  position: relative;
}
.nav__links a.is-active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 2px;
  background: var(--green);
  border-radius: 1px;
}

/* ── POLISH — goal card entrance ─────────────────────────── */
.goal-card {
  animation: panelFadeIn 0.25s ease both;
}

/* ── POLISH — progress bar fill animation ────────────────── */
.progress__fill {
  transition: width 0.5s cubic-bezier(0.34, 1.1, 0.64, 1);
}

/* ── POLISH — empty state ────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
}
.empty-state__icon { font-size: 2rem; margin-bottom: 0.75rem; opacity: 0.5; }
.empty-state__text { font-size: 0.72rem; color: var(--text-3); line-height: 1.8; }

/* ── POLISH — dropdown menu animation ───────────────────── */
.dropdown__menu {
  animation: dropIn 0.14s ease both;
  transform-origin: top right;
}
@keyframes dropIn {
  from { opacity: 0; transform: scale(0.95) translateY(-4px); }
  to   { opacity: 1; transform: none; }
}

/* ── RESPONSIVE — settings ───────────────────────────────── */
@media (max-width: 820px) {
  .settings-grid { grid-template-columns: 1fr; }
  .settings-row  { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
  .activity-item__detail { max-width: 180px; }
  .activity-item:hover { margin: 0; padding-left: 0.65rem; }
}
@media (max-width: 480px) {
  .activity-item__meta { display: none; }
  .settings-input-sm { width: 70px; }
}

/* ── PRINT — hide activity/settings controls ─────────────── */
@media print {
  .settings-toggle-group,
  .settings-input-sm,
  #btnSaveThresh,
  #btnSaveRate,
  #btnChangePass,
  #btnClearLog,
  #logSearch,
  #logTypeFilter,
  #btnClearLogPage { display: none !important; }
  .activity-item:hover { background: transparent !important; margin: 0 !important; padding-left: 0.65rem !important; }
}

/* ════════════════════════════════════════════════════════════
   GROUP E — Settings, Activity Log, polish
   ════════════════════════════════════════════════════════════ */

/* ── PAGE ENTRANCE ANIMATION ─────────────────────────────── */
.page {
  animation: pageIn 0.18s ease both;
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* ── NAV SESSION TIMER ───────────────────────────────────── */
#sessionTimer {
  font-family: 'DM Mono', monospace;
  color: var(--green);
  font-variant-numeric: tabular-nums;
}

/* ── SETTINGS EXTRA POLISH ───────────────────────────────── */
.settings-section {
  transition: border-color var(--transition);
}
.settings-section:hover {
  border-color: var(--border-2);
}

/* ── ACTIVITY LOG — polished empty state ─────────────────── */
.activity-empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-3);
  font-size: 0.72rem;
  line-height: 1.8;
}

/* ── ACTIVITY LOG — hover on items ──────────────────────── */
.activity-item {
  border-radius: 2px;
  transition: background var(--transition), padding var(--transition);
}

/* ── ACTIVITY DAY GROUP ──────────────────────────────────── */
.activity-day-group + .activity-day-group {
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--border);
}

/* ── RESPONSIVE adjustments for settings nav link ────────── */
@media (max-width: 820px) {
  .nav__links li:last-child { display: none; } /* hide Settings from collapsed nav — it's in drawer */
}

/* ═══════════════════════════════════════════════════════════
   LAYOUT.CSS — Nav, page shell, grids, responsive
   ═══════════════════════════════════════════════════════════ */

/* ── AUTH ────────────────────────────────────────────────── */
.auth-page {
  min-height:100dvh; display:flex; align-items:center;
  justify-content:center; padding:1.5rem; background:var(--bg);
}
.auth-card {
  background:var(--bg2); border:1px solid var(--border-2);
  border-radius:var(--radius); padding:2.5rem;
  width:100%; max-width:420px; box-shadow:var(--shadow);
}
.auth-card__logo {
  font-family:'Playfair Display',serif; font-size:1.5rem;
  font-weight:900; color:var(--green); margin-bottom:0.25rem;
}
.auth-card__sub {
  font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--text-3); margin-bottom:2rem; padding-bottom:1.5rem;
  border-bottom:1px solid var(--border);
}
.auth-card__title { font-size:1.1rem; margin-bottom:1.5rem; color:var(--text); }
.auth-card__switch { margin-top:1.25rem; text-align:center; font-size:0.68rem; color:var(--text-3); }
.auth-card__switch a { color:var(--green); cursor:pointer; }
.auth-card__switch a:hover { color:var(--green-lt); }

/* ── NAV ─────────────────────────────────────────────────── */
.nav {
  position:sticky; top:0; z-index:300;
  display:flex; align-items:center; justify-content:space-between;
  height:58px; padding:0 1.5rem;
  background:var(--bg2); border-bottom:1px solid var(--border);
  gap:0.75rem;
}
.nav__brand {
  font-family:'Playfair Display',serif; font-size:1.2rem;
  font-weight:900; color:var(--green); white-space:nowrap; flex-shrink:0;
}
.nav__brand-sub {
  font-family:'DM Mono',monospace; font-weight:400;
  font-size:0.65rem; color:var(--text-3); margin-left:0.45rem;
}
.nav__links {
  display:flex; list-style:none; gap:0.15rem;
  flex:1; justify-content:center;
}
.nav__links a {
  display:flex; align-items:center; gap:0.4rem;
  color:var(--text-3); font-size:0.6rem; letter-spacing:0.1em;
  text-transform:uppercase; padding:0.35rem 0.65rem;
  border-radius:var(--radius); transition:color var(--transition),background var(--transition);
  white-space:nowrap;
}
.nav__links a:hover      { color:var(--text-2); background:var(--bg3); }
.nav__links a.is-active  { color:var(--green); background:var(--green-bg); }

.nav__right {
  display:flex; align-items:center; gap:0.6rem; flex-shrink:0;
}
.nav__currency { display:flex; }
.currency-btn {
  background:transparent; border:1px solid var(--border-2);
  color:var(--text-3); padding:0.28rem 0.55rem;
  font-family:'DM Mono',monospace; font-size:0.6rem;
  cursor:pointer; transition:all var(--transition); letter-spacing:0.06em;
}
.currency-btn:first-child { border-radius:var(--radius) 0 0 var(--radius); }
.currency-btn:last-child  { border-radius:0 var(--radius) var(--radius) 0; margin-left:-1px; }
.currency-btn.is-active   { background:var(--green-bg); color:var(--green); border-color:var(--green-dk); z-index:1; }

.nav__user {
  display:flex; align-items:center; gap:0.5rem; cursor:pointer;
  padding:0.25rem 0.5rem; border-radius:var(--radius);
  transition:background var(--transition); position:relative;
}
.nav__user:hover { background:var(--bg3); }
.nav__avatar {
  width:28px; height:28px; border-radius:50%; background:var(--green-dk);
  display:flex; align-items:center; justify-content:center;
  font-size:0.65rem; color:var(--green-lt); font-weight:600; flex-shrink:0;
}
.nav__user-name {
  font-size:0.68rem; color:var(--text-2);
  max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* Hamburger */
.nav__hamburger {
  display:none; flex-direction:column; gap:5px;
  cursor:pointer; background:none; border:none; padding:0.3rem;
}
.nav__hamburger span {
  display:block; width:22px; height:2px; background:var(--text-2);
  border-radius:1px; transition:transform 0.3s,opacity 0.3s;
}
.nav__hamburger.is-open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
.nav__hamburger.is-open span:nth-child(2) { opacity:0; }
.nav__hamburger.is-open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

/* Mobile drawer */
.nav__drawer {
  display:none; position:fixed; top:58px; left:0; right:0;
  background:var(--bg2); border-bottom:1px solid var(--border);
  padding:0.75rem 1.5rem 1rem; z-index:299;
  flex-direction:column; gap:0; box-shadow:var(--shadow);
}
.nav__drawer.is-open { display:flex; }
.nav__drawer a {
  display:flex; align-items:center; gap:0.5rem;
  color:var(--text-3); font-size:0.72rem; letter-spacing:0.1em;
  text-transform:uppercase; padding:0.7rem 0.5rem;
  border-bottom:1px solid var(--border); transition:color var(--transition);
}
.nav__drawer a:last-child { border-bottom:none; }
.nav__drawer a:hover,
.nav__drawer a.is-active { color:var(--green); }

/* Drawer extras row (currency + theme for mobile) */
.nav__drawer-extras {
  display:flex; align-items:center; gap:0.75rem;
  padding:0.75rem 0.5rem 0.25rem;
  border-top:1px solid var(--border);
  margin-top:0.25rem; flex-wrap:wrap;
}

/* ── PAGE SHELL ──────────────────────────────────────────── */
.page { max-width:1400px; margin:0 auto; padding:1.75rem; }

.page-header {
  display:flex; align-items:flex-end; justify-content:space-between;
  margin-bottom:1.75rem; padding-bottom:1.25rem;
  border-bottom:1px solid var(--border); gap:1rem; flex-wrap:wrap;
}
.page-header__title { font-size:1.8rem; color:var(--text); }
.page-header__sub {
  font-family:'DM Mono',monospace; font-size:0.6rem;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--text-3); margin-top:0.3rem;
}
.page-header__controls { display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }

/* ── STATS STRIP ─────────────────────────────────────────── */
.stats-strip {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:1rem; margin-bottom:1.75rem;
}

/* ── MAIN GRID ───────────────────────────────────────────── */
.main-grid {
  display:grid; grid-template-columns:1fr 320px;
  gap:1.25rem; margin-bottom:1.75rem;
}

/* ── TABLE CONTROLS ──────────────────────────────────────── */
.table-controls {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:1.2rem; gap:1rem; flex-wrap:wrap;
}
.table-controls__right { display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }

/* ── LOW STOCK MARQUEE ───────────────────────────────────── */
.low-stock-banner {
  display:none; margin-bottom:1.25rem;
  background:var(--orange-bg); border:1px solid rgba(184,98,42,0.35);
  border-radius:var(--radius); overflow:hidden;
  height:36px; align-items:center;
}
.low-stock-banner.is-visible { display:flex; }
.low-stock-banner__label {
  flex-shrink:0; padding:0 1rem; font-size:0.6rem;
  letter-spacing:0.1em; text-transform:uppercase; color:var(--orange);
  border-right:1px solid rgba(184,98,42,0.3); height:100%;
  display:flex; align-items:center; gap:0.4rem; white-space:nowrap;
  background:rgba(184,98,42,0.08);
}
.low-stock-banner__track {
  flex:1; overflow:hidden; height:100%; display:flex; align-items:center;
}
.low-stock-banner__inner {
  display:flex; gap:2.5rem; white-space:nowrap;
  animation:marquee-scroll 22s linear infinite; will-change:transform;
}
.low-stock-banner__inner:hover { animation-play-state:paused; }
@keyframes marquee-scroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

/* ── PREDICTION ──────────────────────────────────────────── */
.prediction-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:1.25rem; margin-bottom:1.75rem;
}
.prediction-metric {
  padding:1rem 1.25rem; background:var(--bg3);
  border:1px solid var(--border); border-radius:var(--radius);
}
.prediction-metric__label { font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-3); margin-bottom:0.4rem; }
.prediction-metric__value { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:700; color:var(--purple); }
.prediction-metric__note  { font-size:0.6rem; color:var(--text-3); margin-top:0.25rem; }

/* ── RESPONSIVE — tablet ─────────────────────────────────── */
@media (max-width:1100px) {
  .main-grid       { grid-template-columns:1fr; }
  .stats-strip     { grid-template-columns:repeat(2,1fr); }
  .prediction-grid { grid-template-columns:1fr; }
}

/* ── RESPONSIVE — mobile ─────────────────────────────────── */
@media (max-width:820px) {
  /* Hide desktop nav links & currency; show hamburger */
  .nav__links    { display:none; }
  .nav__currency { display:none; }
  .nav__user-name { display:none; }
  .nav__hamburger { display:flex; }
  /* Also hide theme button from desktop nav on mobile (it's in drawer) */
  .nav .theme-btn { display:none; }

  .page { padding:1rem 0.85rem; }

  .page-header { flex-direction:column; align-items:flex-start; }
  .page-header__controls { width:100%; justify-content:flex-start; }
  .page-header__title { font-size:1.4rem; }

  .stats-strip { grid-template-columns:repeat(2,1fr); gap:0.75rem; }

  .table-controls { flex-direction:column; align-items:flex-start; }
  .table-controls__right { width:100%; flex-direction:column; align-items:flex-start; }
  .search-input  { width:100%; }
  .filter-tabs   { flex-wrap:wrap; }
  .filter-tab    { font-size:0.58rem; padding:0.3rem 0.65rem; }

  .form-row { grid-template-columns:1fr; }

  .modal         { padding:1.25rem; }
  .modal__actions { flex-direction:column; }
  .modal__actions .btn { width:100%; justify-content:center; }

  /* Stack second grid row charts vertically */
  .main-grid[style] { grid-template-columns:1fr !important; }
}

/* ── RESPONSIVE — small phones ───────────────────────────── */
@media (max-width:480px) {
  .stats-strip       { grid-template-columns:1fr; }
  .nav__brand-sub    { display:none; }
  .nav               { padding:0 1rem; }
  .page              { padding:0.85rem 0.75rem; }
  .stat-card         { padding:1rem; }
  .stat-card__value  { font-size:1.4rem; }

  .prediction-grid   { grid-template-columns:1fr; }
  /* Make filter tabs scrollable instead of wrapping */
