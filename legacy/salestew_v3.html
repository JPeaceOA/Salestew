    if (localStorage.getItem(key)) return;
    localStorage.setItem(key, '1');
    App.toast(`Welcome to SaleStew, ${sess.username}! 👋  Press ? to see keyboard shortcuts.`, 'info', 5000);
  }

  // ── RENDER ALL ────────────────────────────────────────────
  function renderAll() {
    App.renderLowStockBanner();
    renderStats();
    renderGoals();
    renderCharts();
    renderLeaderboard();
    renderTable();
  }

  // ── WIRE ──────────────────────────────────────────────────
  document.getElementById('btnAddSale').addEventListener('click', openAddModal);
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
  document.getElementById('btnAddGoal')?.addEventListener('click', openAddGoalModal);
  document.getElementById('searchInput').addEventListener('input', e => { searchQ=e.target.value; renderTable(); });

  document.getElementById('filterTabs').querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#filterTabs .filter-tab').forEach(t=>t.classList.remove('is-active'));
      btn.classList.add('is-active');
      filterCat=btn.dataset.cat;
      renderTable();
    });
  });

  page.querySelectorAll('[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      sortDir = sortCol===th.dataset.sort ? sortDir*-1 : 1;
      sortCol = th.dataset.sort;
      page.querySelectorAll('[data-sort]').forEach(t=>t.classList.remove('sorted'));
      th.classList.add('sorted');
      renderTable();
    });
  });

  wireBulkBar();
  document.addEventListener('currency-changed', renderAll);
  renderAll();
  maybeShowWelcome();
});

/* ==== js/inventory.js ==== */
'use strict';
/* ═══════════════════════════════════════════════════════════
   INVENTORY.JS v3 — Multi-currency costs, supplier link,
   product images, shared helpers
   ═══════════════════════════════════════════════════════════ */

App.router.register('inventory', () => {
  const sess = App.auth.requireSession(); if (!sess) return;
  document.title = 'Inventory — SaleStew';
  const app = document.getElementById('app');
  App.buildNav('inventory');

  const page = document.createElement('main');
  page.className = 'page';
  page.innerHTML = `
    <div class="low-stock-banner" id="lowStockBanner"></div>
    <header class="page-header">
      <div>
        <h1 class="page-header__title">Inventory</h1>
        <p class="page-header__sub">// stock levels &amp; product catalogue</p>
      </div>
      <div class="page-header__controls">
        ${sess.role==='admin' ? '<span class="u-muted" style="font-size:0.58rem;">double-click stock/price to edit</span>' : ''}
        <button class="btn btn--ghost btn--sm" id="btnSettings">⚙ Threshold</button>
        <button class="btn btn--ghost btn--sm" id="btnExportInv">⬇ Export CSV</button>
        <button class="btn btn--ghost btn--sm" id="btnPrintInv" title="Print inventory">🖨 Print</button>
        ${sess.role==='admin' ? '<button class="btn btn--primary" id="btnAddProduct">+ Add Product</button>' : ''}
      </div>
    </header>

    <section class="stats-strip" id="invStats"></section>

    <section class="panel">
      <div class="table-controls">
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <span class="panel__title">All Products</span>
          <span style="font-size:0.62rem;color:var(--text-3);" id="invCount"></span>
        </div>
        <div class="table-controls__right">
          <input class="search-input" id="invSearch" type="text" placeholder="Search inventory…" />
          <div class="filter-tabs" id="invFilterTabs">
            <button class="filter-tab is-active" data-cat="all">All</button>
            <button class="filter-tab" data-cat="low">⚠ Low</button>
            <button class="filter-tab" data-cat="Electronics">Electronics</button>
            <button class="filter-tab" data-cat="Apparel">Apparel</button>
            <button class="filter-tab" data-cat="Food">Food</button>
            <button class="filter-tab" data-cat="Home">Home</button>
            <button class="filter-tab" data-cat="Sports">Sports</button>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:44px;"></th>
              <th data-sort="sku">SKU ↕</th>
              <th data-sort="product">Product ↕</th>
              <th data-sort="category">Category ↕</th>
              <th data-sort="stock">Stock ↕</th>
              <th>Reorder</th>
              <th data-sort="costNGN">Cost ↕</th>
              <th data-sort="selling">Selling ↕</th>
              <th>Margin</th>
              <th>Status</th>
              <th>Supplier</th>
              ${sess.role==='admin' ? '<th>Actions</th>' : ''}
            </tr>
          </thead>
          <tbody id="invTable"></tbody>
        </table>
      </div>
    </section>`;
  app.appendChild(page);

  let sortCol='product', sortDir=1, filterCat='all', searchQ='';

  function getCostNGN(item) {
    // Multi-currency: if USD cost stored and item was costed in USD, convert
    if (item.costUSD != null) return item.costUSD * App.NAIRA_PER_USD;
    return item.costNGN || item.cost || 0; // backward compat with 'cost' field
  }

  function getMarginPct(item) {
    const cost = getCostNGN(item), sell = item.selling || 0;
    if (!sell) return 0;
    return Math.round((sell - cost) / sell * 100);
  }

  function renderStats() {
    const inv = App.db.getInventory();
    const low  = App.db.lowStockItems().length;
    const out  = inv.filter(i=>i.stock<=0).length;
    const val  = inv.reduce((s,i)=>s+i.stock*getCostNGN(i),0);
    const ret  = inv.reduce((s,i)=>s+i.stock*(i.selling||0),0);
    document.getElementById('invStats').innerHTML = [
      ['Total Products',  inv.length,                     'var(--green)'],
      ['Low / Out Stock', `${low} / ${out}`,              'var(--orange)', 'Needs attention'],
      ['Stock Value',     App.fmt.money(val),             'var(--purple)', 'at cost'],
      ['Retail Value',    App.fmt.money(ret),             'var(--green)',  'at selling price'],
    ].map(([l,v,c,d])=>App.statCard(l,v,c,d||'')).join('');
  }

  function getVisible() {
    const q = searchQ.toLowerCase();
    return App.db.getInventory()
      .filter(i => {
        if (filterCat==='low') return i.stock <= App.db.stockStatus(i).t;
        if (filterCat!=='all') return i.category===filterCat;
        return true;
      })
      .filter(i => !q || i.product.toLowerCase().includes(q) || (i.sku||'').toLowerCase().includes(q) || i.category.toLowerCase().includes(q))
      .sort((a,b) => {
        const av = sortCol==='costNGN' ? getCostNGN(a) : a[sortCol];
        const bv = sortCol==='costNGN' ? getCostNGN(b) : b[sortCol];
        return typeof av==='string' ? sortDir*av.localeCompare(bv) : sortDir*(av-bv);
      });
  }

  // ── INLINE EDITING for inventory (Feature 1) ─────────────
  // Editable fields: stock, selling price, reorder point
  const INV_EDITABLE = {
    stock:        { label:'Stock',         type:'number', min:0 },
    selling:      { label:'Selling Price', type:'number', min:0 },
    reorderPoint: { label:'Reorder Point', type:'number', min:0 },
  };

  function startInvInlineEdit(td, item, field) {
    if (td.classList.contains('is-editing')) return;
    td.classList.add('is-editing');
    const spec     = INV_EDITABLE[field];
    const origVal  = item[field] ?? 0;
    const origHTML = td.innerHTML;

    const input = document.createElement('input');
    input.type      = 'number';
    input.className = 'inline-edit__input';
    input.value     = field==='selling' && App.currency.current==='USD'
      ? (origVal / App.NAIRA_PER_USD).toFixed(2) : origVal;
    input.min = spec.min;
    td.innerHTML = '';
    td.appendChild(input);
    input.focus(); input.select();

    function commit() {
      td.classList.remove('is-editing');
      let newVal = parseFloat(input.value);
      if (isNaN(newVal) || newVal < spec.min) { td.innerHTML = origHTML; return; }
      newVal = Math.round(newVal);
      if (field === 'selling' && App.currency.current === 'USD')
        newVal = Math.round(parseFloat(input.value) * App.NAIRA_PER_USD);
      if (newVal === origVal) { td.innerHTML = origHTML; return; }

      const snapshot = App.db.getInventory();
      const inv = App.db.getInventory();
      const idx = inv.findIndex(i => i.id === item.id);
      if (idx > -1) {
        inv[idx] = { ...inv[idx], [field]: newVal };
        App.db.setInventory(inv);
        App.actLog?.record(App.actLog.TYPES.INV_EDIT, `${item.product} — ${spec.label}: ${newVal}`);
        App.toast(`${spec.label} updated.`, 'success', 3500, [{
          label:'Undo', fn:()=>{ App.db.setInventory(snapshot); renderAll(); },
        }]);
        renderAll();
      }
    }

    function cancel() { td.classList.remove('is-editing'); td.innerHTML = origHTML; }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key==='Enter')  { e.preventDefault(); input.removeEventListener('blur',commit); commit(); }
      if (e.key==='Escape') { e.preventDefault(); input.removeEventListener('blur',commit); cancel(); }
    });
  }

  function renderTable() {
    const suppliers = App.db.getSuppliers();
    const data = getVisible();
    document.getElementById('invCount').textContent = `${data.length} product${data.length!==1?'s':''}`;
    const tbody = document.getElementById('invTable');
    const edClass = sess.role==='admin' ? ' class="editable-cell"' : '';
    tbody.innerHTML = data.length===0
      ? `<tr><td colspan="${sess.role==='admin'?12:11}" style="text-align:center;padding:2rem;color:var(--text-3);">No products match your filter.</td></tr>`
      : data.map(i => {
          const st      = App.db.stockStatus(i);
          const pct     = Math.min(100, Math.round(i.stock/Math.max(st.t*3,1)*100));
          const color   = App.catColors[i.category]||'#748e70';
          const margin  = getMarginPct(i);
          const costNGN = getCostNGN(i);
          const supp    = suppliers.find(s=>s.id===i.supplierId);
          const thumb   = i.image
            ? `<img src="${i.image}" style="width:32px;height:32px;object-fit:cover;border-radius:2px;border:1px solid var(--border);" alt="">`
            : `<div style="width:32px;height:32px;background:var(--bg3);border-radius:2px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.9rem;">📦</div>`;
          return `<tr>
            <td>${thumb}</td>
            <td style="color:var(--text-3);font-size:0.65rem;">${i.sku||'—'}</td>
            <td style="font-weight:500;">${i.product}</td>
            <td><span class="cat-dot" style="background:${color}"></span>${i.category}</td>
            <td${edClass} data-inv-id="${i.id}" data-field="stock">
              <strong style="color:${st.color};">${i.stock}</strong>
              <div class="progress" style="width:52px;margin-top:4px;"><div class="progress__fill" style="width:${pct}%;background:${st.color};"></div></div>
            </td>
            <td${edClass} data-inv-id="${i.id}" data-field="reorderPoint" style="color:var(--text-3);font-size:0.7rem;">
              ${i.globalThreshold
                ? `<span class="badge badge--info" title="Using global threshold">G(${st.t})</span>`
                : `<span class="badge badge--purple">${i.reorderPoint}</span>`}
            </td>
            <td style="color:var(--text-2);">
              ${App.fmt.money(costNGN)}
              ${i.costUSD!=null ? `<div style="font-size:0.6rem;color:var(--text-3);">($${i.costUSD.toFixed(2)})</div>` : ''}
            </td>
            <td${edClass} data-inv-id="${i.id}" data-field="selling" style="color:var(--green);">${App.fmt.money(i.selling||0)}</td>
            <td style="color:${margin>30?'var(--green)':margin>15?'var(--orange)':'var(--down)'};">${margin}%</td>
            <td><span class="badge ${st.cls}">${st.label}</span></td>
            <td style="font-size:0.68rem;color:var(--text-3);">
              ${supp ? `<span title="${supp.name}" style="cursor:default;">🏭 ${supp.name.split(' ').slice(0,2).join(' ')}</span>` : '<span style="color:var(--border-3);">—</span>'}
            </td>
            ${sess.role==='admin' ? `<td style="white-space:nowrap;">
              <button class="btn btn--icon btn--sm" data-edit="${i.id}" title="Edit product">✏</button>
              <button class="btn btn--danger" data-del-inv="${i.id}" style="margin-left:4px;">✕</button>
            </td>` : ''}
          </tr>`;
        }).join('');

    if (sess.role==='admin') {
      // Inline edit: double-click stock, reorderPoint, selling cells
      tbody.querySelectorAll('.editable-cell').forEach(td => {
        td.addEventListener('dblclick', () => {
          const id   = +td.dataset.invId;
          const field = td.dataset.field;
          const item  = App.db.getInventory().find(i => i.id === id);
          if (item) startInvInlineEdit(td, item, field);
        });
      });
      tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEditModal(+b.dataset.edit)));
      tbody.querySelectorAll('[data-del-inv]').forEach(b => b.addEventListener('click', () => {
        const snap = App.db.getInventory();
        const id   = +b.dataset.delInv;
        const item = snap.find(i=>i.id===id);
        App.db.setInventory(snap.filter(i=>i.id!==id));
        App.actLog?.record(App.actLog.TYPES.INV_DELETE, item?.product || `id:${id}`);
        App.toast('Product removed.','warn',4000,[{ label:'Undo', fn:()=>{ App.db.setInventory(snap); renderAll(); } }]);
        renderAll();
      }));
    }
  }

  function renderAll() { App.renderLowStockBanner(); renderStats(); renderTable(); }

  // ── Product form HTML (shared by add + edit) ─────────────
  function productFormHtml(item={}) {
    const suppliers = App.db.getSuppliers();
    const suppOpts  = suppliers.map(s=>`<option value="${s.id}" ${item.supplierId===s.id?'selected':''}>${s.name}</option>`).join('');
    return `
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input class="form-input" id="pName" value="${item.product||''}" placeholder="e.g. Samsung Galaxy" />
        </div>
        <div class="form-group">
          <label class="form-label">SKU *</label>
          <input class="form-input" id="pSku" value="${item.sku||''}" placeholder="e.g. EL-007" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-input" id="pCat">
            ${['Electronics','Apparel','Food','Home','Sports','General'].map(c=>`<option ${item.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Stock Qty</label>
          <input class="form-input" id="pStock" type="number" value="${item.stock??0}" min="0" />
        </div>
      </div>
      <!-- Multi-currency cost -->
      <div class="form-group">
        <label class="form-label">Cost Currency</label>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;">
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.72rem;color:var(--text-2);cursor:pointer;">
            <input type="radio" name="costCur" value="NGN" ${item.costUSD==null?'checked':''} style="accent-color:var(--green);"> ₦ NGN
          </label>
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.72rem;color:var(--text-2);cursor:pointer;">
            <input type="radio" name="costCur" value="USD" ${item.costUSD!=null?'checked':''} style="accent-color:var(--green);"> $ USD
          </label>
        </div>
        <div id="costNGNField" class="form-group" style="margin:0;${item.costUSD!=null?'display:none;':''}">
          <label class="form-label">Cost Price (₦)</label>
          <input class="form-input" id="pCostNGN" type="number" value="${item.costNGN??item.cost??0}" min="0" />
        </div>
        <div id="costUSDField" class="form-group" style="margin:0;${item.costUSD==null?'display:none;':''}">
          <label class="form-label">Cost Price ($)</label>
          <input class="form-input" id="pCostUSD" type="number" step="0.01" value="${item.costUSD??''}" min="0" />
          <div style="font-size:0.58rem;color:var(--text-3);margin-top:0.2rem;">Stored in NGN at rate ₦${App.NAIRA_PER_USD}/$</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Selling Price (₦)</label>
          <input class="form-input" id="pSell" type="number" value="${item.selling??0}" min="0" />
        </div>
        <div class="form-group">
          <label class="form-label">Reorder Point</label>
          <input class="form-input" id="pReorder" type="number" value="${item.reorderPoint??10}" min="0" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Supplier</label>
          <select class="form-input" id="pSupplier">
            <option value="">— none —</option>
            ${suppOpts}
          </select>
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end;padding-bottom:0.1rem;">
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.68rem;color:var(--text-2);cursor:pointer;">
            <input type="checkbox" id="pGlobal" ${item.globalThreshold!==false?'checked':''} style="accent-color:var(--green);width:14px;height:14px;">
            Use global threshold
          </label>
        </div>
      </div>
      <!-- Product image -->
      <div class="form-group">
        <label class="form-label">Product Image (optional)</label>
        <div style="display:flex;align-items:center;gap:1rem;">
          <div id="imgPreview" style="width:56px;height:56px;border:1px solid var(--border-2);border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:var(--bg3);">
            ${item.image ? `<img src="${item.image}" style="width:100%;height:100%;object-fit:cover;">` : '📦'}
          </div>
          <div>
            <input type="file" id="pImgFile" accept="image/*" style="display:none;">
            <button type="button" class="btn btn--ghost btn--sm" id="btnPickImg">Choose Image</button>
            ${item.image ? '<button type="button" class="btn btn--danger" id="btnClearImg" style="margin-left:6px;">Remove</button>' : ''}
            <div style="font-size:0.6rem;color:var(--text-3);margin-top:0.3rem;">Max ~500KB. Stored locally.</div>
          </div>
        </div>
      </div>`;
  }

  function wireImagePicker(currentImage, onImageChange) {
    let image = currentImage ?? null;
    document.getElementById('btnPickImg')?.addEventListener('click', () => document.getElementById('pImgFile').click());
    document.getElementById('pImgFile')?.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 600*1024) { App.toast('Image too large. Max ~500KB.','warn'); return; }
      const reader = new FileReader();
      reader.onload = ev => {
        image = ev.target.result;
        document.getElementById('imgPreview').innerHTML = `<img src="${image}" style="width:100%;height:100%;object-fit:cover;">`;
        onImageChange(image);
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('btnClearImg')?.addEventListener('click', () => {
      image = null;
      document.getElementById('imgPreview').innerHTML = '📦';
      onImageChange(null);
    });
    // Currency radio toggle
    document.querySelectorAll('input[name="costCur"]').forEach(r => r.addEventListener('change', () => {
      document.getElementById('costNGNField').style.display = r.value==='NGN' ? '' : 'none';
      document.getElementById('costUSDField').style.display = r.value==='USD' ? '' : 'none';
    }));
    return { getImage:() => image };
  }

  function readProductForm() {
    const curIsUSD = document.querySelector('input[name="costCur"]:checked')?.value === 'USD';
    return {
      product: document.getElementById('pName').value.trim(),
      sku:     document.getElementById('pSku').value.trim(),
      category:document.getElementById('pCat').value,
      stock:   parseInt(document.getElementById('pStock').value)||0,
      costNGN: curIsUSD ? null : parseFloat(document.getElementById('pCostNGN').value)||0,
      costUSD: curIsUSD ? parseFloat(document.getElementById('pCostUSD').value)||0 : null,
      selling: parseFloat(document.getElementById('pSell').value)||0,
      reorderPoint: parseInt(document.getElementById('pReorder').value)||10,
      globalThreshold: document.getElementById('pGlobal').checked,
      supplierId: document.getElementById('pSupplier').value ? +document.getElementById('pSupplier').value : null,
    };
  }

  function openAddModal() {
    let imageData = null;
    App.modal({
      title:'Add Product', size:'lg',
      html: productFormHtml(),
      saveLabel:'Add Product',
      onSave(close) {
        const data = readProductForm();
        if (!data.product||!data.sku) { App.toast('Name and SKU required.','warn'); return; }
        const inv = App.db.getInventory();
        inv.push({ id:App.db.nextId(inv), image:imageData, ...data });
        App.db.setInventory(inv);
        App.actLog?.record(App.actLog.TYPES.INV_ADD, data.product);
        App.toast('Product added.');
        close(); renderAll();
      },
    });
    const { getImage } = wireImagePicker(null, img => { imageData=img; });
  }

  function openEditModal(id) {
    const inv  = App.db.getInventory();
    const item = inv.find(i=>i.id===id);
    if (!item) return;
    let imageData = item.image;
    App.modal({
      title:`Edit: ${item.product}`,  size:'lg',
      html: productFormHtml(item),
      saveLabel:'Save Changes',
      onSave(close) {
        const data = readProductForm();
        const idx  = inv.findIndex(i=>i.id===id);
        if (idx>-1) { inv[idx]={ ...inv[idx], ...data, image:imageData }; App.db.setInventory(inv); }
        App.actLog?.record(App.actLog.TYPES.INV_EDIT, data.product);
        App.toast('Product updated.');
        close(); renderAll();
      },
    });
    wireImagePicker(item.image, img => { imageData=img; });
  }

  function openSettingsModal() {
    const s = App.db.getSettings();
    App.modal({
      title:'Threshold Settings', size:'sm',
      html:`<div class="form-group">
        <label class="form-label">Global Low-Stock Threshold</label>
        <input class="form-input" id="globalThresh" type="number" value="${s.globalLowStockThreshold}" min="0" />
        <p style="font-size:0.6rem;color:var(--text-3);margin-top:0.3rem;">Triggers a warning when stock ≤ this number.</p>
      </div>`,
      saveLabel:'Save',
      onSave(close) {
        const v = parseInt(document.getElementById('globalThresh').value)||0;
        App.db.setSettings({ ...s, globalLowStockThreshold:v });
        App.toast('Threshold saved.'); close(); renderAll();
      },
    });
  }

  // ── WIRE ──────────────────────────────────────────────────
  if (sess.role==='admin') document.getElementById('btnAddProduct')?.addEventListener('click', openAddModal);
  document.getElementById('btnSettings').addEventListener('click', openSettingsModal);
  document.getElementById('btnPrintInv').addEventListener('click', () => window.print());
  document.getElementById('btnExportInv').addEventListener('click', () => {
    const inv = App.db.getInventory();
    if (!inv.length) { App.toast('No inventory to export.','warn'); return; }
    const headers = ['SKU','Product','Category','Stock','Reorder Point','Cost NGN','Cost USD','Selling','Supplier'];
    const sups = App.db.getSuppliers();
    const rows = inv.map(i => {
      const s = sups.find(x=>x.id===i.supplierId);
      return [i.sku,i.product,i.category,i.stock,i.reorderPoint,getCostNGN(i),i.costUSD??'',i.selling||0,s?s.name:''];
    });
    App.csv.download('salestew_inventory.csv', App.csv.stringify([headers,...rows]));
    App.toast('Inventory exported.');
  });
  document.getElementById('invSearch').addEventListener('input', e => { searchQ=e.target.value; renderTable(); });
  document.getElementById('invFilterTabs').querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#invFilterTabs .filter-tab').forEach(t=>t.classList.remove('is-active'));
      btn.classList.add('is-active'); filterCat=btn.dataset.cat; renderTable();
    });
  });
  page.querySelectorAll('[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      sortDir = sortCol===th.dataset.sort ? sortDir*-1 : 1;
      sortCol = th.dataset.sort; renderTable();
    });
  });
  document.addEventListener('currency-changed', renderAll);
  renderAll();
});

/* ==== js/prediction.js ==== */
'use strict';
/* ═══════════════════════════════════════════════════════════
   PREDICTION.JS — Sales forecasting via linear regression
   + seasonal decomposition on historical data
   ═══════════════════════════════════════════════════════════ */

App.router.register('prediction', () => {
  const sess = App.auth.requireSession(); if (!sess) return;
  document.title = 'Sales Prediction — SaleStew';

  const app = document.getElementById('app');
  app.innerHTML = '';
  App.buildNav('prediction');

  const page = document.createElement('main');
  page.className = 'page';
  page.innerHTML = `
    <header class="page-header">
      <div>
        <h1 class="page-header__title">Sales Prediction</h1>
        <p class="page-header__sub">// linear regression + seasonal trend forecasting</p>
      </div>
      <div class="page-header__controls">
        <select class="form-input" id="predCat" style="width:auto;">
          <option value="all">All Categories</option>
          <option>Electronics</option><option>Apparel</option>
          <option>Food</option><option>Home</option><option>Sports</option>
        </select>
        <select class="form-input" id="predHorizon" style="width:auto;">
          <option value="3">3 months ahead</option>
          <option value="6" selected>6 months ahead</option>
          <option value="12">12 months ahead</option>
        </select>
        <button class="btn btn--accent" id="btnRunPred">🔮 Run Forecast</button>
      </div>
    </header>

    <!-- Methodology note -->
    <div class="alert alert--info" style="margin-bottom:1.5rem;">
      🔮 Forecasts use <strong>ordinary least-squares linear regression</strong> on monthly revenue,
      adjusted by a <strong>seasonal index</strong> derived from your historical month-over-month patterns.
      Accuracy improves with more historical data.
    </div>

    <!-- Key prediction metrics -->
    <div class="prediction-grid" id="predMetrics" style="display:none;"></div>

    <!-- Forecast chart -->
    <div class="panel" id="predChartPanel" style="display:none;margin-bottom:1.5rem;">
      <div class="panel__header">
        <span class="panel__title">Revenue Forecast</span>
        <span class="panel__action u-purple" id="predLabel"></span>
      </div>
      <canvas id="predChart" height="200"></canvas>
    </div>

    <!-- Product-level forecast table -->
    <div class="panel" id="predTablePanel" style="display:none;margin-bottom:1.5rem;">
      <div class="panel__header">
        <span class="panel__title">Product-Level Projections</span>
        <span class="panel__action u-muted">based on recent trend</span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Avg Monthly Revenue</th>
              <th>Recent Trend</th>
              <th>Projected Next Month</th>
              <th>Confidence</th>
              <th>Signal</th>
            </tr>
          </thead>
          <tbody id="predTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Explanation panel -->
    <div class="panel" id="methodPanel" style="display:none;">
      <div class="panel__header"><span class="panel__title">How This Works</span></div>
      <div style="font-size:0.72rem;color:var(--text-2);line-height:1.8;max-width:720px;" id="methodText"></div>
    </div>`;

  app.appendChild(page);
  let predChart = null;

  // ── MATH UTILITIES ────────────────────────────────────────────────────────
  function linearRegression(points) {
    // points = [{x, y}]
    const n  = points.length;
    if (n < 2) return { slope: 0, intercept: points[0]?.y || 0, r2: 0 };
    const sumX  = points.reduce((s,p)=>s+p.x, 0);
    const sumY  = points.reduce((s,p)=>s+p.y, 0);
    const sumXY = points.reduce((s,p)=>s+p.x*p.y, 0);
    const sumX2 = points.reduce((s,p)=>s+p.x*p.x, 0);
    const slope     = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);
    const intercept = (sumY - slope*sumX) / n;
    // R² calculation
    const yMean = sumY / n;
    const ssTot = points.reduce((s,p)=>s+Math.pow(p.y-yMean,2),0);
    const ssRes = points.reduce((s,p)=>s+Math.pow(p.y-(slope*p.x+intercept),2),0);
    const r2 = ssTot > 0 ? 1 - ssRes/ssTot : 0;
    return { slope, intercept, r2: Math.max(0, r2) };
  }

  function seasonalIndices(monthlyData) {
    // monthlyData: { 'YYYY-MM': value }
    const keys   = Object.keys(monthlyData).sort();
    if (keys.length < 6) return Array(12).fill(1); // need enough data
    const byMonth = Array.from({length:12}, () => []);
    keys.forEach(k => {
      const m = parseInt(k.slice(5,7)) - 1;
      byMonth[m].push(monthlyData[k]);
    });
    const monthAvgs = byMonth.map(a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : null);
    const overall   = monthAvgs.filter(Boolean).reduce((s,v)=>s+v,0) / monthAvgs.filter(Boolean).length;
    return monthAvgs.map(a => a !== null ? a/overall : 1);
  }

  // ── CORE FORECAST ─────────────────────────────────────────────────────────
  function runForecast() {
    const cat      = document.getElementById('predCat').value;
    const horizon  = parseInt(document.getElementById('predHorizon').value);
    let entries    = App.db.getEntries();
    if (cat !== 'all') entries = entries.filter(e => e.category === cat);

    if (entries.length < 3) {
      App.toast('Not enough data to forecast. Add more entries.', 'warn'); return;
    }

    // Aggregate by month
    const byMonth = {};
    entries.forEach(e => {
      const k = e.date.slice(0,7);
      byMonth[k] = (byMonth[k]||0) + e.revenue;
    });

    const monthKeys = Object.keys(byMonth).sort();
    const points    = monthKeys.map((k,i) => ({ x: i, y: byMonth[k], key: k }));
    const reg       = linearRegression(points);
    const seasonal  = seasonalIndices(byMonth);

    // Project future months
    const lastKey    = monthKeys[monthKeys.length-1];
    const [lastY, lastM] = lastKey.split('-').map(Number);
    const forecast   = [];

    for (let i = 1; i <= horizon; i++) {
      const totalMonths = monthKeys.length - 1 + i;
      const base        = reg.slope * totalMonths + reg.intercept;
      const month       = new Date(lastY, lastM - 1 + i, 1);
      const si          = seasonal[month.getMonth()];
      const predicted   = Math.max(0, base * si);
      forecast.push({
        key:   month.toISOString().slice(0,7),
        value: predicted,
        label: month.toLocaleString('en-NG', { month:'short', year:'2-digit' }),
        seasonal: si,
      });
    }

    // ── METRICS ────────────────────────────────────────────────────────────
    const totalHistorical = entries.reduce((s,e)=>s+e.revenue,0);
    const avgMonthly      = totalHistorical / monthKeys.length;
    const nextMonthFore   = forecast[0]?.value || 0;
    const totalForecast   = forecast.reduce((s,f)=>s+f.value,0);
    const growth          = avgMonthly ? ((nextMonthFore-avgMonthly)/avgMonthly*100) : 0;
    const confidence      = Math.min(95, Math.round(reg.r2 * 100));

    document.getElementById('predMetrics').style.display = 'grid';
    document.getElementById('predMetrics').innerHTML = [
      { label:'Next Month Forecast', value: App.fmt.money(nextMonthFore), color:'var(--purple)', note:`${growth >= 0 ? '↑':'↓'} ${Math.abs(growth).toFixed(1)}% vs avg` },
      { label:`${horizon}-Month Total`, value: App.fmt.money(totalForecast), color:'var(--green)', note:'cumulative projection' },
      { label:'Model Confidence', value: confidence + '%', color: confidence>70?'var(--green)':confidence>40?'var(--orange)':'var(--down)', note:`R² = ${reg.r2.toFixed(3)}` },
      { label:'Trend Direction', value: reg.slope >= 0 ? '↑ Growth' : '↓ Decline', color: reg.slope >= 0 ? 'var(--green)':'var(--down)', note:`${App.fmt.money(Math.abs(reg.slope * 1000))}/mo slope` },
    ].map(m => `
      <div class="prediction-metric">
        <div class="prediction-metric__label">${m.label}</div>
        <div class="prediction-metric__value" style="color:${m.color}">${m.value}</div>
        <div class="prediction-metric__note">${m.note}</div>
      </div>`).join('');

    document.getElementById('predLabel').textContent = `${horizon}-month horizon`;

    // ── FORECAST CHART ─────────────────────────────────────────────────────
    if (predChart) { predChart.destroy(); predChart = null; }
    document.getElementById('predChartPanel').style.display = 'block';

    const histLabels  = points.map(p => { const [y,m]=p.key.split('-'); return new Date(+y,+m-1).toLocaleString('en-NG',{month:'short',year:'2-digit'}); });
    const histValues  = points.map(p => p.y/1000);
    const foreLabels  = forecast.map(f => f.label);
    const foreValues  = forecast.map(f => f.value/1000);
    const allLabels   = [...histLabels, ...foreLabels];

    // Trend line overlay across history
    const trendLine = points.map(p => (reg.slope*p.x+reg.intercept)/1000);

    predChart = new Chart(document.getElementById('predChart'), {
      data: {
        labels: allLabels,
        datasets: [
          {
            type:'bar', label:'Historical Revenue',
            data: [...histValues, ...Array(foreLabels.length).fill(null)],
            backgroundColor:'rgba(78,148,99,0.5)', borderColor:'#4e9463', borderWidth:1, borderRadius:2,
          },
          {
            type:'bar', label:'Forecasted Revenue',
            data: [...Array(histLabels.length).fill(null), ...foreValues],
            backgroundColor:'rgba(114,82,160,0.5)', borderColor:'#7252a0', borderWidth:1, borderRadius:2,
          },
          {
            type:'line', label:'Trend Line',
            data: [...trendLine, ...Array(foreLabels.length).fill(null)],
            borderColor:'rgba(184,98,42,0.7)', borderWidth:2, borderDash:[4,4],
            pointRadius:0, fill:false, tension:0,
          },
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ labels:{ color:'#748e70', font:{family:'DM Mono',size:10} }},
          tooltip:{ callbacks:{ label: ctx => `${ctx.dataset.label}: ${App.currency.format((ctx.raw||0)*1000)}` }},
        },
        scales:{
          x:{ ticks:{ color:'#445842', font:{family:'DM Mono',size:9} }, grid:{ color:'rgba(26,42,26,0.4)' }},
          y:{ ticks:{ color:'#445842', font:{family:'DM Mono',size:10}, callback:v=>App.currency.symbol()+(v>=1000?(v/1000).toFixed(0)+'M':v.toFixed(0)+'K') }, grid:{ color:'rgba(26,42,26,0.4)' }},
        }
      }
    });

    // ── PRODUCT TABLE ───────────────────────────────────────────────────────
    document.getElementById('predTablePanel').style.display = 'block';
    const byProduct = {};
    entries.forEach(e => {
      if (!byProduct[e.product]) byProduct[e.product] = { cat:e.category, months:{} };
      const mk = e.date.slice(0,7);
      byProduct[e.product].months[mk] = (byProduct[e.product].months[mk]||0)+e.revenue;
    });

    const prodRows = Object.entries(byProduct).map(([name,{cat,months}]) => {
      const mkeys = Object.keys(months).sort();
      const pts   = mkeys.map((k,i) => ({x:i, y:months[k]}));
      const r     = linearRegression(pts);
      const avg   = pts.reduce((s,p)=>s+p.y,0)/pts.length;
      const nextX = pts.length;
      const proj  = Math.max(0, r.slope*nextX+r.intercept);
      const conf  = Math.min(95, Math.round(Math.max(0,r.r2)*100));
      const signal = r.slope > avg*0.05 ? '📈 Growing' : r.slope < -avg*0.05 ? '📉 Declining' : '➡ Stable';
      const trendCls = r.slope >= 0 ? 'u-up' : 'u-down';
      const color = App.catColors[cat]||'#748e70';
      return { name, cat, avg, proj, conf, signal, trendCls, slope:r.slope, color };
    }).sort((a,b)=>b.proj-a.proj);

    document.getElementById('predTableBody').innerHTML = prodRows.map(p => `
      <tr>
        <td style="font-weight:500;">${p.name}</td>
        <td><span class="cat-dot" style="background:${p.color}"></span>${p.cat}</td>
        <td>${App.fmt.money(p.avg)}</td>
        <td><span class="${p.trendCls}">${p.slope>=0?'↑':'↓'} ${App.fmt.money(Math.abs(p.slope))}/mo</span></td>
        <td style="color:var(--purple)">${App.fmt.money(p.proj)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <div class="progress" style="width:60px"><div class="progress__fill" style="width:${p.conf}%;background:${p.conf>70?'var(--green)':p.conf>40?'var(--orange)':'var(--down)'}"></div></div>
            <span style="font-size:0.65rem;color:var(--text-3);">${p.conf}%</span>
          </div>
        </td>
        <td>${p.signal}</td>
      </tr>`).join('');

    // ── METHODOLOGY ─────────────────────────────────────────────────────────
    document.getElementById('methodPanel').style.display = 'block';
    document.getElementById('methodText').innerHTML = `
      <p><strong style="color:var(--purple)">Model:</strong> Ordinary Least-Squares (OLS) Linear Regression on monthly revenue aggregates.</p>
      <br/>
      <p><strong style="color:var(--orange)">Formula:</strong> <code>Revenue(t) = β₀ + β₁·t</code> where <code>t</code> is the month index (0, 1, 2…),
      β₁ (slope) = <strong>${App.fmt.money(reg.slope * 1000)}/month</strong>,
      β₀ (intercept) = <strong>${App.fmt.money(reg.intercept * 1000)}</strong>.</p>
      <br/>
      <p><strong style="color:var(--green)">Seasonal Adjustment:</strong> A seasonal index is computed for each calendar month
      by comparing its average revenue against the overall monthly mean.
      Forecasts are multiplied by this index to account for seasonal patterns (e.g. December spikes).</p>
      <br/>
      <p><strong style="color:var(--text-2)">Confidence (R²):</strong> ${confidence}% — measures how well the linear trend explains historical variance.
      Values above 70% indicate reliable trends; below 40% suggests high volatility.</p>
      <br/>
      <p style="color:var(--text-3);font-size:0.65rem;">
        ⚠ Forecasts are mathematical projections, not guarantees. External factors (market conditions, competition,
        seasonal shocks) are not captured. Always supplement with business judgment.
      </p>`;

    App.toast('Forecast computed.', 'success');
  }

  document.getElementById('btnRunPred').addEventListener('click', runForecast);
  document.getElementById('predCat').addEventListener('change', () => { /* auto re-run if already shown */ if(document.getElementById('predChartPanel').style.display!=='none') runForecast(); });
  document.getElementById('predHorizon').addEventListener('change', () => { if(document.getElementById('predChartPanel').style.display!=='none') runForecast(); });
  document.addEventListener('currency-changed', () => { if(document.getElementById('predChartPanel').style.display!=='none') runForecast(); });

  // Auto-run
  runForecast();
});

// ── HISTORY PAGE ──────────────────────────────────────────────────────────
App.router.register('history', () => {
  const sess = App.auth.requireSession(); if (!sess) return;
  document.title = 'History — SaleStew';

  const app = document.getElementById('app');
  app.innerHTML = '';
  App.buildNav('history');

  const page = document.createElement('main');
  page.className = 'page';
  page.innerHTML = `
    <header class="page-header">
      <div>
        <h1 class="page-header__title">Sales History</h1>
        <p class="page-header__sub">// full transaction log</p>
      </div>
      <div class="page-header__controls">
        <input class="form-input" id="hFrom" type="date" style="width:auto;" />
        <span style="color:var(--text-3);font-size:0.72rem;">to</span>
        <input class="form-input" id="hTo" type="date" style="width:auto;" />
        <button class="btn btn--ghost btn--sm" id="btnHFilter">Filter</button>
        <button class="btn btn--ghost btn--sm" id="btnHReset">Reset</button>
      </div>
    </header>

    <section class="panel">
      <div class="table-controls">
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <span class="panel__title">All Sales</span>
          <span style="font-size:0.62rem;color:var(--text-3);" id="histCount"></span>
        </div>
        <div class="table-controls__right">
          <input class="search-input" id="histSearch" type="text" placeholder="Search…" />
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th data-sort="date">Date ↕</th>
              <th data-sort="product">Product ↕</th>
              <th data-sort="category">Category ↕</th>
              <th data-sort="units">Units ↕</th>
              <th data-sort="revenue">Revenue ↕</th>
              <th data-sort="margin">Margin ↕</th>
              <th>Status</th>
              <th data-sort="trend">Trend ↕</th>
            </tr>
          </thead>
          <tbody id="histTable"></tbody>
        </table>
      </div>
    </section>`;

  app.appendChild(page);

  const today = new Date().toISOString().slice(0,10);
  const sixMoAgo = new Date(Date.now() - 180*864e5).toISOString().slice(0,10);
  document.getElementById('hFrom').value = sixMoAgo;
  document.getElementById('hTo').value   = today;

  let sortCol = 'date', sortDir = -1, searchQ = '', fromDate = sixMoAgo, toDate = today;

  function getFiltered() {
    const q = searchQ.toLowerCase();
    return App.db.getEntries()
      .filter(e => e.date >= fromDate && e.date <= toDate)
      .filter(e => !q || e.product.toLowerCase().includes(q) || e.category.toLowerCase().includes(q))
      .sort((a,b) => {
        const av=a[sortCol], bv=b[sortCol];
        return typeof av==='string' ? sortDir*av.localeCompare(bv) : sortDir*(av-bv);
      });
  }

  function render() {
    const data = getFiltered();
    document.getElementById('histCount').textContent = `${data.length} records`;
    document.getElementById('histTable').innerHTML = data.length === 0
      ? `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-3)">No records in this date range.</td></tr>`
      : data.map(e => {
          const color = App.catColors[e.category]||'#748e70';
          const bc = {Active:'green',Pending:'orange',Discontinued:'red'}[e.status]||'info';
          const tc = e.trend>=0?'u-up':'u-down';
          return `<tr>
            <td style="color:var(--text-3);white-space:nowrap;">${e.date}</td>
            <td>${e.product}</td>
            <td><span class="cat-dot" style="background:${color}"></span>${e.category}</td>
            <td>${e.units.toLocaleString('en-NG')}</td>
            <td style="color:var(--green)">${App.fmt.money(e.revenue)}</td>
            <td>${e.margin}%</td>
            <td><span class="badge badge--${bc}">${e.status}</span></td>
            <td><span class="${tc}">${e.trend>=0?'↑':'↓'} ${Math.abs(e.trend)}%</span></td>
          </tr>`;
        }).join('');
  }

  document.getElementById('btnHFilter').addEventListener('click', () => {
    fromDate = document.getElementById('hFrom').value;
    toDate   = document.getElementById('hTo').value;
    render();
  });
  document.getElementById('btnHReset').addEventListener('click', () => {
    fromDate = sixMoAgo; toDate = today;
    document.getElementById('hFrom').value = sixMoAgo;
    document.getElementById('hTo').value   = today;
    render();
  });
  document.getElementById('histSearch').addEventListener('input', e => { searchQ=e.target.value; render(); });
  page.querySelectorAll('[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      sortDir = sortCol===th.dataset.sort ? sortDir*-1 : 1;
      sortCol = th.dataset.sort;
      render();
    });
  });
  document.addEventListener('currency-changed', render);
  render();
});

          <button class="btn btn--ghost btn--sm" style="margin-top:0.75rem;" id="btnSeedData">Re-seed Demo Data</button>
        </div>
        <div style="background:var(--bg3);border:1px solid var(--border);padding:1rem;border-radius:var(--radius);">
          <div style="font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:0.5rem;">Registered Users</div>
          <div id="userCountAdmin" style="font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--purple)"></div>
          <button class="btn btn--ghost btn--sm" style="margin-top:0.75rem;" id="btnPromoteUsers">View Sessions</button>
        </div>
        <!-- Backup / Restore card -->
        <div style="background:var(--bg3);border:1px solid var(--border);padding:1rem;border-radius:var(--radius);">
          <div style="font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:0.5rem;">Backup &amp; Restore</div>
          <div style="font-size:0.68rem;color:var(--text-2);margin-bottom:0.75rem;line-height:1.5;">Download a full JSON backup or restore from a previous backup file.</div>
          <div style="display:flex;flex-direction:column;gap:0.5rem;">
            <button class="btn btn--ghost btn--sm" id="btnBackupExport">⬇ Download Backup</button>
            <button class="btn btn--ghost btn--sm" id="btnBackupImport">⬆ Restore Backup…</button>
            <input type="file" id="backupFileInput" accept=".json" style="display:none;" />
          </div>
        </div>
      </div>
    </div>`;

  app.appendChild(page);

  function renderStats() {
    const entries = App.db.getEntries();
    const inv     = App.db.getInventory();
    const users   = App.auth.getUsers();
    const totalRev = entries.reduce((s,e)=>s+e.revenue,0);

    document.getElementById('adminStats').innerHTML = [
      { label:'Total Revenue',  value: App.fmt.money(totalRev),         color:'var(--green)'  },
      { label:'Sales Records',  value: entries.length,                  color:'var(--orange)' },
      { label:'Inventory SKUs', value: inv.length,                     color:'var(--purple)' },
      { label:'User Accounts',  value: users.length,                   color:'var(--green)'  },
    ].map(s => `
      <div class="stat-card">
        <div class="stat-card__accent" style="background:linear-gradient(90deg,transparent,${s.color},transparent)"></div>
        <p class="stat-card__label">${s.label}</p>
        <p class="stat-card__value" style="color:${s.color}">${s.value}</p>
      </div>`).join('');

    document.getElementById('entryCountAdmin').textContent = entries.length;
    document.getElementById('invCountAdmin').textContent   = inv.length;
    document.getElementById('userCountAdmin').textContent  = users.length;
  }

  function renderUsers() {
    const users = App.auth.getUsers();
    document.getElementById('userCount').textContent = `${users.length} accounts`;
    document.getElementById('usersTable').innerHTML = users.map(u => `
      <tr>
        <td style="font-weight:500;">${u.username}</td>
        <td><span class="badge badge--${u.role==='admin'?'orange':'info'}">${u.role}</span></td>
        <td style="color:var(--text-3)">${u.createdAt ? App.fmt.date(new Date(u.createdAt).toISOString().slice(0,10)) : '—'}</td>
        <td style="color:var(--text-3)">${u.lastLogin ? App.fmt.date(new Date(u.lastLogin).toISOString().slice(0,10)) : 'Never'}</td>
        <td>${u.loginCount || 0}</td>
        <td style="color:var(--purple)">
          ${App.fmt.duration(u.totalTimeMs)}
          <button class="btn btn--danger" data-reset-time="${u.id}" title="Reset total time to zero" style="margin-left:0.4rem;font-size:0.55rem;padding:0.1rem 0.4rem;border:1px solid rgba(160,72,72,0.25);">↺</button>
        </td>
        <td style="display:flex;gap:0.4rem;flex-wrap:wrap;">
          ${u.id !== sess.userId ? `
            ${u.role !== 'admin' ? `<button class="btn btn--icon btn--sm" data-promote="${u.id}">→ admin</button>` : `<button class="btn btn--icon btn--sm" data-demote="${u.id}">→ user</button>`}
            <button class="btn btn--danger" data-del-user="${u.id}">del</button>
          ` : '<span style="font-size:0.62rem;color:var(--text-3);">(you)</span>'}
        </td>
      </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-3)">No users.</td></tr>`;

    document.querySelectorAll('[data-reset-time]').forEach(btn => {
      btn.addEventListener('click', () => {
        const users = App.auth.getUsers();
        const u = users.find(x => x.id === +btn.dataset.resetTime);
        if (!u) return;
        if (!confirm(`Reset total logged time for "${u.username}" to zero?`)) return;
        u.totalTimeMs = 0;
        // If this is the currently active user, also reset their session loginTime
        // so the running timer starts fresh from now.
        const activeSess = App.auth.getSession();
        if (activeSess && activeSess.userId === u.id) {
          activeSess.loginTime = Date.now();
          App.store.set(App.auth.SESSION_KEY, activeSess);
        }
        App.store.set(App.auth.USERS_KEY, users);
        App.toast(`Time reset for ${u.username}.`);
        renderUsers();
      });
    });

    document.querySelectorAll('[data-promote]').forEach(btn => {
      btn.addEventListener('click', () => {
        const users = App.auth.getUsers();
        const u = users.find(x => x.id === +btn.dataset.promote);
        if (u) { u.role = 'admin'; App.store.set(App.auth.USERS_KEY, users); App.toast(`${u.username} promoted to admin.`); renderUsers(); }
      });
    });
    document.querySelectorAll('[data-demote]').forEach(btn => {
      btn.addEventListener('click', () => {
        const users = App.auth.getUsers();
        const u = users.find(x => x.id === +btn.dataset.demote);
        if (u) { u.role = 'user'; App.store.set(App.auth.USERS_KEY, users); App.toast(`${u.username} set to user.`); renderUsers(); }
      });
    });
    document.querySelectorAll('[data-del-user]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!confirm('Delete this user?')) return;
        const users = App.auth.getUsers().filter(x => x.id !== +btn.dataset.delUser);
        App.store.set(App.auth.USERS_KEY, users);
        App.toast('User removed.'); renderUsers(); renderStats();
      });
    });
  }

  // Create user modal
  document.getElementById('btnCreateUser').addEventListener('click', () => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay is-open';
    overlay.innerHTML = `
      <div class="modal modal--sm">
        <div class="modal__header">
          <h2 class="modal__title">Create User</h2>
          <button class="modal__close" id="closeCreateUser">✕</button>
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" id="cuUser" type="text" placeholder="username" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" id="cuPass" type="password" placeholder="min. 6 chars" />
        </div>
        <div class="form-group">
          <label class="form-label">Role</label>
          <select class="form-input" id="cuRole">
            <option value="user">User (restricted)</option>
            <option value="admin">Admin (full access)</option>
          </select>
        </div>
        <div class="modal__actions">
          <button class="btn btn--ghost" id="cancelCreateUser">Cancel</button>
          <button class="btn btn--primary" id="saveCreateUser">Create</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    overlay.querySelector('#closeCreateUser').addEventListener('click', close);
    overlay.querySelector('#cancelCreateUser').addEventListener('click', close);
    overlay.addEventListener('click', e => { if(e.target===overlay) close(); });
    overlay.querySelector('#saveCreateUser').addEventListener('click', async () => {
      const username = document.getElementById('cuUser').value.trim();
      const password = document.getElementById('cuPass').value;
      const role     = document.getElementById('cuRole').value;
      if (username.length < 3 || password.length < 6) { App.toast('Username ≥3 chars, password ≥6 chars.','warn'); return; }
      const res = await App.auth.register({ username, password, role });
      if (res.ok) { App.toast(`User "${username}" created.`); close(); renderUsers(); renderStats(); }
      else { App.toast(res.error, 'error'); }
    });
  });

  // Export all CSV
  document.getElementById('btnExportAllCSV').addEventListener('click', () => {
    const entries = App.db.getEntries();
    if (!entries.length) { App.toast('No data.','warn'); return; }
    const headers = ['Date','Product','Category','Units','Revenue (NGN)','Margin%','Status','Trend%'];
    const rows = entries.map(e => [e.date,e.product,e.category,e.units,e.revenue,e.margin,e.status,e.trend]);
    const csv = [headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),download:'salestew_all_data.csv'});
    a.click(); App.toast('All data exported.');
  });

  // Re-seed
  document.getElementById('btnSeedData').addEventListener('click', () => {
    if (!confirm('This will overwrite current sales and inventory data. Continue?')) return;
    App.store.remove(App.db.ENTRIES_KEY);
    App.store.remove(App.db.INVENTORY_KEY);
    App.db.seedData();
    App.toast('Demo data restored.');
    renderStats();
  });

  document.getElementById('btnClearData').addEventListener('click', () => {
    if (!confirm('⚠ This will permanently delete ALL sales and inventory data. Are you sure?')) return;
    App.store.remove(App.db.ENTRIES_KEY);
    App.store.remove(App.db.INVENTORY_KEY);
    App.toast('All data cleared.', 'warn');
    renderStats();
  });

  document.getElementById('btnPromoteUsers').addEventListener('click', () => {
    App.toast('Users displayed in table above.', 'info');
  });

  // ── Backup export ─────────────────────────────────────────
  document.getElementById('btnBackupExport').addEventListener('click', () => {
    const result = App.backup.export();
    App.actLog?.record(App.actLog.TYPES.BACKUP_EXP, `${result.keys} keys`);
    App.toast(`Backup downloaded (${result.keys} keys).`);
  });

  // ── Backup import ─────────────────────────────────────────
  document.getElementById('btnBackupImport').addEventListener('click', () => {
    document.getElementById('backupFileInput').click();
  });

  document.getElementById('backupFileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm(`Restore backup from "${file.name}"?\n\nThis will overwrite all current data. This cannot be undone.`)) {
      e.target.value = '';
      return;
    }
    try {
      const result = await App.backup.import(file);
      App.actLog?.record(App.actLog.TYPES.BACKUP_IMP, file.name);
      App.toast(`Backup restored (${result.keys} keys). Reloading…`, 'success', 2000);
      setTimeout(() => window.location.reload(), 1800);
    } catch(err) {
      App.toast(err.message, 'error', 5000);
    }
    e.target.value = '';
  });

  document.addEventListener('currency-changed', renderStats);
  renderStats();
  renderUsers();
});

'use strict';
/* ═══════════════════════════════════════════════════════════
   SUPPLIERS.JS v3 — Supplier / vendor management
   ═══════════════════════════════════════════════════════════ */

App.router.register('suppliers', () => {
  const sess = App.auth.requireSession(); if (!sess) return;
  document.title = 'Suppliers — SaleStew';
  const app = document.getElementById('app');
  App.buildNav('suppliers');

  const page = document.createElement('main');
  page.className = 'page';
  page.innerHTML = `
    <header class="page-header">
      <div>
        <h1 class="page-header__title">Suppliers</h1>
        <p class="page-header__sub">// vendor management & reorder contacts</p>
      </div>
      <div class="page-header__controls">
        ${sess.role==='admin' ? '<button class="btn btn--primary" id="btnAddSupplier">+ Add Supplier</button>' : ''}
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-strip" id="suppStats" style="margin-bottom:1.75rem;"></div>

    <!-- Supplier cards -->
    <div id="supplierGrid" class="supplier-grid"></div>

    <!-- Linked inventory -->
    <div class="panel" style="margin-top:1.5rem;" id="linkedPanel" style="display:none;">
      <div class="panel__header">
        <span class="panel__title" id="linkedTitle">Linked Products</span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>SKU</th><th>Product</th><th>Category</th>
            <th>Stock</th><th>Reorder At</th><th>Cost</th><th>Selling</th><th>Status</th>
          </tr></thead>
          <tbody id="linkedTable"></tbody>
        </table>
      </div>
    </div>`;
  app.appendChild(page);

  function renderStats() {
    const suppliers  = App.db.getSuppliers();
    const inv        = App.db.getInventory();
    const linked     = inv.filter(i => i.supplierId);
    const unlinked   = inv.filter(i => !i.supplierId);
    document.getElementById('suppStats').innerHTML = [
      ['Total Suppliers', suppliers.length,  'var(--green)'],
      ['Products Linked', linked.length,     'var(--orange)'],
      ['Not Linked',      unlinked.length,   'var(--purple)'],
      ['Avg Lead Time',   suppliers.length
        ? Math.round(suppliers.reduce((s,x)=>s+(x.leadDays||0),0)/suppliers.length)+' days'
        : '—', 'var(--text-2)'],
    ].map(([l,v,c]) => App.statCard(l,v,c)).join('');
  }

  function renderCards() {
    const suppliers = App.db.getSuppliers();
    const inv       = App.db.getInventory();
    const grid      = document.getElementById('supplierGrid');

    if (!suppliers.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-state__icon">🏭</div>
        <div class="empty-state__text">No suppliers yet.<br>Add your first supplier to link them to inventory products.</div>
      </div>`;
      return;
    }

    grid.innerHTML = suppliers.map(s => {
      const linked = inv.filter(i => i.supplierId === s.id);
      const lowLinked = linked.filter(i => {
        const st = App.db.stockStatus(i);
        return i.stock <= st.t;
      });
      return `
        <div class="supplier-card" data-sid="${s.id}">
          <div class="supplier-card__header">
            <div>
              <div class="supplier-card__name">${s.name}</div>
              <div class="supplier-card__lead">📦 ${s.leadDays || '?'}-day lead time</div>
            </div>
            ${sess.role==='admin' ? `
            <div style="display:flex;gap:0.4rem;">
              <button class="btn btn--icon btn--sm" data-edit-sup="${s.id}" title="Edit">✏</button>
              <button class="btn btn--danger" data-del-sup="${s.id}" title="Delete">✕</button>
            </div>` : ''}
          </div>
          <div class="supplier-card__meta">
            ${s.contact ? `<div>📞 ${s.contact}</div>` : ''}
            ${s.email   ? `<div>✉ <a href="mailto:${s.email}" style="color:var(--green);">${s.email}</a></div>` : ''}
            ${s.address ? `<div>📍 ${s.address}</div>` : ''}
          </div>
          ${s.notes ? `<div class="supplier-card__notes">${s.notes}</div>` : ''}
          <div class="supplier-card__footer">
            <span><strong style="color:var(--green);">${linked.length}</strong> product${linked.length!==1?'s':''} linked</span>
            ${lowLinked.length ? `<span class="badge badge--warn">⚠ ${lowLinked.length} low stock</span>` : ''}
            <button class="btn btn--ghost btn--sm" data-view-sup="${s.id}" style="margin-left:auto;">View Products</button>
          </div>
        </div>`;
    }).join('');

    // Wire events
    grid.querySelectorAll('[data-view-sup]').forEach(btn => {
      btn.addEventListener('click', () => showLinked(+btn.dataset.viewSup));
    });
    grid.querySelectorAll('[data-edit-sup]').forEach(btn => {
      btn.addEventListener('click', () => openEditModal(+btn.dataset.editSup));
    });
    grid.querySelectorAll('[data-del-sup]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = +btn.dataset.delSup;
        const snap = App.db.getSuppliers();
        if (!confirm('Delete this supplier? Their products will be unlinked.')) return;
        App.db.setSuppliers(snap.filter(x=>x.id!==id));
        // Unlink from inventory
        const inv2 = App.db.getInventory().map(i => i.supplierId===id ? {...i,supplierId:null} : i);
        App.db.setInventory(inv2);
        const deleted = snap.find(x=>x.id===id);
        App.actLog?.record(App.actLog.TYPES.SUPPLIER_DEL, deleted?.name || `id:${id}`);
        App.toast('Supplier deleted.', 'warn', 4000, [{ label:'Undo', fn:()=>{ App.db.setSuppliers(snap); App.db.setInventory(App.db.getInventory()); renderAll(); } }]);
        renderAll();
      });
    });
  }

  function showLinked(supplierId) {
    const s   = App.db.getSuppliers().find(x=>x.id===supplierId);
    const inv = App.db.getInventory().filter(i=>i.supplierId===supplierId);
    document.getElementById('linkedTitle').textContent = `Products from: ${s ? s.name : 'Supplier'}`;
    document.getElementById('linkedPanel').style.display = 'block';
    document.getElementById('linkedTable').innerHTML = inv.length === 0
      ? `<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--text-3);">No products linked to this supplier.</td></tr>`
      : inv.map(i => {
          const st = App.db.stockStatus(i);
          return `<tr>
            <td style="color:var(--text-3);font-size:0.65rem;">${i.sku}</td>
            <td style="font-weight:500;">${i.product}</td>
            <td><span class="cat-dot" style="background:${App.catColors[i.category]||'#748e70'}"></span>${i.category}</td>
            <td><strong style="color:${st.color};">${i.stock}</strong></td>
            <td style="color:var(--text-3);">${st.t}</td>
            <td>${App.fmt.money(i.costNGN||i.cost||0)}</td>
            <td style="color:var(--green);">${App.fmt.money(i.selling)}</td>
            <td><span class="badge ${st.cls}">${st.label}</span></td>
          </tr>`;
        }).join('');
    document.getElementById('linkedPanel').scrollIntoView({ behavior:'smooth' });
  }

  function supplierForm(s={}) {
    // Get inventory for linking
    const inv = App.db.getInventory();
    const opts = inv.map(i => {
      const linked = i.supplierId === s.id || (!i.supplierId && s.id === undefined);
      return `<label style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.7rem;color:var(--text-2);cursor:pointer;">
        <input type="checkbox" class="prod-link" value="${i.id}" ${s.id && i.supplierId===s.id?'checked':''} style="accent-color:var(--green);">
        ${i.product} <span class="badge badge--info" style="margin-left:auto;">${i.sku}</span>
      </label>`;
    }).join('');
    return `
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Supplier Name *</label>
          <input class="form-input" id="sName" value="${s.name||''}" placeholder="e.g. Lagos Electronics Depot" />
        </div>
        <div class="form-group">
          <label class="form-label">Lead Time (days)</label>
          <input class="form-input" id="sLead" type="number" min="0" value="${s.leadDays||''}" placeholder="3" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Phone / WhatsApp</label>
          <input class="form-input" id="sContact" value="${s.contact||''}" placeholder="0801-234-5678" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="sEmail" type="email" value="${s.email||''}" placeholder="orders@supplier.ng" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <input class="form-input" id="sAddress" value="${s.address||''}" placeholder="e.g. Alaba Int'l Market, Lagos" />
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-input" id="sNotes" rows="2" placeholder="Best prices on electronics, min order 10 units…">${s.notes||''}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Link Inventory Products</label>
        <div style="max-height:180px;overflow-y:auto;border:1px solid var(--border-2);border-radius:var(--radius);padding:0.5rem 0.75rem;">
          ${opts || '<div style="font-size:0.7rem;color:var(--text-3);padding:0.5rem 0;">No inventory products yet.</div>'}
        </div>
      </div>`;
  }

  function saveSupplierFromForm(existingId, close) {
    const name = document.getElementById('sName').value.trim();
    if (!name) { App.toast('Supplier name is required.','warn'); return; }
    const suppliers = App.db.getSuppliers();
    const inv = App.db.getInventory();

    const linkedIds = new Set(
      [...document.querySelectorAll('.prod-link:checked')].map(cb => +cb.value)
    );

    if (existingId) {
      const idx = suppliers.findIndex(x=>x.id===existingId);
      if (idx>-1) {
        suppliers[idx] = { ...suppliers[idx],
          name, leadDays: parseInt(document.getElementById('sLead').value)||0,
          contact: document.getElementById('sContact').value.trim(),
          email:   document.getElementById('sEmail').value.trim(),
          address: document.getElementById('sAddress').value.trim(),
          notes:   document.getElementById('sNotes').value.trim(),
        };
      }
      App.db.setSuppliers(suppliers);
      // Update inventory links
      App.db.setInventory(inv.map(i => ({
        ...i, supplierId: linkedIds.has(i.id) ? existingId
          : (i.supplierId===existingId ? null : i.supplierId)
      })));
    } else {
      const newId = App.db.nextId(suppliers);
      suppliers.push({
        id: newId, name,
        leadDays: parseInt(document.getElementById('sLead').value)||0,
        contact:  document.getElementById('sContact').value.trim(),
        email:    document.getElementById('sEmail').value.trim(),
        address:  document.getElementById('sAddress').value.trim(),
        notes:    document.getElementById('sNotes').value.trim(),
      });
      App.db.setSuppliers(suppliers);
      App.db.setInventory(inv.map(i => ({
        ...i, supplierId: linkedIds.has(i.id) ? newId : i.supplierId
      })));
    }
    App.actLog?.record(existingId ? App.actLog.TYPES.SUPPLIER_EDIT : App.actLog.TYPES.SUPPLIER_ADD, name);
    App.toast(existingId ? 'Supplier updated.' : 'Supplier added.');
    close();
    renderAll();
  }

  function openAddModal() {
    App.modal({
      title:'Add Supplier', size:'lg',
      html: supplierForm(),
      saveLabel:'Add Supplier',
      onSave: close => saveSupplierFromForm(null, close),
    });
  }

  function openEditModal(id) {
    const s = App.db.getSuppliers().find(x=>x.id===id);
    if (!s) return;
    App.modal({
      title:`Edit: ${s.name}`, size:'lg',
      html: supplierForm(s),
      saveLabel:'Save Changes',
      onSave: close => saveSupplierFromForm(id, close),
    });
  }

  function renderAll() { renderStats(); renderCards(); }

  if (sess.role==='admin') {
    const btn = document.getElementById('btnAddSupplier');
    if (btn) btn.addEventListener('click', openAddModal);
  }

  renderAll();
});

          <table class="data-table" id="previewTable">
            <thead id="previewHead"></thead>
            <tbody id="previewBody"></tbody>
          </table>
        </div>
        <div class="modal__actions" style="margin-top:1.5rem;border-top:1px solid var(--border);padding-top:1rem;">
          <button class="btn btn--ghost" id="backTo2">← Back</button>
          <button class="btn btn--primary" id="confirmImport">✓ Import Now</button>
        </div>
      </div>
    </div>

    <div class="import-pane" id="step4" style="display:none;">
      <div class="panel" style="text-align:center;padding:3rem;">

        <h2 style="font-family:'Playfair Display',serif;margin-bottom:0.5rem;" id="doneTitle">Import Complete</h2>
