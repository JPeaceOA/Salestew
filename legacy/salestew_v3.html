<body>
  <div id="app"></div>
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>
  <script>
/* ==== js/chart-lite.js ==== */
/* ═══════════════════════════════════════════════════════════
   CHART-LITE.JS — Zero-dependency canvas chart engine
   Implements the Chart.js constructor API subset used by
   this app: bar, line, doughnut chart types.
   ═══════════════════════════════════════════════════════════ */

window.Chart = (function () {
  'use strict';

  const FONT = "11px 'DM Mono', monospace";
  const FONT_SM = "9px 'DM Mono', monospace";

  function hexAlpha(hex, a) {
    // rgba from css var string or hex
    if (hex.startsWith('rgba') || hex.startsWith('rgb')) {
      return hex.replace(/[\d.]+\)$/, a + ')');
    }
    if (hex.startsWith('var(')) return `rgba(120,120,120,${a})`;
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function resolveColor(c) {
    if (!c || c === 'transparent') return 'rgba(0,0,0,0)';
    if (c.startsWith('var(')) {
      // Resolve CSS variables against :root
      const prop = c.replace(/^var\(|\)$/g,'');
      return getComputedStyle(document.documentElement).getPropertyValue(prop).trim() || '#888';
    }
    return c;
  }

  function autoYMax(vals) {
    const max = Math.max(...vals.filter(v => v != null), 0);
    if (max === 0) return 10;
    const mag = Math.pow(10, Math.floor(Math.log10(max)));
    return Math.ceil(max / mag) * mag;
  }

  function niceStep(range, ticks = 5) {
    const raw = range / ticks;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const nice = [1,2,2.5,5,10].find(f => f*mag >= raw) || 10;
    return nice * mag;
  }

  // ── BAR CHART ─────────────────────────────────────────────
  function drawBar(ctx, data, options) {
    const canvas = ctx.canvas;
    const W = canvas.width, H = canvas.height;
    const pad = { top:24, right:16, bottom:52, left:72 };
    const chartW = W - pad.left - pad.right;
    const chartH = (H - pad.top - pad.bottom) * .75;
    ctx.clearRect(0, 0, W, H);

    const datasets = data.datasets.filter(d => d.type !== 'line');
    const linesets  = data.datasets.filter(d => d.type === 'line');
    const labels    = data.labels || [];
    const n         = labels.length;
    if (!n) return;

    // Flatten all bar values to determine y-axis scale
    const allVals = datasets.flatMap(d => d.data.filter(v => v != null));
    const yMax    = autoYMax(allVals);
    const step    = niceStep(yMax);
    const yAxisCb = options?.scales?.y?.ticks?.callback;

    // Grid lines
    ctx.save();
    ctx.font = FONT_SM;
    ctx.fillStyle = '#445842';
    ctx.strokeStyle = 'rgba(26,42,26,0.4)';
    ctx.lineWidth = 1;
    for (let v = 0; v <= yMax; v += step) {
      const y = pad.top + chartH - (v / yMax) * chartH;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + chartW, y);
      ctx.stroke();
      const label = yAxisCb ? yAxisCb(v) : v.toFixed(0);
      ctx.textAlign = 'right';
      ctx.fillText(label, pad.left - 6, y + 4);
    }

    // Bars
    const groupW = chartW / n;
    const barGap  = 3;
    const dsCount = datasets.length;

    datasets.forEach((ds, di) => {
      ds.data.forEach((val, i) => {
        if (val == null) return;
        const barW = (groupW - barGap * 2) / dsCount - 1;
        const x    = pad.left + i * groupW + barGap + di * (barW + 1);
        const barH = (val / yMax) * chartH;
        const y    = pad.top + chartH - barH;
        ctx.fillStyle = resolveColor(Array.isArray(ds.backgroundColor) ? ds.backgroundColor[i] : ds.backgroundColor);
        ctx.beginPath();
        const r = Math.min(2, barH / 2);
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + barW - r, y);
        ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
        ctx.lineTo(x + barW, y + barH);
        ctx.lineTo(x, y + barH);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.fill();
      });
    });

    // Line overlay datasets
    linesets.forEach(ds => {
      const pts = ds.data.map((val, i) => {
        if (val == null) return null;
        return {
          x: pad.left + (i + 0.5) * groupW,
          y: pad.top + chartH - (val / yMax) * chartH,
        };
      }).filter(Boolean);
      if (pts.length < 2) return;
      ctx.save();
      ctx.strokeStyle = resolveColor(ds.borderColor);
      ctx.lineWidth   = ds.borderWidth || 2;
      if (ds.borderDash) ctx.setLineDash(ds.borderDash);
      ctx.beginPath();
      pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.restore();
    });

    // X axis labels
    ctx.font = FONT_SM;
    ctx.fillStyle = '#445842';
    ctx.textAlign = 'center';
    labels.forEach((label, i) => {
      const x = pad.left + (i + 0.5) * groupW;
      ctx.save();
      ctx.translate(x, pad.top + chartH + 14);
      ctx.rotate(-0.5);
      ctx.fillText(String(label).slice(0,8), 0, 0);
      ctx.restore();
    });

    // Legend
    const allDs = [...datasets, ...linesets];
    ctx.font = FONT_SM;
    ctx.textAlign = 'left';
    let lx = pad.left;
    allDs.forEach(ds => {
      const c = resolveColor(Array.isArray(ds.backgroundColor) ? ds.backgroundColor[0] : (ds.backgroundColor || ds.borderColor));
      ctx.fillStyle = c;
      ctx.fillRect(lx, H - 14, 10, 10);
      ctx.fillStyle = '#748e70';
      ctx.fillText(ds.label || '', lx + 14, H - 6);
      lx += ctx.measureText(ds.label || '').width + 30;
    });
    ctx.restore();
  }

  // ── LINE CHART ────────────────────────────────────────────
  function drawLine(ctx, data, options) {
    const canvas = ctx.canvas;
    const W = canvas.width, H = canvas.height;
    const pad = { top:20, right:16, bottom:48, left:60 };
    const chartW = W - pad.left - pad.right;
    const chartH = H - pad.top - pad.bottom;
    ctx.clearRect(0,0,W,H);

    const labels   = data.labels || [];
    const datasets = data.datasets || [];
    const n        = labels.length;
    if (!n) return;

    const allVals = datasets.flatMap(d => d.data.filter(v => v != null));
    const yMax    = autoYMax(allVals);
    const step    = niceStep(yMax);

    // Grid
    ctx.save();
    ctx.font = FONT_SM;
    ctx.fillStyle = '#445842';
    ctx.strokeStyle = 'rgba(26,42,26,0.4)';
    ctx.lineWidth = 1;
    for (let v = 0; v <= yMax; v += step) {
      const y = pad.top + chartH - (v/yMax)*chartH;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + chartW, y);
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(v.toFixed(0), pad.left - 6, y + 4);
    }

    // Lines + fill
    datasets.forEach(ds => {
      const pts = ds.data.map((val, i) => ({
        x: pad.left + (n === 1 ? chartW/2 : (i / (n-1)) * chartW),
        y: pad.top + chartH - ((val||0)/yMax)*chartH,
      }));

      if (ds.fill) {
        ctx.save();
        ctx.fillStyle = resolveColor(ds.backgroundColor);
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pad.top + chartH);
        pts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(pts[pts.length-1].x, pad.top + chartH);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.strokeStyle = resolveColor(ds.borderColor);
      ctx.lineWidth   = ds.borderWidth || 2;
      ctx.lineJoin    = 'round';
      ctx.beginPath();
      if (ds.tension && ds.tension > 0) {
        // Simple cubic bezier smoothing
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 0; i < pts.length-1; i++) {
          const cp1x = pts[i].x + (pts[i+1].x - pts[i].x) * 0.4;
          const cp1y = pts[i].y;
          const cp2x = pts[i].x + (pts[i+1].x - pts[i].x) * 0.6;
          const cp2y = pts[i+1].y;
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, pts[i+1].x, pts[i+1].y);
        }
      } else {
        pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      }
      ctx.stroke();
      ctx.restore();

      // Points
      const pr = ds.pointRadius || 3;
      pts.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, pr, 0, Math.PI*2);
        ctx.fillStyle = resolveColor(ds.pointBackgroundColor || ds.borderColor);
        ctx.fill();
      });
    });

    // X labels
    ctx.font = FONT_SM;
    ctx.fillStyle = '#445842';
    ctx.textAlign = 'center';
    labels.forEach((label, i) => {
      const x = pad.left + (n === 1 ? chartW/2 : (i/(n-1))*chartW);
      ctx.save();
      ctx.translate(x, pad.top + chartH + 14);
      ctx.rotate(-0.4);
      ctx.fillText(String(label).slice(0,8), 0, 0);
      ctx.restore();
    });
    ctx.restore();
  }

  // ── DOUGHNUT CHART ────────────────────────────────────────
  function drawDoughnut(ctx, data, options) {
    const canvas = ctx.canvas;
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const legendH = 80;
    const cx = W/2, cy = (H - legendH)/2;
    const radius = Math.min(cx, cy) - 12;
    const cutout = parseFloat(options?.cutout || '60%') / 100;
    const innerR = radius * cutout;

    const vals   = data.datasets[0]?.data || [];
    const colors = data.datasets[0]?.backgroundColor || [];
    const labels = data.labels || [];
    const total  = vals.reduce((s,v) => s+v, 0) || 1;

    let startAngle = -Math.PI/2;
    vals.forEach((v, i) => {
      const slice = (v / total) * Math.PI * 2;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, startAngle, startAngle + slice);
      ctx.closePath();
      ctx.fillStyle = resolveColor(colors[i] || '#888');
      ctx.fill();
      ctx.strokeStyle = resolveColor('var(--bg)') || '#090d0a';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
      startAngle += slice;
    });

    // Inner circle cutout
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, innerR, 0, Math.PI*2);
    ctx.fillStyle = resolveColor('var(--card)') || '#111710';
    ctx.fill();
    ctx.restore();

    // Legend
    const itemW = W / Math.min(labels.length, 3);
    labels.forEach((label, i) => {
      const row = Math.floor(i / 3);
      const col = i % 3;
      const lx  = col * itemW + 8;
      const ly  = H - legendH + row * 22 + 8;
      ctx.fillStyle = resolveColor(colors[i] || '#888');
      ctx.fillRect(lx, ly, 10, 10);
      ctx.font = FONT_SM;
      ctx.fillStyle = '#748e70';
      ctx.textAlign = 'left';
      ctx.fillText(String(label).slice(0,14), lx + 14, ly + 9);
    });
  }

  // ── Tooltip (simple) ─────────────────────────────────────
  function attachTooltip(canvas, data, options, type) {
    const tooltipEl = document.createElement('div');
    Object.assign(tooltipEl.style, {
      position:'fixed', background:'#1c1916', border:'1px solid #2a3d2a',
      color:'#c4d4c0', padding:'6px 10px', fontSize:'11px', fontFamily:'DM Mono,monospace',
      pointerEvents:'none', display:'none', zIndex:'9999', borderRadius:'2px', whiteSpace:'nowrap',
    });
    document.body.appendChild(tooltipEl);

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mx   = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my   = (e.clientY - rect.top)  * (canvas.height / rect.height);
      const labels = data.labels || [];
      const n = labels.length;
      if (!n) return;

      let found = false;
      if (type === 'bar' || type === 'line') {
        const pad  = { left: type === 'line' ? 60 : 72, right:16, top:20, bottom:52 };
        const chartW = canvas.width - pad.left - pad.right;
        const idx = Math.floor((mx - pad.left) / (chartW / n));
        if (idx >= 0 && idx < n) {
          const lines = data.datasets.map(ds => {
            const cb = options?.plugins?.tooltip?.callbacks?.label;
            const raw = ds.data[idx];
            if (raw == null) return null;
            const ctx2 = { raw, dataset: ds, label: labels[idx] };
            return cb ? cb(ctx2) : `${ds.label}: ${raw}`;
          }).filter(Boolean);
          if (lines.length) {
            tooltipEl.innerHTML = `<strong>${labels[idx]}</strong><br>${lines.join('<br>')}`;
            tooltipEl.style.display = 'block';
            tooltipEl.style.left = (e.clientX + 12) + 'px';
            tooltipEl.style.top  = (e.clientY - 20) + 'px';
            found = true;
          }
        }
      }
      if (!found) tooltipEl.style.display = 'none';
    });
    canvas.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });
    return tooltipEl;
  }

  // ── PUBLIC CHART CLASS ────────────────────────────────────
  class Chart {
    constructor(canvasOrId, config) {
      this.canvas = typeof canvasOrId === 'string'
        ? document.getElementById(canvasOrId)
        : canvasOrId;
      this.ctx    = this.canvas.getContext('2d');
      this.config = config;
      this._tooltip = null;
      this._resizeObs = null;
      this._draw();
      this._attachResize();
    }

    _setSize() {
      const rect = this.canvas.parentElement?.getBoundingClientRect();
      if (rect && rect.width > 0) {
        this.canvas.width  = rect.width;
        this.canvas.height = this.canvas.getAttribute('height')
          ? parseInt(this.canvas.getAttribute('height')) * (rect.width / 600)
          : 200;
      }
    }

    _draw() {
      this._setSize();
      const { type, data, options } = this.config;
      if (type === 'bar')      drawBar(this.ctx, data, options);
      else if (type === 'line') drawLine(this.ctx, data, options);
      else if (type === 'doughnut') drawDoughnut(this.ctx, data, options);
      if (!this._tooltip && type !== 'doughnut') {
        this._tooltip = attachTooltip(this.canvas, data, options, type);
      }
    }

    _attachResize() {
      if (typeof ResizeObserver === 'undefined') return;
      this._resizeObs = new ResizeObserver(() => this._draw());
      if (this.canvas.parentElement) this._resizeObs.observe(this.canvas.parentElement);
    }

    destroy() {
      if (this._tooltip)    this._tooltip.remove();
      if (this._resizeObs)  this._resizeObs.disconnect();
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }

    update() { this._draw(); }
  }

  return Chart;
})();

/* ==== js/core.js ==== */
'use strict';
/* ═══════════════════════════════════════════════════════════
   CORE.JS  v3.1  — Group B additions:
   · App.alerts  — compute & cache notification alerts
   · App.goals   — goal helpers
   · App.csv     — unchanged
   All pre-existing helpers preserved exactly.
   ═══════════════════════════════════════════════════════════ */

// ── NAMESPACE ──────────────────────────────────────────────
window.App = {};

// ── EXCHANGE RATE ──────────────────────────────────────────
App.NAIRA_PER_USD = 1610;

// ── THEME ──────────────────────────────────────────────────
App.theme = {
  KEY: 'ss_theme',
  current() { return localStorage.getItem(this.KEY) || 'dark'; },
  apply(mode) {
    if (mode === 'light') document.documentElement.setAttribute('data-theme','light');
    else                  document.documentElement.removeAttribute('data-theme');
    localStorage.setItem(this.KEY, mode);
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.textContent = mode === 'light' ? '🌙 Dark' : '☀ Light';
    });
  },
  toggle() { this.apply(this.current() === 'light' ? 'dark' : 'light'); },
};

// ── CURRENCY ───────────────────────────────────────────────
App.currency = {
  current: localStorage.getItem('ss_currency') || 'NGN',
  set(code) {
    this.current = code;
    localStorage.setItem('ss_currency', code);
    document.dispatchEvent(new CustomEvent('currency-changed', { detail: code }));
  },
  format(n) {
    if (this.current === 'USD')
      return '$' + (n / App.NAIRA_PER_USD).toLocaleString('en-NG',
        { minimumFractionDigits:2, maximumFractionDigits:2 });
    return '₦' + Math.round(n).toLocaleString('en-NG');
  },
  symbol()      { return this.current === 'USD' ? '$' : '₦'; },
  toNaira(val)  { const n = parseFloat(val)||0; return this.current==='USD' ? n*App.NAIRA_PER_USD : n; },
  placeholder() { return this.current === 'USD' ? '0.00 (USD)' : '0.00 (₦)'; },
};

// ── STORAGE ────────────────────────────────────────────────
App.store = {
  get(key, fallback=null) {
    try { const r = localStorage.getItem(key); return r !== null ? JSON.parse(r) : fallback; }
    catch { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); }
    catch(e) { console.warn('localStorage full', e); }
  },
  remove(key) { localStorage.removeItem(key); },
};

// ── AUTH ───────────────────────────────────────────────────
App.auth = {
  SESSION_KEY : 'ss_session',
  USERS_KEY   : 'ss_users',

  async hash(pw) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  },

  getSession() { return App.store.get(this.SESSION_KEY, null); },
  getUsers()   { return App.store.get(this.USERS_KEY, []); },

  saveSession(user) {
    App.store.set(this.SESSION_KEY,
      { userId:user.id, username:user.username, role:user.role, loginTime:Date.now() });
    const users = this.getUsers();
    const idx   = users.findIndex(u => u.id === user.id);
    if (idx > -1) {
      users[idx].lastLogin  = Date.now();
      users[idx].loginCount = (users[idx].loginCount || 0) + 1;
      App.store.set(this.USERS_KEY, users);
    }
  },

  endSession() {
    const sess = this.getSession();
    App.store.remove(this.SESSION_KEY);
    if (!sess) return;
    const users = this.getUsers();
    const idx   = users.findIndex(u => u.id === sess.userId);
    if (idx > -1) {
      users[idx].totalTimeMs = (users[idx].totalTimeMs||0) + (Date.now() - sess.loginTime);
      App.store.set(this.USERS_KEY, users);
    }
  },

  requireSession() {
    const sess = this.getSession();
    if (!sess) { App.router.go('login'); return null; }
    return sess;
  },

  requireAdmin() {
    const sess = this.requireSession();
    if (!sess || sess.role !== 'admin') {
      App.toast('Admins only.', 'error');
      App.router.go('dashboard');
      return false;
    }
    return true;
  },

  async register({ username, password, role='user' }) {
    const users = this.getUsers();
    if (users.find(u => u.username.toLowerCase() === username.toLowerCase()))
      return { ok:false, error:'Username already taken.' };
    const user = {
      id: Date.now(), username: username.trim(),
      hash: await this.hash(password), role,
      createdAt: Date.now(), lastLogin: null, loginCount: 0, totalTimeMs: 0,
    };
    users.push(user);
    App.store.set(this.USERS_KEY, users);
    return { ok:true, user };
  },

  async login({ username, password }) {
    const users = this.getUsers();
    const user  = users.find(u => u.username.toLowerCase() === username.toLowerCase());
    if (!user) return { ok:false, error:'User not found.' };
    if (await this.hash(password) !== user.hash) return { ok:false, error:'Incorrect password.' };
    this.saveSession(user);
    return { ok:true, user };
  },

  async seedAdmin() {
    if (!this.getUsers().length)
      await this.register({ username:'admin', password:'admin123', role:'admin' });
  },
};

// ── CATEGORY COLOURS ───────────────────────────────────────
App.catColors = {
  Electronics:'#6a8faa', Apparel:'#b8622a', Food:'#4e9463',
  Home:'#7252a0', Sports:'#8a7a5a', General:'#748e70',
};

// ── DATABASE ───────────────────────────────────────────────
App.db = {
  KEYS: {
    entries:'ss_entries', inventory:'ss_inventory',
    settings:'ss_settings', suppliers:'ss_suppliers', goals:'ss_goals',
  },

  getEntries()    { return App.store.get(this.KEYS.entries,   []); },
  setEntries(d)   { App.store.set(this.KEYS.entries,   d); },
  getInventory()  { return App.store.get(this.KEYS.inventory, []); },
  setInventory(d) { App.store.set(this.KEYS.inventory, d); },
  getSuppliers()  { return App.store.get(this.KEYS.suppliers, []); },
  setSuppliers(d) { App.store.set(this.KEYS.suppliers, d); },
  getGoals()      { return App.store.get(this.KEYS.goals, []); },
  setGoals(d)     { App.store.set(this.KEYS.goals, d); },

  getSettings() {
    return App.store.get(this.KEYS.settings, { globalLowStockThreshold:20 });
  },
  setSettings(d) { App.store.set(this.KEYS.settings, d); },

  nextId(arr) { return arr.length ? Math.max(...arr.map(e => e.id)) + 1 : 1; },

  stockStatus(item) {
    const t = item.globalThreshold
      ? (this.getSettings().globalLowStockThreshold || 20)
      : item.reorderPoint;
    if (item.stock <= 0)  return { label:'Out of Stock', cls:'badge--red',  color:'var(--down)',   t };
    if (item.stock <= t)  return { label:'Low Stock',    cls:'badge--warn', color:'var(--orange)', t };
    return                       { label:'In Stock',     cls:'badge--green',color:'var(--green)',  t };
  },

  lowStockItems() {
    return this.getInventory().filter(i => i.stock <= this.stockStatus(i).t);
  },

  seedData() {
    if (this.getEntries().length) return;

// ── GOALS ENGINE ───────────────────────────────────────────
// Goal shape: { id, label, metric:'revenue'|'units'|'margin'|'products',
//               category:'all'|<cat>, period:'month'|'quarter'|'year',
//               target:<number>, createdAt:<ts> }
App.goals = {
  METRICS: [
    { key:'revenue',  label:'Revenue',          unit:'money' },
    { key:'units',    label:'Units Sold',        unit:'number' },
    { key:'margin',   label:'Avg Margin (%)',    unit:'pct' },
    { key:'products', label:'Products Tracked',  unit:'number' },
  ],

  // Compute actual value for a goal against current data
  compute(goal) {
    let entries = App.db.getEntries();
    entries = App.filterByPeriod(entries, goal.period);
    if (goal.category !== 'all') entries = entries.filter(e => e.category === goal.category);
    switch (goal.metric) {
      case 'revenue':  return entries.reduce((s,e) => s+e.revenue, 0);
      case 'units':    return entries.reduce((s,e) => s+e.units, 0);
      case 'margin':   return entries.length ? entries.reduce((s,e)=>s+e.margin,0)/entries.length : 0;
      case 'products': return new Set(entries.map(e=>e.product)).size;
      default:         return 0;
    }
  },

  // Format a value according to metric unit
  formatValue(goal, val) {
    const m = this.METRICS.find(x => x.key === goal.metric);
    if (!m) return val;
    if (m.unit === 'money')  return App.currency.format(val);
    if (m.unit === 'pct')    return val.toFixed(1) + '%';
    return App.fmt.num(Math.round(val));
  },

  // Percentage progress (capped at 100 for display, can exceed for celebration)
  progress(goal) {
    const actual = this.compute(goal);
    return goal.target > 0 ? (actual / goal.target * 100) : 0;
  },
};

// ── ALERTS ENGINE ──────────────────────────────────────────
// Returns array of alert objects: { type, level, title, body, action? }
// level: 'warn' | 'error' | 'info'
App.alerts = {
  DISMISSED_KEY: 'ss_alerts_dismissed',

  getDismissed() { return App.store.get(this.DISMISSED_KEY, []); },
  dismiss(id) {
    const d = this.getDismissed();
    if (!d.includes(id)) { d.push(id); App.store.set(this.DISMISSED_KEY, d); }
  },
  clearDismissed() { App.store.remove(this.DISMISSED_KEY); },

  compute() {
    const dismissed = this.getDismissed();
    const alerts = [];

    // 1. Out of stock
    const outOfStock = App.db.getInventory().filter(i => i.stock <= 0);
    outOfStock.forEach(i => {
      const id = `oos-${i.id}`;
      if (!dismissed.includes(id))
        alerts.push({ id, level:'error', icon:'🚫', title:'Out of Stock', body:`${i.product} has 0 units remaining.`, action:{ label:'View Inventory', page:'inventory' } });
    });

    // 2. Low stock (above zero but below threshold)
    const lowStock = App.db.lowStockItems().filter(i => i.stock > 0);
    lowStock.forEach(i => {
      const id = `low-${i.id}`;
      const st = App.db.stockStatus(i);
      if (!dismissed.includes(id))
        alerts.push({ id, level:'warn', icon:'⚠', title:'Low Stock', body:`${i.product} — only ${i.stock} left (reorder at ${st.t}).`, action:{ label:'View Inventory', page:'inventory' } });
    });

    // 3. Goals nearing deadline or behind
    const goals = App.db.getGoals();
    goals.forEach(g => {
      const pct = App.goals.progress(g);
      const id  = `goal-${g.id}-${Math.floor(pct/10)}`;
      if (pct < 50 && !dismissed.includes(id))
        alerts.push({ id, level:'warn', icon:'🎯', title:'Goal Behind', body:`"${g.label}" is at ${pct.toFixed(0)}% of target.`, action:{ label:'View Goals', page:'dashboard' } });
      if (pct >= 100) {
        const celebId = `goal-done-${g.id}`;
        if (!dismissed.includes(celebId))
          alerts.push({ id:celebId, level:'info', icon:'🏆', title:'Goal Reached!', body:`"${g.label}" hit ${pct.toFixed(0)}% of target!`, action:{ label:'View Goals', page:'dashboard' } });
      }
    });

    // 4. No sales this month
    const thisMonth = App.filterByPeriod(App.db.getEntries(), 'month');
    const noSalesId = 'no-sales-month';
    if (!thisMonth.length && !dismissed.includes(noSalesId))
      alerts.push({ id:noSalesId, level:'info', icon:'📊', title:'No Sales This Month', body:'No sales entries recorded for the current month yet.', action:{ label:'Add Sale', page:'dashboard' } });

    return alerts;
  },

  count() { return this.compute().length; },
};

// Shared modal factory
App.modal = function({ title, html, size='', onSave, saveLabel='Save', danger=false }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay is-open';
  overlay.innerHTML = `
    <div class="modal${size ? ' modal--'+size : ''}">
      <div class="modal__header">
        <h2 class="modal__title">${title}</h2>
        <button class="modal__close" data-close>✕</button>
      </div>
      ${html}
      ${onSave !== undefined ? `
      <div class="modal__actions">
        <button class="btn btn--ghost" data-close>Cancel</button>
        <button class="btn btn--${danger ? 'danger-solid' : 'primary'}" data-save>${saveLabel}</button>
      </div>` : ''}
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  if (onSave) overlay.querySelector('[data-save]').addEventListener('click', () => onSave(close));
  const onKey = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); }};
  document.addEventListener('keydown', onKey);
  return { close };
};

// Shared period filter
App.filterByPeriod = function(entries, period, from='', to='') {
  if (period === 'all') return entries;
  const now = new Date();
  return entries.filter(e => {
    const d = new Date(e.date);
    if (period === 'month')   return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
    if (period === 'quarter') return Math.floor(d.getMonth()/3)===Math.floor(now.getMonth()/3) && d.getFullYear()===now.getFullYear();
    if (period === 'year')    return d.getFullYear()===now.getFullYear();
    if (period === 'custom')  return from && to ? (e.date >= from && e.date <= to) : true;
    return true;
  });
};

App.toast = function(msg, type='success', duration=2800, actions=[]) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const el = document.createElement('div');
  el.className = `toast${type !== 'success' ? ' toast--'+type : ''}`;
  const actHTML = actions.map((a,i) =>
    `<button class="toast__action" data-act="${i}">${a.label}</button>`
  ).join('');
  el.innerHTML = `<span class="toast__msg">${msg}</span>${actHTML}`;
  container.appendChild(el);
  actions.forEach((a,i) => {
    el.querySelector(`[data-act="${i}"]`).addEventListener('click', () => { a.fn(); el.remove(); });
  });
  const fade = setTimeout(() => {
    el.style.opacity='0'; el.style.transition='opacity 0.3s';
    setTimeout(()=>el.remove(),300);
  }, duration);
  el.addEventListener('click', e => {
    if (!e.target.closest('.toast__action')) { clearTimeout(fade); el.remove(); }
  });
};

// ── BACKUP / RESTORE (Feature 8) ────────────────────────────
App.backup = {
  // All keys that constitute a full app backup
  KEYS: ['ss_entries','ss_inventory','ss_settings','ss_suppliers','ss_goals',
         'ss_alerts_dismissed','ss_currency','ss_theme','ss_actlog'],

  // Export: dump all keys to a timestamped JSON file download
  export() {
    const snapshot = {};
    this.KEYS.forEach(k => {
      const v = localStorage.getItem(k);
      if (v !== null) snapshot[k] = v; // store raw JSON strings as-is
    });
    const meta = {
      version: '3.0',
      exportedAt: new Date().toISOString(),
      appName: 'SaleStew',
    };
    const payload = JSON.stringify({ meta, data: snapshot }, null, 2);
    const blob    = new Blob([payload], { type:'application/json;charset=utf-8;' });
    const url     = URL.createObjectURL(blob);
    const fname   = `salestew_backup_${new Date().toISOString().slice(0,10)}.json`;
    const a       = Object.assign(document.createElement('a'), { href:url, download:fname });
    a.click();
    URL.revokeObjectURL(url);
    return { ok:true, keys: Object.keys(snapshot).length };
  },

  // Import: read a backup JSON file, validate, then restore to localStorage
  import(file) {
    return new Promise((resolve, reject) => {
      if (!file || !file.name.endsWith('.json')) {
        return reject(new Error('Please select a .json backup file.'));
      }
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed.meta || parsed.meta.appName !== 'SaleStew' || !parsed.data) {
            return reject(new Error('Invalid backup file — not a SaleStew backup.'));
          }
          // Validate data keys look like our known keys
          const data    = parsed.data;
          const dataKeys = Object.keys(data);
          const valid   = dataKeys.every(k => k.startsWith('ss_'));
          if (!valid) return reject(new Error('Backup contains unexpected data keys.'));

          // Restore
          dataKeys.forEach(k => localStorage.setItem(k, data[k]));
          resolve({ ok:true, keys:dataKeys.length, exportedAt:parsed.meta.exportedAt });
        } catch(e) {
          reject(new Error('Could not parse backup file: ' + e.message));
        }
      };
      reader.onerror = () => reject(new Error('File could not be read.'));
      reader.readAsText(file);
    });
  },
};

// ── CSV UTILITIES ───────────────────────────────────────────
App.csv = {
  parse(text) {
    const rows = [];
    let cur = '', inQ = false, row = [];
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i+1];
      if (ch === '"') {
        if (inQ && next === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        row.push(cur.trim()); cur = '';
      } else if ((ch === '\n' || ch === '\r') && !inQ) {
        if (ch === '\r' && next === '\n') i++;
        row.push(cur.trim()); rows.push(row); row = []; cur = '';
      } else { cur += ch; }
    }
    if (cur || row.length) { row.push(cur.trim()); rows.push(row); }
    return rows.filter(r => r.some(c => c !== ''));
  },
  stringify(rows) {
    return rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
  },
  download(filename, text) {
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8;'})),
      download: filename,
    });
    a.click();
    URL.revokeObjectURL(a.href);
  },
};

    { id:'prediction', label:'Forecast',  icon:'🔮' },
    { id:'history',    label:'History',   icon:'📋' },
    { id:'suppliers',  label:'Suppliers', icon:'🏭' },
    ...(sess && sess.role==='admin' ? [{ id:'admin', label:'Admin', icon:'🛡' }] : []),
    { id:'settings',   label:'Settings',  icon:'⚙' },
  ];

  const linkHTML = links.map(l => `
    <li><a href="#${l.id}" data-page="${l.id}" class="${activePage===l.id?'is-active':''}">
      <span>${l.icon}</span>${l.label}
    </a></li>`).join('');

  const drawerLinkHTML = links.map(l => `
    <a href="#${l.id}" data-page="${l.id}" class="${activePage===l.id?'is-active':''}">
      <span>${l.icon}</span>${l.label}
    </a>`).join('');

  const bellBadge = alertCount > 0
    ? `<span class="bell-badge">${alertCount > 9 ? '9+' : alertCount}</span>`
    : '';

  const nav = document.createElement('nav');
  nav.className = 'nav';
  nav.innerHTML = `
    <div class="nav__brand">SaleStew<span class="nav__brand-sub">// tracker</span></div>
    <ul class="nav__links">${linkHTML}</ul>
    <div class="nav__right">
      <div class="nav__currency">
        <button class="currency-btn ${curNGN?'is-active':''}" data-cur="NGN">₦ NGN</button>
        <button class="currency-btn ${!curNGN?'is-active':''}" data-cur="USD">$ USD</button>
      </div>
      <button class="theme-btn" id="navThemeBtn">${isLight?'🌙 Dark':'☀ Light'}</button>

      <!-- Global search -->
      <button class="search-nav-btn" id="navSearchBtn" title="Search (Cmd+K)">
        🔍 <kbd class="search-nav-btn__kbd">⌘K</kbd>
      </button>

      <!-- Shortcuts hint -->
      <button class="shortcuts-hint-btn" id="navShortcutsBtn" title="Keyboard shortcuts (?)">?</button>

      <!-- Bell button -->
      <div class="bell-wrap dropdown" id="bellMenu">
        <button class="bell-btn" id="bellBtn" aria-label="Notifications">
          🔔${bellBadge}
        </button>
        <div class="alerts-panel dropdown__menu" id="alertsPanel"></div>
      </div>

      <div class="nav__user dropdown" id="userMenu">
        <div class="nav__avatar">${initials}</div>
        <span class="nav__user-name">${sess?sess.username:''}</span>
        <div class="dropdown__menu" id="userDropdown">
          <div style="padding:0.6rem 1rem 0.4rem;font-size:0.62rem;color:var(--text-3);letter-spacing:0.08em;text-transform:uppercase;">
            ${sess?sess.username:''} <span class="badge badge--${sess&&sess.role==='admin'?'orange':'info'}">${sess?sess.role:''}</span>
          </div>
          <div style="padding:0.15rem 1rem 0.5rem;font-size:0.6rem;color:var(--text-3);display:flex;align-items:center;gap:0.4rem;">
            <span style="color:var(--green);font-size:0.55rem;">●</span>
            Session: <span id="sessionTimer">0m</span>
          </div>
          <div class="dropdown__divider"></div>
          <button class="dropdown__item" id="profileBtn">⚙ Settings</button>
          <button class="dropdown__item" id="activityBtn">📋 Activity Log</button>
          <div class="dropdown__divider"></div>
          <button class="dropdown__item dropdown__item--danger" id="logoutBtn">Sign out</button>
        </div>
      </div>
      <button class="nav__hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>`;

  const drawer = document.createElement('div');
  drawer.className = 'nav__drawer';
  drawer.id = 'navDrawer';
  drawer.innerHTML = `
    ${drawerLinkHTML}
    <div class="nav__drawer-extras">
      <button class="currency-btn ${curNGN?'is-active':''}" data-cur="NGN" data-drawer-cur>₦ NGN</button>
      <button class="currency-btn ${!curNGN?'is-active':''}" data-cur="USD" data-drawer-cur>$ USD</button>
      <button class="theme-btn" id="drawerThemeBtn">${isLight?'🌙 Dark':'☀ Light'}</button>
    </div>`;

  document.body.insertBefore(drawer, document.body.firstChild);
  document.body.insertBefore(nav, drawer);

  // Page navigation
  const goPage = page => {
    drawer.classList.remove('is-open');
    hamburger.classList.remove('is-open');
    App.router.go(page);
  };
  nav.querySelectorAll('[data-page]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); goPage(a.dataset.page); }));
  drawer.querySelectorAll('[data-page]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); goPage(a.dataset.page); }));

  // Currency
  const setCur = code => { App.currency.set(code); App.router.go(App.router.current || 'dashboard'); };
  nav.querySelectorAll('.currency-btn').forEach(b => b.addEventListener('click', () => setCur(b.dataset.cur)));
  drawer.querySelectorAll('[data-drawer-cur]').forEach(b => b.addEventListener('click', () => { drawer.classList.remove('is-open'); hamburger.classList.remove('is-open'); setCur(b.dataset.cur); }));

  // Theme
  nav.querySelector('#navThemeBtn').addEventListener('click', () => App.theme.toggle());
  drawer.querySelector('#drawerThemeBtn').addEventListener('click', () => App.theme.toggle());

  // Global search button
  nav.querySelector('#navSearchBtn')?.addEventListener('click', () => App.search?.open());

  // Keyboard shortcuts cheat-sheet button
  nav.querySelector('#navShortcutsBtn')?.addEventListener('click', () => App.shortcuts?.showSheet());

  // Bell / alerts
  const bellMenu  = nav.querySelector('#bellMenu');
  const bellBtn   = nav.querySelector('#bellBtn');
  const alertsPanel = nav.querySelector('#alertsPanel');

  function renderAlertsPanel() {
    const all = App.alerts.compute();
    if (!all.length) {
      alertsPanel.innerHTML = `
        <div class="alerts-panel__head">Notifications</div>
        <div class="alerts-panel__empty">🎉 All clear — no alerts right now.</div>`;
      return;
    }
    alertsPanel.innerHTML = `
      <div class="alerts-panel__head">
        Notifications <span class="bell-badge" style="position:static;margin-left:6px;">${all.length}</span>
        <button class="alerts-panel__clear-all" id="clearAllAlerts">Clear all</button>
      </div>
      ${all.map(a => `
        <div class="alerts-item alerts-item--${a.level}" data-alert-id="${a.id}">
          <span class="alerts-item__icon">${a.icon}</span>
          <div class="alerts-item__body">
            <div class="alerts-item__title">${a.title}</div>
            <div class="alerts-item__msg">${a.body}</div>
            ${a.action ? `<button class="alerts-item__action" data-page="${a.action.page}">${a.action.label} →</button>` : ''}
          </div>
          <button class="alerts-item__dismiss" data-dismiss="${a.id}" title="Dismiss">✕</button>
        </div>`).join('')}`;

    alertsPanel.querySelectorAll('[data-dismiss]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        App.alerts.dismiss(btn.dataset.dismiss);
        renderAlertsPanel();
        updateBellBadge();
      });
    });
    alertsPanel.querySelectorAll('[data-page]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        alertsPanel.classList.remove('is-open');
        goPage(btn.dataset.page);
      });
    });
    alertsPanel.querySelector('#clearAllAlerts')?.addEventListener('click', e => {
      e.stopPropagation();
      App.alerts.compute().forEach(a => App.alerts.dismiss(a.id));
      renderAlertsPanel();
      updateBellBadge();
    });
  }

  function updateBellBadge() {
    const n = App.alerts.count();
    const existing = bellBtn.querySelector('.bell-badge');
    if (existing) existing.remove();
    if (n > 0) {
      const badge = document.createElement('span');
      badge.className = 'bell-badge';
      badge.textContent = n > 9 ? '9+' : n;
      bellBtn.appendChild(badge);
    }
  }

  bellBtn.addEventListener('click', e => {
    e.stopPropagation();
    userDropdown.classList.remove('is-open');
    const isOpen = alertsPanel.classList.toggle('is-open');
    if (isOpen) renderAlertsPanel();
  });

  // User dropdown
  const hamburger   = nav.querySelector('#hamburger');
  const userMenu2   = nav.querySelector('#userMenu');
  const userDropdown = nav.querySelector('#userDropdown');
  userMenu2.addEventListener('click', e => {
    e.stopPropagation();
    alertsPanel.classList.remove('is-open');
    userDropdown.classList.toggle('is-open');
  });
  document.addEventListener('click', () => {
    userDropdown.classList.remove('is-open');
    alertsPanel.classList.remove('is-open');
  });

  nav.querySelector('#profileBtn').addEventListener('click', () => goPage('settings'));
  nav.querySelector('#activityBtn')?.addEventListener('click', () => goPage('activity'));
  nav.querySelector('#logoutBtn').addEventListener('click', () => { App.actLog?.record(App.actLog.TYPES.LOGOUT); App.auth.endSession(); App.router.go('login'); });

  // ── Live session timer ──────────────────────────────────
  const timerEl = nav.querySelector('#sessionTimer');
  if (timerEl && sess) {
    const updateTimer = () => {
      const elapsed = Date.now() - sess.loginTime;
      const h = Math.floor(elapsed / 3600000);
      const m = Math.floor((elapsed % 3600000) / 60000);
      timerEl.textContent = h > 0 ? `${h}h ${m}m` : `${m}m`;
    };
    updateTimer();
    const timerInterval = setInterval(updateTimer, 60000);
    // Clean up on nav rebuild (router clears DOM)
    const observer = new MutationObserver(() => {
      if (!document.contains(timerEl)) { clearInterval(timerInterval); observer.disconnect(); }
    });
    observer.observe(document.body, { childList: true, subtree: false });
  }

  hamburger.addEventListener('click', e => {
    e.stopPropagation();
    hamburger.classList.toggle('is-open');
    drawer.classList.toggle('is-open');
  });
  document.addEventListener('click', e => {
    if (!nav.contains(e.target) && !drawer.contains(e.target)) {
      drawer.classList.remove('is-open');
      hamburger.classList.remove('is-open');
    }
  });
};

        <div class="form-group">

  document.getElementById('goLogin').addEventListener('click', () => App.router.go('login'));
});

          <div class="bulk-bar" id="bulkBar" style="display:none;">
            <span id="bulkCount" style="font-size:0.65rem;color:var(--text-3);"></span>
            <button class="btn btn--ghost btn--sm" id="btnBulkExport">⬇ Export</button>
            <button class="btn btn--danger" id="btnBulkDelete">✕ Delete</button>

              <th data-sort="date">Date ↕</th>
              <th data-sort="product">Product ↕</th>
              <th data-sort="category">Category ↕</th>
              <th data-sort="units">Units ↕</th>
              <th data-sort="revenue">Revenue ↕</th>

          </thead>
          <tbody id="salesTable"></tbody>
        </table>
      </div>
    </section>`;

  app.appendChild(page);

  // ── STATE ─────────────────────────────────────────────────
  let sortCol='date', sortDir=-1, filterCat='all', searchQ='', selected=new Set();
  let activePeriod='month', customFrom='', customTo='';
  const charts={};

  // ── DATE RANGE PICKER ─────────────────────────────────────
  const today      = new Date().toISOString().slice(0,10);
  const monthStart = today.slice(0,8)+'01';
  document.getElementById('customFrom').value = monthStart;
  document.getElementById('customTo').value   = today;

  const PRESET_LABELS = { month:'This Month', quarter:'This Quarter', year:'This Year', all:'All Time', custom:'Custom Range' };

  function setActivePreset(period) {
    activePeriod = period;
    document.querySelectorAll('.date-preset').forEach(b => b.classList.toggle('is-active', b.dataset.period===period));
    document.getElementById('datePickerCustom').style.display = period==='custom' ? 'flex' : 'none';
    const label = document.getElementById('datePickerLabel');
    label.textContent = (period==='custom' && customFrom && customTo)
      ? `${customFrom} → ${customTo}`
      : PRESET_LABELS[period] || period;
  }

  document.getElementById('datePickerPresets').querySelectorAll('.date-preset').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.period !== 'custom') { setActivePreset(btn.dataset.period); renderAll(); }
      else setActivePreset('custom');
    });
  });

  document.getElementById('applyCustomDate').addEventListener('click', () => {
    customFrom = document.getElementById('customFrom').value;
    customTo   = document.getElementById('customTo').value;
    if (!customFrom || !customTo)    { App.toast('Select both dates.','warn'); return; }
    if (customFrom > customTo)       { App.toast('Start must be before end.','warn'); return; }
    setActivePreset('custom');
    renderAll();
  });

  setActivePreset('month');

  // ── DATA HELPERS ──────────────────────────────────────────
  function filtered() { return App.filterByPeriod(App.db.getEntries(), activePeriod, customFrom, customTo); }
  function visible(entries) {
    const q = searchQ.toLowerCase();
    return entries
      .filter(e => (filterCat==='all'||e.category===filterCat) &&
                   (!q || e.product.toLowerCase().includes(q) || e.category.toLowerCase().includes(q)))
      .sort((a,b) => {
        const av=a[sortCol], bv=b[sortCol];
        return typeof av==='string' ? sortDir*av.localeCompare(bv) : sortDir*(av-bv);
      });
  }

  // ── STATS ─────────────────────────────────────────────────
  function renderStats() {
    const data = filtered();
    const totalRev   = data.reduce((s,e)=>s+e.revenue,0);
    const totalUnits = data.reduce((s,e)=>s+e.units,0);
    const aov        = totalUnits ? totalRev/totalUnits : 0;

  // ── GOALS PANEL ───────────────────────────────────────────
  function renderGoals() {
    const goals = App.db.getGoals();
    const panel = document.getElementById('goalsPanel');
    const grid  = document.getElementById('goalsGrid');
    const sub   = document.getElementById('goalsSubLabel');
    if (!goals.length) {
      panel.style.display = sess.role==='admin' ? 'block' : 'none';
      grid.innerHTML = sess.role==='admin'
        ? `<div class="goals-empty">No goals yet. Click "+ Add Goal" to set your first target.</div>` : '';
      sub.textContent = '';
      return;
    }
    panel.style.display = 'block';
    const achieved = goals.filter(g => App.goals.progress(g) >= 100).length;
    sub.textContent = `${achieved}/${goals.length} achieved`;
    grid.innerHTML = goals.map(g => {
      const actual   = App.goals.compute(g);
      const pct      = Math.min(100, App.goals.progress(g));
      const over     = App.goals.progress(g) > 100;
      const barColor = pct>=100 ? 'var(--green)' : pct>=60 ? 'var(--orange)' : 'var(--down)';
      const icon     = pct>=100 ? '🏆' : pct>=60 ? '📈' : '🎯';
      return `
        <div class="goal-card${pct>=100?' goal-card--done':''}">
          <div class="goal-card__top">
            <span class="goal-card__icon">${icon}</span>
            <div class="goal-card__info">
              <div class="goal-card__label">${g.label}</div>
              <div class="goal-card__meta">${g.category==='all'?'All categories':g.category} · ${PRESET_LABELS[g.period]||g.period}</div>
            </div>
            ${sess.role==='admin' ? `<button class="btn btn--danger" data-del-goal="${g.id}" style="margin-left:auto;" title="Delete goal">✕</button>` : ''}
          </div>
          <div class="goal-card__values">
            <span class="goal-card__actual" style="color:${barColor};">${App.goals.formatValue(g,actual)}</span>
            <span class="goal-card__target">/ ${App.goals.formatValue(g,g.target)}</span>
            <span class="goal-card__pct" style="color:${barColor};margin-left:auto;">${over?'✓ ':''}${App.goals.progress(g).toFixed(0)}%</span>
          </div>
          <div class="progress" style="height:6px;margin-top:0.4rem;">
            <div class="progress__fill" style="width:${pct}%;background:${barColor};"></div>
          </div>
        </div>`;
    }).join('');

    grid.querySelectorAll('[data-del-goal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const snap = App.db.getGoals();
        const goal = snap.find(g => g.id === +btn.dataset.delGoal);
        App.db.setGoals(snap.filter(g=>g.id!==+btn.dataset.delGoal));
        App.actLog?.record(App.actLog.TYPES.GOAL_DELETE, goal?.label || `id:${btn.dataset.delGoal}`);
        App.toast('Goal removed.','warn',4000,[{ label:'Undo', fn:()=>{ App.db.setGoals(snap); renderGoals(); } }]);
        renderGoals();
      });
    });
  }

  // ── INLINE EDITING (Feature 1) ────────────────────────────
  // Editable columns: date, units, revenue, margin, status, trend
  // Non-editable: product (too many downstream effects), category (same), checkbox, delete

  const EDITABLE = {
    date:    { type:'date',   label:'Date' },
    units:   { type:'number', label:'Units', min:1 },
    revenue: { type:'number', label:'Revenue', min:0 },
    margin:  { type:'number', label:'Margin %', min:0, max:100 },
    status:  { type:'select', label:'Status', options:['Active','Pending','Discontinued'] },
    trend:   { type:'number', label:'Trend %', min:-100, max:100 },
  };

  function startInlineEdit(td, entry, field) {
    if (td.classList.contains('is-editing')) return;
    td.classList.add('is-editing');

    const spec  = EDITABLE[field];
    const orig  = entry[field];

    // Build the input/select
    let input;
    if (spec.type === 'select') {
      input = document.createElement('select');
      input.className = 'inline-edit__input';
      spec.options.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o; opt.textContent = o;
        if (o === orig) opt.selected = true;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement('input');
      input.type      = spec.type;
      input.className = 'inline-edit__input';
      input.value     = field==='revenue' && App.currency.current==='USD'
        ? (orig / App.NAIRA_PER_USD).toFixed(2)
        : orig;
      if (spec.min != null) input.min = spec.min;
      if (spec.max != null) input.max = spec.max;
    }

    const origHTML = td.innerHTML;
    td.innerHTML = '';
    td.appendChild(input);
    input.focus();
    if (input.select) input.select();

    function commit() {
      td.classList.remove('is-editing');
      let newVal = input.value;

      // Parse and validate
      if (spec.type === 'number') {
        newVal = parseFloat(newVal);
        if (isNaN(newVal)) { td.innerHTML = origHTML; return; }
        if (spec.min != null && newVal < spec.min) newVal = spec.min;
        if (spec.max != null && newVal > spec.max) newVal = spec.max;
        newVal = Math.round(newVal * 100) / 100;
      }
      if (spec.type === 'date') {
        if (!newVal) { td.innerHTML = origHTML; return; }
      }

      // Convert revenue back to NGN if editing in USD
      if (field === 'revenue' && App.currency.current === 'USD')
        newVal = Math.round(newVal * App.NAIRA_PER_USD);

      if (String(newVal) === String(orig)) { td.innerHTML = origHTML; return; }

      // Save with undo
      const snapshot = App.db.getEntries();
      const entries  = App.db.getEntries();
      const idx      = entries.findIndex(e => e.id === entry.id);
      if (idx > -1) {
        entries[idx] = { ...entries[idx], [field]: newVal };
        App.db.setEntries(entries);
        App.actLog?.record(App.actLog.TYPES.SALE_EDIT, `${entry.product} — ${spec.label}: ${newVal}`);
        App.toast(`${spec.label} updated.`, 'success', 3500, [{
          label:'Undo', fn:()=>{ App.db.setEntries(snapshot); renderAll(); },
        }]);
        renderAll();
      }
    }

    function cancel() {
      td.classList.remove('is-editing');
      td.innerHTML = origHTML;
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); input.removeEventListener('blur', commit); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); input.removeEventListener('blur', commit); cancel(); }
    });
  }

  // ── TABLE ─────────────────────────────────────────────────
  function renderTableDirect(data) {
    document.getElementById('entryCount').textContent = `${data.length} record${data.length!==1?'s':''}`;
    const tbody    = document.getElementById('salesTable');
    const colCount = sess.role==='admin' ? 11 : 9;
    tbody.innerHTML = data.length===0
      ? `<tr><td colspan="${colCount}" style="text-align:center;padding:2rem;color:var(--text-3);">No records match your filter.</td></tr>`
      : data.map(e=>{
          const color = App.catColors[e.category]||'#748e70';
          const bc    = {Active:'green',Pending:'orange',Discontinued:'red'}[e.status]||'info';
          const tc    = e.trend>=0?'u-up':'u-down';
          const chk   = sess.role==='admin'
            ? `<td><input type="checkbox" class="row-check" data-id="${e.id}" ${selected.has(e.id)?'checked':''} style="accent-color:var(--green);"></td>` : '';
          const del   = sess.role==='admin'
            ? `<td><button class="btn btn--danger" data-del="${e.id}">✕</button></td>` : '';
          // data-field on each editable cell — double-click triggers inline edit
          const edClass = sess.role==='admin' ? ' class="editable-cell"' : '';
          return `<tr${selected.has(e.id)?' class="is-selected"':''}>
            ${chk}
            <td${edClass} data-id="${e.id}" data-field="date" style="color:var(--text-3);white-space:nowrap;">${e.date}</td>
            <td style="font-weight:500;">${e.product}</td>
            <td><span class="cat-dot" style="background:${color}"></span>${e.category}</td>
            <td${edClass} data-id="${e.id}" data-field="units">${App.fmt.num(e.units)}</td>
            <td${edClass} data-id="${e.id}" data-field="revenue" style="color:var(--green);">${App.fmt.money(e.revenue)}</td>
            <td${edClass} data-id="${e.id}" data-field="margin">${e.margin}%</td>
            <td${edClass} data-id="${e.id}" data-field="status"><span class="badge badge--${bc}">${e.status}</span></td>
            <td${edClass} data-id="${e.id}" data-field="trend"><span class="${tc}">${e.trend>=0?'↑':'↓'} ${Math.abs(e.trend)}%</span></td>
            ${del}
          </tr>`;
        }).join('');

    // Wire inline editing (admin only) — double-click
    if (sess.role==='admin') {
      tbody.querySelectorAll('.editable-cell').forEach(td => {
        td.addEventListener('dblclick', () => {
          const id    = +td.dataset.id;
          const field = td.dataset.field;
          const entry = App.db.getEntries().find(e => e.id === id);
          if (entry) startInlineEdit(td, entry, field);
        });
      });

      // Row checkboxes
      tbody.querySelectorAll('.row-check').forEach(cb => {
        cb.addEventListener('change', () => {
          selected[cb.checked?'add':'delete'](+cb.dataset.id);
          updateBulkBar();
        });
      });

      // Delete with undo
      tbody.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id   = +btn.dataset.del;
          const snap = App.db.getEntries();
          const deleted = snap.find(e=>e.id===id);
          App.db.setEntries(snap.filter(e=>e.id!==id));
          selected.delete(id);
          updateBulkBar();
          App.actLog?.record(App.actLog.TYPES.SALE_DELETE, deleted?.product || `id:${id}`);
          App.toast('Entry removed.', 'success', 4000, [{ label:'Undo', fn:()=>{ App.db.setEntries(snap); renderAll(); } }]);
          renderAll();
        });
      });

      const selAll = document.getElementById('selectAll');
      if (selAll) selAll.addEventListener('change', e => {
        data.forEach(entry => { selected[e.target.checked?'add':'delete'](entry.id); });
        updateBulkBar();
        renderTableDirect(data);
      });
    }
  }

  function renderTable() { renderTableDirect(visible(filtered())); }

  // ── BULK BAR ──────────────────────────────────────────────
  function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    if (!bar) return;
    bar.style.display = selected.size>0 ? 'flex' : 'none';
    const el = document.getElementById('bulkCount');
    if (el) el.textContent = `${selected.size} selected`;
  }

  function wireBulkBar() {
    const bar = document.getElementById('bulkBar');
    if (!bar) return;
    document.getElementById('btnBulkDelete').addEventListener('click', () => {
      if (!selected.size) return;
      const snap = App.db.getEntries();
      App.db.setEntries(snap.filter(e=>!selected.has(e.id)));
      const n=selected.size; selected.clear(); updateBulkBar();
      App.actLog?.record(App.actLog.TYPES.SALE_DELETE, `${n} entries (bulk)`);
      App.toast(`${n} entries deleted.`,'warn',5000,[{ label:'Undo', fn:()=>{ App.db.setEntries(snap); renderAll(); } }]);
      renderAll();
    });
    document.getElementById('btnBulkExport').addEventListener('click', () => {
      const rows = App.db.getEntries().filter(e=>selected.has(e.id));
      if (!rows.length) return;
      const headers = ['Date','Product','Category','Units','Revenue (NGN)','Margin%','Status','Trend%'];
      App.csv.download('salestew_export.csv', App.csv.stringify([headers,...rows.map(e=>[e.date,e.product,e.category,e.units,e.revenue,e.margin,e.status,e.trend])]));
      App.toast(`${rows.length} rows exported.`);
    });
    document.getElementById('btnBulkClear').addEventListener('click', () => {
      selected.clear(); updateBulkBar(); renderTable();
    });
  }
