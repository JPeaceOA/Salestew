        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
          <button class="btn btn--primary" id="goToDashboard">Go to Dashboard</button>
          <button class="btn btn--ghost" id="importAnother">Import Another File</button>
        </div>
      </div>
    </div>`;

  app.appendChild(page);

  // ── State ───────────────────────────────────────────────
  let importType = 'sales';
  let csvHeaders = [], csvRows = [], mappings = {};
  let parsedData = [];

  // ── Field definitions ────────────────────────────────────
  const SALES_FIELDS = [
    { key:'date',     label:'Date *',        required:true,  hint:'YYYY-MM-DD' },
    { key:'product',  label:'Product *',     required:true,  hint:'Product name' },
    { key:'category', label:'Category',      required:false, hint:'Electronics, Food…' },
    { key:'units',    label:'Units Sold *',  required:true,  hint:'Number' },
    { key:'revenue',  label:'Revenue *',     required:true,  hint:'Amount in NGN' },
    { key:'margin',   label:'Margin (%)',    required:false, hint:'0-100' },
    { key:'status',   label:'Status',        required:false, hint:'Active/Pending/Discontinued' },
    { key:'trend',    label:'Trend (%)',     required:false, hint:'Positive or negative number' },
  ];
  const INV_FIELDS = [
    { key:'sku',      label:'SKU *',         required:true,  hint:'Unique code, e.g. EL-001' },
    { key:'product',  label:'Product Name *',required:true,  hint:'Product name' },
    { key:'category', label:'Category',      required:false, hint:'Electronics, Food…' },
    { key:'stock',    label:'Stock Qty *',   required:true,  hint:'Number' },
    { key:'costNGN',  label:'Cost Price (₦)',required:false, hint:'Amount in NGN' },
    { key:'selling',  label:'Selling Price (₦)',required:false,hint:'Amount in NGN' },
    { key:'reorderPoint',label:'Reorder At', required:false, hint:'Number' },
  ];

  function fields() { return importType === 'sales' ? SALES_FIELDS : INV_FIELDS; }

  // ── Step navigation ──────────────────────────────────────
  function goStep(n) {
    [1,2,3,4].forEach(i => {
      document.getElementById(`step${i}`).style.display = i===n ? '' : 'none';
      const s = document.querySelector(`.import-step[data-step="${i}"]`);
      s.classList.toggle('is-active', i===n);
      s.classList.toggle('is-done', i<n);
    });
  }

  // ── Type selector ────────────────────────────────────────
  document.querySelectorAll('.import-type-card').forEach(card => {
    card.addEventListener('click', () => {
      importType = card.dataset.type;
      document.querySelectorAll('.import-type-card').forEach(c => c.classList.remove('is-active'));
      card.classList.add('is-active');
      card.querySelector('input').checked = true;
    });
  });

  // ── Templates ────────────────────────────────────────────
  document.getElementById('btnDlSalesTemplate').addEventListener('click', () => {
    App.csv.download('salestew_sales_template.csv', App.csv.stringify([
      ['date','product','category','units','revenue','margin','status','trend'],
      ['2025-06-01','Sample Product','Electronics','10','500000','25','Active','5'],
    ]));
  });
  document.getElementById('btnDlInvTemplate').addEventListener('click', () => {
    App.csv.download('salestew_inventory_template.csv', App.csv.stringify([
      ['sku','product','category','stock','costNGN','selling','reorderPoint'],
      ['EL-001','Sample Product','Electronics','50','200000','350000','10'],
    ]));
  });

  // ── Dropzone ─────────────────────────────────────────────
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('csvFileInput');

  function handleFile(file) {
    if (!file || !file.name.toLowerCase().endsWith('.csv')) {
      App.toast('Please select a .csv file.', 'warn'); return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      const rows = App.csv.parse(e.target.result);
      if (rows.length < 2) { App.toast('CSV must have a header row and at least one data row.', 'warn'); return; }
      csvHeaders = rows[0];
      csvRows    = rows.slice(1);
      buildMappingStep();
      goStep(2);
    };
    reader.readAsText(file);
  }

  dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('is-drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-drag'));
  dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('is-drag'); handleFile(e.dataTransfer.files[0]); });
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

  // ── Step 2: Column mapping ────────────────────────────────
  function buildMappingStep() {
    document.getElementById('step2Sub').textContent = `${csvHeaders.length} columns detected`;
    const grid = document.getElementById('mappingGrid');
    const autoMap = key => {
      const k = key.toLowerCase();
      return csvHeaders.findIndex(h => h.toLowerCase().replace(/[\s_-]/g,'').includes(k.replace(/[\s_-]/g,'')));
    };
    grid.innerHTML = fields().map(f => {
      const autoIdx = autoMap(f.key);
      return `
        <div class="form-group" style="margin:0;">
          <label class="form-label">${f.label}</label>
          <select class="form-input mapping-sel" data-key="${f.key}">
            <option value="">— skip —</option>
            ${csvHeaders.map((h,i)=>`<option value="${i}" ${autoIdx===i?'selected':''}>${h}</option>`).join('')}
          </select>
          <div style="font-size:0.58rem;color:var(--text-3);margin-top:0.2rem;">${f.hint}</div>
        </div>`;
    }).join('');
  }

  document.getElementById('backTo1').addEventListener('click', () => goStep(1));
  document.getElementById('previewBtn').addEventListener('click', () => {
    // Collect mappings
    mappings = {};
    document.querySelectorAll('.mapping-sel').forEach(sel => {
      if (sel.value !== '') mappings[sel.dataset.key] = +sel.value;
    });
    // Validate required fields
    const missing = fields().filter(f => f.required && mappings[f.key] === undefined).map(f=>f.label.replace(' *',''));
    if (missing.length) { App.toast('Map required fields: '+missing.join(', '),'warn'); return; }
    buildPreview();
    goStep(3);
  });

  // ── Step 3: Preview ───────────────────────────────────────
  function buildPreview() {
    const flds = fields();
    const errors=[], warnings=[];
    parsedData = csvRows.map((row,ri) => {
      const obj={};
      flds.forEach(f => {
        const raw = mappings[f.key] !== undefined ? (row[mappings[f.key]]||'') : '';
        obj[f.key] = raw;
      });
      // Coerce types
      if (importType==='sales') {
        obj.units   = parseInt(obj.units)||0;
        obj.revenue = parseFloat(obj.revenue)||0;
        obj.margin  = parseFloat(obj.margin)||0;
        obj.trend   = parseFloat(obj.trend)||0;
        obj.status  = obj.status || 'Active';
        obj.category= obj.category || 'General';
        if (!obj.date)    errors.push(`Row ${ri+2}: missing date`);
        if (!obj.product) errors.push(`Row ${ri+2}: missing product`);
        if (obj.units<1)  warnings.push(`Row ${ri+2}: units is 0`);
      } else {
        obj.stock       = parseInt(obj.stock)||0;
        obj.costNGN     = parseFloat(obj.costNGN)||0;
        obj.selling     = parseFloat(obj.selling)||0;
        obj.reorderPoint= parseInt(obj.reorderPoint)||10;
        obj.category    = obj.category || 'General';
        obj.globalThreshold = true;
        if (!obj.sku)     errors.push(`Row ${ri+2}: missing SKU`);
        if (!obj.product) errors.push(`Row ${ri+2}: missing product`);
      }
      return obj;
    }).filter(Boolean);

    document.getElementById('previewCount').textContent = `${parsedData.length} rows`;

    const alertsEl = document.getElementById('importAlerts');
    alertsEl.innerHTML = '';
    if (errors.length)   alertsEl.innerHTML += `<div class="alert alert--error" style="margin-bottom:0.5rem;flex-direction:column;align-items:flex-start;gap:0.2rem;"><strong>⚠ ${errors.length} Error${errors.length!==1?'s':''}</strong>${errors.slice(0,5).map(e=>`<div style="font-size:0.65rem;">${e}</div>`).join('')}</div>`;
    if (warnings.length) alertsEl.innerHTML += `<div class="alert alert--warn" style="flex-direction:column;align-items:flex-start;gap:0.2rem;"><strong>${warnings.length} Warning${warnings.length!==1?'s':''}</strong>${warnings.slice(0,5).map(w=>`<div style="font-size:0.65rem;">${w}</div>`).join('')}</div>`;

    const keys = fields().map(f=>f.key);
    document.getElementById('previewHead').innerHTML = `<tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr>`;
    document.getElementById('previewBody').innerHTML = parsedData.slice(0,20).map(obj=>`
      <tr>${keys.map(k=>`<td>${obj[k]??''}</td>`).join('')}</tr>`).join('');
    if (parsedData.length>20) {
      document.getElementById('previewBody').innerHTML += `<tr><td colspan="${keys.length}" style="text-align:center;padding:1rem;color:var(--text-3);">…and ${parsedData.length-20} more rows</td></tr>`;
    }
  }

  document.getElementById('backTo2').addEventListener('click', () => goStep(2));

  // ── Step 4: Confirm & Import ──────────────────────────────
  document.getElementById('confirmImport').addEventListener('click', () => {
    if (!parsedData.length) { App.toast('Nothing to import.','warn'); return;  }

    if (importType==='sales') {
      const entries = App.db.getEntries();
      const startId = App.db.nextId(entries);
      const newRows = parsedData.map((obj,i) => ({ id:startId+i, supplierId:null, ...obj }));
      App.db.setEntries([...entries, ...newRows]);
      App.actLog?.record(App.actLog.TYPES.IMPORT, `${newRows.length} sales rows`);
      document.getElementById('doneTitle').textContent = 'Sales Imported!';
      document.getElementById('doneMsg').textContent   = `${newRows.length} sale record${newRows.length!==1?'s':''} added to your history.`;
    } else {
      const inv = App.db.getInventory();
      const startId = App.db.nextId(inv);
      const newItems = parsedData.map((obj,i) => ({ id:startId+i, supplierId:null, image:null, costUSD:null, globalThreshold:true, ...obj }));
      // Update existing SKUs, add new ones
      const bySkuExisting = {};
      inv.forEach(item => { bySkuExisting[item.sku] = item; });
      const toAdd=[], updated=[];
      newItems.forEach(item => {
        if (bySkuExisting[item.sku]) {
          Object.assign(bySkuExisting[item.sku], item);
          updated.push(item.sku);
        } else { toAdd.push(item); }
      });
      App.db.setInventory([...inv, ...toAdd]);
      App.actLog?.record(App.actLog.TYPES.IMPORT, `${toAdd.length} products added, ${updated.length} updated`);
      document.getElementById('doneTitle').textContent = 'Inventory Imported!';
      document.getElementById('doneMsg').textContent   = `${toAdd.length} new product${toAdd.length!==1?'s':''} added, ${updated.length} updated.`;
    }

    goStep(4);
  });

  document.getElementById('goToDashboard').addEventListener('click', () => App.router.go('dashboard'));
  document.getElementById('importAnother').addEventListener('click', () => {
    csvHeaders=[]; csvRows=[]; mappings={}; parsedData=[];
    fileInput.value='';
    goStep(1);
  });

  goStep(1);
});

/* ==== js/search.js ==== */
'use strict';
/* ═══════════════════════════════════════════════════════════
   SEARCH.JS v1 — Global Cmd/Ctrl+K search palette (Feature 3)
   Searches: sales entries + inventory items
   Keyboard: ↑↓ navigate, Enter go to result, Esc close
   ═══════════════════════════════════════════════════════════ */

App.search = (() => {
  let overlay = null;

  // ── Build result list from query ──────────────────────────
  function getResults(q) {
    if (!q || q.length < 2) return [];
    const lq      = q.toLowerCase();
    const results = [];

    // Sales entries
    App.db.getEntries()
      .filter(e => e.product.toLowerCase().includes(lq) || e.category.toLowerCase().includes(lq) || e.date.includes(lq))
      .slice(0, 6)
      .forEach(e => {
        results.push({
          type:'sale', icon:'📊',
          title: e.product,
          meta:  `${e.date}  ·  ${App.fmt.money(e.revenue)}  ·  ${e.category}`,
          page:  'dashboard',
        });
      });

    // Inventory items
    App.db.getInventory()
      .filter(i => i.product.toLowerCase().includes(lq) || (i.sku||'').toLowerCase().includes(lq) || i.category.toLowerCase().includes(lq))
      .slice(0, 6)
      .forEach(i => {
        const st = App.db.stockStatus(i);
        results.push({
          type:'inventory', icon:'📦',
          title: i.product,
          meta:  `${i.sku || '—'}  ·  ${App.fmt.money(i.selling||0)}  ·  ${st.label}`,
          page:  'inventory',
        });
      });

    // Suppliers
    App.db.getSuppliers()
      .filter(s => s.name.toLowerCase().includes(lq) || (s.contact||'').includes(lq))
      .slice(0, 3)
      .forEach(s => {
        results.push({
          type:'supplier', icon:'🏭',
          title: s.name,
          meta:  `${s.contact||''}  ·  ${s.leadDays||'?'}d lead time`,
          page:  'suppliers',
        });
      });

    // Quick page navigation
    const pages = [
      { id:'dashboard',  label:'Overview Dashboard',  icon:'📊' },
      { id:'inventory',  label:'Inventory',            icon:'📦' },
      { id:'reports',    label:'Reports',              icon:'📄' },
      { id:'prediction', label:'Forecast',             icon:'🔮' },
      { id:'history',    label:'Sales History',        icon:'📋' },
      { id:'suppliers',  label:'Suppliers',            icon:'🏭' },
    ];
    pages
      .filter(p => p.label.toLowerCase().includes(lq) || p.id.includes(lq))
      .slice(0, 2)
      .forEach(p => {
        results.push({ type:'page', icon:p.icon, title:p.label, meta:'Go to page', page:p.id });
      });

    return results;
  }

  // ── Render results list ───────────────────────────────────
  function renderResults(list, activeIdx) {
    const container = overlay?.querySelector('#searchResults');
    if (!container) return;
    if (!list.length) {
      container.innerHTML = `<div class="search-empty">No results found.</div>`;
      return;
    }
    container.innerHTML = list.map((r, i) => `
      <div class="search-result${i===activeIdx?' is-active':''}" data-idx="${i}">
        <span class="search-result__icon">${r.icon}</span>
        <div class="search-result__body">
          <div class="search-result__title">${r.title}</div>
          <div class="search-result__meta">${r.meta}</div>
        </div>
        <span class="search-result__type">${r.type}</span>
      </div>`).join('');
    container.querySelectorAll('.search-result').forEach(el => {
      el.addEventListener('click', () => navigate(list[+el.dataset.idx]));
      el.addEventListener('mouseenter', () => {
        container.querySelectorAll('.search-result').forEach(x=>x.classList.remove('is-active'));
        el.classList.add('is-active');
      });
    });
  }

  function navigate(result) {
    close();
    App.router.go(result.page);
  }

  // ── Open palette ──────────────────────────────────────────
  function open() {
    if (overlay) return;  // already open
    overlay = document.createElement('div');
    overlay.className = 'search-overlay';
    overlay.innerHTML = `
      <div class="search-palette">
        <div class="search-palette__input-wrap">
          <span class="search-palette__icon">🔍</span>
          <input class="search-palette__input" id="searchPaletteInput"
            type="text" placeholder="Search products, sales, pages…" autocomplete="off" spellcheck="false" />
          <kbd class="search-palette__esc">esc</kbd>
        </div>
        <div id="searchResults" class="search-results">
          <div class="search-empty">Start typing to search…</div>
        </div>
        <div class="search-palette__footer">
          <span><kbd>↑↓</kbd> Navigate</span>
          <span><kbd>↵</kbd> Go</span>
          <span><kbd>Esc</kbd> Close</span>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const input   = overlay.querySelector('#searchPaletteInput');
    let results   = [];
    let activeIdx = -1;

    input.focus();

    input.addEventListener('input', () => {
      activeIdx = -1;
      results   = getResults(input.value.trim());
      renderResults(results, activeIdx);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Escape')    { e.preventDefault(); close(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx+1, results.length-1); renderResults(results, activeIdx); scrollActiveIntoView(); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); renderResults(results, activeIdx); scrollActiveIntoView(); return; }
      if (e.key === 'Enter' && results.length) {
        e.preventDefault();
        const idx = activeIdx >= 0 ? activeIdx : 0;
        if (results[idx]) navigate(results[idx]);
      }
    });

    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  }

  function scrollActiveIntoView() {
    overlay?.querySelector('.search-result.is-active')?.scrollIntoView({ block:'nearest' });
  }

  function close() {
    overlay?.remove();
    overlay = null;
  }

  function isOpen() { return !!overlay; }

  // ── Global keyboard shortcut ──────────────────────────────
  document.addEventListener('keydown', e => {
    const onInput = document.activeElement?.tagName === 'INPUT' ||
                    document.activeElement?.tagName === 'TEXTAREA' ||
                    document.activeElement?.tagName === 'SELECT';
    // Cmd+K (Mac) or Ctrl+K (Windows/Linux) — always fires
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      isOpen() ? close() : open();
      return;
    }
    // Also open on '/' when not in an input
    if (e.key === '/' && !onInput && !isOpen()) {
      e.preventDefault();
      open();
    }
  });

  return { open, close, isOpen };
})();

/* ==== js/shortcuts.js ==== */
'use strict';
/* ═══════════════════════════════════════════════════════════
   SHORTCUTS.JS v1 — Keyboard shortcuts (Feature 6)

   Navigation (press G then the key):
     G → D   Dashboard
     G → I   Inventory
     G → R   Reports
     G → F   Forecast
     G → H   History
     G → S   Suppliers

   Actions (single key, outside inputs):
     N       New sale (dashboard only)
     /       Open search palette
     ?       Show this cheat-sheet
     Esc     Close any modal / cheat-sheet
   ═══════════════════════════════════════════════════════════ */

App.shortcuts = (() => {
  let gPressed = false;    // "g" prefix for nav sequences
  let gTimer   = null;     // reset g-state after 1.5s
  let sheetEl  = null;     // cheat-sheet overlay element

  const NAV_MAP = {
    d:'dashboard', i:'inventory', r:'reports',
    f:'prediction', h:'history',  s:'suppliers', ',':'settings',
  };

  // ── helpers ────────────────────────────────────────────────
  function inInput() {
    const tag = document.activeElement?.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'
        || document.activeElement?.isContentEditable;
  }

  function setG(val) {
    gPressed = val;
    clearTimeout(gTimer);
    if (val) gTimer = setTimeout(() => { gPressed = false; }, 1500);
  }

  // ── cheat-sheet overlay ────────────────────────────────────
  function showSheet() {
    if (sheetEl) return;
    sheetEl = document.createElement('div');
    sheetEl.className = 'ksheet-overlay';
    sheetEl.innerHTML = `
      <div class="ksheet">
        <div class="ksheet__head">
          <span>Keyboard Shortcuts</span>
          <button class="ksheet__close" id="ksheetClose">✕</button>
        </div>
        <div class="ksheet__body">
          <div class="ksheet__group">
            <div class="ksheet__group-label">Navigation — press G then</div>
            ${[['G D','Dashboard'],['G I','Inventory'],['G R','Reports'],
               ['G F','Forecast'], ['G H','History'], ['G S','Suppliers'],['G ,','Settings']]
              .map(([k,l])=>`<div class="ksheet__row"><kbd>${k}</kbd><span>${l}</span></div>`).join('')}
          </div>
          <div class="ksheet__group">
            <div class="ksheet__group-label">Actions</div>
            ${[['N','New sale (dashboard)'],['/ or ⌘K','Search'],['?','This cheat-sheet'],['Esc','Close / cancel']]
              .map(([k,l])=>`<div class="ksheet__row"><kbd>${k}</kbd><span>${l}</span></div>`).join('')}
          </div>
        </div>
      </div>`;
    document.body.appendChild(sheetEl);
    sheetEl.querySelector('#ksheetClose').addEventListener('click', hideSheet);
    sheetEl.addEventListener('click', e => { if (e.target === sheetEl) hideSheet(); });
  }

  function hideSheet() {
    sheetEl?.remove();
    sheetEl = null;
  }

  // ── main handler ───────────────────────────────────────────
  document.addEventListener('keydown', e => {
    // Never fire inside an input unless it's Escape
    if (e.key !== 'Escape' && inInput()) return;
    // Never fire if a modifier is held (except Shift for ?)
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const k = e.key.toLowerCase();

    // Escape: close cheat-sheet
    if (e.key === 'Escape') {
      if (sheetEl) { hideSheet(); setG(false); }
      return;
    }

    // ? → cheat-sheet
    if (e.key === '?') { e.preventDefault(); showSheet(); return; }

    // G prefix — set pending state
    if (k === 'g' && !gPressed) {
      setG(true);
      e.preventDefault();
      return;
    }

    // G+<letter> → navigate
    if (gPressed && NAV_MAP[k]) {
      e.preventDefault();
      setG(false);
      App.router.go(NAV_MAP[k]);
      return;
    }

    // N → new sale (only on dashboard)
    if (k === 'n' && App.router.current === 'dashboard') {
      e.preventDefault();
      document.getElementById('btnAddSale')?.click();
      return;
    }

    // Reset g state on any other key
    if (gPressed) setG(false);
  });

  return { showSheet, hideSheet };
})();

          <span style="font-size:0.78rem;color:var(--purple);">${App.fmt.duration(me.totalTimeMs)}</span>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-row">
          <div class="settings-row__label">
            <div class="settings-row__name">Change Password</div>
            <div class="settings-row__desc">Update your login password</div>
          </div>
          <button class="btn btn--ghost btn--sm" id="btnChangePass">Change…</button>
        </div>
      </section>

      <!-- ── App Info ── -->
      <section class="panel settings-section">
        <div class="panel__header"><span class="panel__title">App Info</span></div>
        <div class="settings-row">
          <div class="settings-row__label">
            <div class="settings-row__name">Version</div>
          </div>
          <span style="font-size:0.68rem;color:var(--text-3);">SaleStew v3.0</span>
        </div>
        <div class="settings-row">
          <div class="settings-row__label">
            <div class="settings-row__name">Sales Records</div>
          </div>
          <span style="font-size:0.78rem;color:var(--green);">${App.db.getEntries().length}</span>
        </div>
        <div class="settings-row">
          <div class="settings-row__label">
            <div class="settings-row__name">Inventory Products</div>
          </div>
          <span style="font-size:0.78rem;color:var(--orange);">${App.db.getInventory().length}</span>
        </div>
        <div class="settings-row">
          <div class="settings-row__label">
            <div class="settings-row__name">Activity Log Entries</div>
            <div class="settings-row__desc">Audit trail of all actions</div>
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <span style="font-size:0.78rem;color:var(--purple);">${App.actLog.get().length}</span>
            <a id="goToLog" style="font-size:0.62rem;color:var(--green);cursor:pointer;text-decoration:underline;text-underline-offset:3px;">View →</a>
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-row__label">
            <div class="settings-row__name">Local Storage Usage</div>
            <div class="settings-row__desc">Estimated data stored in this browser</div>
          </div>
          <div id="storageBar" style="display:flex;align-items:center;gap:0.5rem;"></div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-row">
          <div class="settings-row__label">
            <div class="settings-row__name">Export Activity Log</div>
            <div class="settings-row__desc">Download log as CSV</div>
          </div>
          <button class="btn btn--ghost btn--sm" id="btnExportLog">⬇ Export CSV</button>
        </div>
        <div class="settings-row">
          <div class="settings-row__label">
            <div class="settings-row__name">Clear Activity Log</div>
            <div class="settings-row__desc">Permanently removes all log entries</div>
          </div>
          <button class="btn btn--danger" id="btnClearLog" style="border:1px solid rgba(160,72,72,0.3);">Clear Log</button>
        </div>
      </section>

    </div>`;

  app.appendChild(page);

  // ── Wire theme ──────────────────────────────────────────
  page.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', () => {
      App.theme.apply(btn.dataset.theme);
      page.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('is-active', b===btn));
    });
  });

  // ── Wire currency ───────────────────────────────────────
  page.querySelectorAll('[data-cur]').forEach(btn => {
    btn.addEventListener('click', () => {
      App.currency.set(btn.dataset.cur);
      App.actLog.record(App.actLog.TYPES.SETTINGS, `Currency → ${btn.dataset.cur}`);
      page.querySelectorAll('[data-cur]').forEach(b => b.classList.toggle('is-active', b===btn));
      App.toast(`Currency set to ${btn.dataset.cur}.`);
    });
  });

  // ── Wire threshold ──────────────────────────────────────
  document.getElementById('btnSaveThresh').addEventListener('click', () => {
    const v = parseInt(document.getElementById('threshInput').value);
    if (isNaN(v) || v < 0) { App.toast('Enter a valid threshold.','warn'); return; }
    App.db.setSettings({ ...App.db.getSettings(), globalLowStockThreshold: v });
    App.actLog.record(App.actLog.TYPES.SETTINGS, `Low-stock threshold → ${v}`);
    App.toast('Threshold saved.');
  });

  // ── Wire exchange rate ──────────────────────────────────
  document.getElementById('btnSaveRate').addEventListener('click', () => {
    const v = parseInt(document.getElementById('rateInput').value);
    if (!v || v < 1) { App.toast('Enter a valid rate.','warn'); return; }
    App.NAIRA_PER_USD = v;
    localStorage.setItem('ss_usd_rate', v);
    App.actLog.record(App.actLog.TYPES.SETTINGS, `USD rate → ₦${v}`);
    App.toast(`Rate updated: $1 = ₦${v}`);
  });

  // ── Wire password change ────────────────────────────────
  document.getElementById('btnChangePass').addEventListener('click', () => {
    App.modal({
      title: 'Change Password', size: 'sm',
      html: `
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input class="form-input" id="cpCurrent" type="password" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="form-input" id="cpNew" type="password" placeholder="min. 6 chars" />
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input class="form-input" id="cpConfirm" type="password" placeholder="repeat new password" />
        </div>`,
      saveLabel: 'Update Password',
      async onSave(close) {
        const current = document.getElementById('cpCurrent').value;
        const newPass = document.getElementById('cpNew').value;
        const confirm = document.getElementById('cpConfirm').value;
        if (!current || !newPass)      { App.toast('All fields required.','warn'); return; }
        if (newPass.length < 6)        { App.toast('New password must be ≥ 6 chars.','warn'); return; }
        if (newPass !== confirm)        { App.toast('Passwords do not match.','warn'); return; }
        // Verify current
        const res = await App.auth.login({ username: sess.username, password: current });
        if (!res.ok) { App.toast('Current password is incorrect.','error'); return; }
        // Update
        const users2 = App.auth.getUsers();
        const idx    = users2.findIndex(u => u.id === sess.userId);
        if (idx > -1) {
          users2[idx].hash = await App.auth.hash(newPass);
          App.store.set(App.auth.USERS_KEY, users2);
        }
        App.actLog.record(App.actLog.TYPES.SETTINGS, 'Password changed');
        App.toast('Password updated successfully.');
        close();
      },
    });
  });

  // ── Wire log links ──────────────────────────────────────
  document.getElementById('goToLog')?.addEventListener('click', () => App.router.go('activity'));

  // ── Wire log export ─────────────────────────────────────
  document.getElementById('btnExportLog')?.addEventListener('click', () => {
    const log = App.actLog.get();
    if (!log.length) { App.toast('No log entries to export.','warn'); return; }
    const headers = ['Timestamp','Type','Action','Detail','User','Page'];
    const rows = log.map(e => [
      new Date(e.ts).toLocaleString('en-NG'),
      e.type,
      App.actLog.LABELS[e.type] || e.type,
      e.detail,
      e.user,
      e.page,
    ]);
    App.csv.download('salestew_activity_log.csv', App.csv.stringify([headers, ...rows]));
    App.toast('Activity log exported.');
  });

  // ── Storage usage bar ────────────────────────────────────
  (() => {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      total += (key?.length || 0) + (localStorage.getItem(key)?.length || 0);
    }
    const kb = (total * 2 / 1024).toFixed(1); // UTF-16 = 2 bytes per char
    const pct = Math.min(100, Math.round(total * 2 / (5 * 1024 * 1024) * 100));
    const barColor = pct > 80 ? 'var(--down)' : pct > 50 ? 'var(--orange)' : 'var(--green)';
    const bar = document.getElementById('storageBar');
    if (bar) bar.innerHTML = `
      <div class="progress" style="width:80px;height:6px;">
        <div class="progress__fill" style="width:${pct}%;background:${barColor};"></div>
      </div>
      <span style="font-size:0.68rem;color:var(--text-3);">${kb} KB</span>`;
  })();

  document.getElementById('btnClearLog').addEventListener('click', () => {
    if (!confirm('Clear all activity log entries? This cannot be undone.')) return;
    App.actLog.clear();
    App.toast('Activity log cleared.', 'warn');
    App.router.go('settings');
  });
});

// ── PROFILE PAGE (alias → settings) ──────────────────────
App.router.register('profile', () => App.router.go('settings'));

// ── ACTIVITY LOG PAGE ─────────────────────────────────────
App.router.register('activity', () => {
  const sess = App.auth.requireSession(); if (!sess) return;
  document.title = 'Activity Log — SaleStew';

  const app = document.getElementById('app');
  app.innerHTML = '';
  App.buildNav('activity');

  const page = document.createElement('main');
  page.className = 'page';
  page.innerHTML = `
    <header class="page-header">
      <div>
        <h1 class="page-header__title">Activity Log</h1>
        <p class="page-header__sub">// audit trail — last ${App.actLog.MAX} actions</p>
      </div>
      <div class="page-header__controls">
        <input class="search-input" id="logSearch" type="text" placeholder="Filter actions…" style="min-width:180px;" />
        <select class="form-input" id="logTypeFilter" style="width:auto;">
          <option value="all">All Types</option>
          <option value="sale">Sales</option>
          <option value="inv">Inventory</option>
          <option value="supplier">Suppliers</option>
          <option value="goal">Goals</option>
          <option value="import">Imports</option>
          <option value="backup">Backups</option>
          <option value="auth">Auth</option>
          <option value="settings">Settings</option>
        </select>
        ${sess.role==='admin' ? '<button class="btn btn--danger" id="btnClearLogPage" style="border:1px solid rgba(160,72,72,0.3);">Clear Log</button>' : ''}
      </div>
    </header>

    <section class="panel">
      <div class="table-controls">
        <span class="panel__title">Recent Activity</span>
        <span class="u-muted" style="font-size:0.62rem;" id="logCount"></span>
      </div>
      <div id="logList" class="activity-list"></div>
    </section>`;

  app.appendChild(page);

  // Type filter groups
  const TYPE_GROUPS = {
    sale:     ['sale_add','sale_edit','sale_delete'],
    inv:      ['inv_add','inv_edit','inv_delete'],
    supplier: ['supplier_add','supplier_edit','supplier_delete'],
    goal:     ['goal_add','goal_delete'],
    import:   ['import'],
    backup:   ['backup_export','backup_import'],
    auth:     ['login','logout'],
    settings: ['settings'],
  };

  let searchQ = '', typeFilter = 'all';

  function getFiltered() {
    const q = searchQ.toLowerCase();
    return App.actLog.get().filter(entry => {
      if (typeFilter !== 'all') {
        const group = TYPE_GROUPS[typeFilter] || [];
        if (!group.includes(entry.type)) return false;
      }
      if (q) {
        return entry.detail.toLowerCase().includes(q) ||
               entry.user.toLowerCase().includes(q)  ||
               (App.actLog.LABELS[entry.type]||'').toLowerCase().includes(q);
      }
      return true;
    });
  }

  function render() {
    const entries = getFiltered();
    document.getElementById('logCount').textContent = `${entries.length} entr${entries.length!==1?'ies':'y'}`;
    const list = document.getElementById('logList');

    if (!entries.length) {
      list.innerHTML = `
        <div class="activity-empty">
          <div style="font-size:2rem;margin-bottom:0.75rem;">📋</div>
          <div>${App.actLog.get().length === 0 ? 'No activity recorded yet. Start using the app!' : 'No entries match your filter.'}</div>
        </div>`;
      return;
    }

    // Group by date
    const grouped = {};
    entries.forEach(e => {
      const day = e.ts.slice(0, 10);
      if (!grouped[day]) grouped[day] = [];
      grouped[day].push(e);
    });

    list.innerHTML = Object.entries(grouped).map(([day, items]) => `
      <div class="activity-day-group">
        <div class="activity-day-label">${App.fmt.date(day)}</div>
        ${items.map(e => {
          const icon  = App.actLog.ICONS[e.type] || '●';
          const label = App.actLog.LABELS[e.type] || e.type;
          const time  = new Date(e.ts).toLocaleTimeString('en-NG', { hour:'2-digit', minute:'2-digit' });
          const typeClass = e.type.includes('delete') ? 'activity-item--delete'
            : e.type.includes('add') || e.type === 'login' ? 'activity-item--add'
            : 'activity-item--edit';
          return `
            <div class="activity-item ${typeClass}">
              <span class="activity-item__icon">${icon}</span>
              <div class="activity-item__body">
                <span class="activity-item__action">${label}</span>
                ${e.detail ? `<span class="activity-item__detail">${e.detail}</span>` : ''}
              </div>
              <div class="activity-item__meta">
                <span class="activity-item__user">${e.user}</span>
                <span class="activity-item__time">${time}</span>
              </div>
            </div>`;
        }).join('')}
      </div>`).join('');
  }

  document.getElementById('logSearch').addEventListener('input', e => { searchQ = e.target.value; render(); });
  document.getElementById('logTypeFilter').addEventListener('change', e => { typeFilter = e.target.value; render(); });
  document.getElementById('btnClearLogPage')?.addEventListener('click', () => {
    if (!confirm('Clear all activity log entries?')) return;
    App.actLog.clear();
    App.toast('Log cleared.', 'warn');
    render();
  });

  render();
});

/* ==== js/boot.js ==== */
'use strict';
/* ═══════════════════════════════════════════════════════════
   BOOT.JS v3.1
   ═══════════════════════════════════════════════════════════ */

(async function init() {
  // Respect system colour scheme on very first visit (no stored preference)
  if (!localStorage.getItem('ss_theme')) {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    localStorage.setItem('ss_theme', prefersDark ? 'dark' : 'light');
  }
  App.theme.apply(App.theme.current());

  // Restore saved USD exchange rate (if admin changed it in settings)
  const savedRate = parseInt(localStorage.getItem('ss_usd_rate'));
  if (savedRate && savedRate > 0) App.NAIRA_PER_USD = savedRate;

  await App.auth.seedAdmin();
  App.db.seedData();
  App.currency.current = localStorage.getItem('ss_currency') || 'NGN';

  // Set print date stamp used by @media print footer
  document.body.setAttribute('data-print-date', new Date().toLocaleDateString('en-NG', {
    day:'2-digit', month:'short', year:'numeric',
  }));

  const hash = window.location.hash.replace('#','') || '';
  const sess = App.auth.getSession();
  const pub  = ['login','signup'];
  const priv = ['dashboard','inventory','reports','prediction','history',
                'admin','suppliers','import','profile','settings','activity'];

  let start;
  if (!sess) start = pub.includes(hash)  ? hash : 'login';
  else       start = priv.includes(hash) ? hash : 'dashboard';
  App.router.go(start);

  // Accumulate time on close/refresh
  window.addEventListener('beforeunload', () => {
    const session = App.auth.getSession();
    if (!session) return;
    const duration = Date.now() - session.loginTime;
    const users    = App.auth.getUsers();
    const idx      = users.findIndex(u => u.id === session.userId);
    if (idx > -1) {
      users[idx].totalTimeMs = (users[idx].totalTimeMs||0) + duration;
      App.store.set(App.auth.USERS_KEY, users);
    }
    session.loginTime = Date.now();
    App.store.set(App.auth.SESSION_KEY, session);
  });
})();

  </script>
</body>
